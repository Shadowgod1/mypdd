<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   Тёмно-зелёная редакторская тема.
   Базовое состояние — тёмное. Светлая «бумажная» тема
   включается только явным переключателем [data-theme="light"].
   ============================================================ */
:root{
  color-scheme:dark;

  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --bg:#0A120E;
  --surface:#111F18;
  --surface-2:#1A2B22;
  --ink:#EDF3EE;
  --ink-2:#9BB5A6;
  --ink-3:#6E8A7B;
  --line:#1E3228;
  --line-2:#2C4A3B;

  --accent:#4EA37B;
  --accent-deep:#1F6B4A;
  --accent-soft:#12291F;
  --on-accent:#F0F5F1;
  --moss:#A9BC7E;

  --ok:#57BC8B;
  --ok-soft:#102A1F;
  --bad:#D8785F;
  --bad-soft:#2A1712;
  --warn:#C79A4B;

  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -22px rgba(0,0,0,.9);

  /* схемы дорожных ситуаций */
  --road:#33453B;
  --road-edge:#43584C;
  --field:#16241C;
  --mark:#D6E2D8;
  --scene-bg:#0D1712;
  --fig-ink:#DCE7DE;

  --r:12px;
  --r-sm:9px;
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F0E9;
  --surface:#FBFAF6;
  --surface-2:#EAE8DF;
  --ink:#152019;
  --ink-2:#4A5A50;
  --ink-3:#78887E;
  --line:#DEDBD0;
  --line-2:#C9C5B7;

  --accent:#1F6B4A;
  --accent-deep:#1F6B4A;
  --accent-soft:#E3EEE7;
  --on-accent:#FBFAF6;
  --moss:#6E7C46;

  --ok:#1D7A4C;
  --ok-soft:#E4F1E9;
  --bad:#B0503B;
  --bad-soft:#F7E9E4;
  --warn:#8E6A26;

  --shadow:0 1px 2px rgba(21,32,25,.05), 0 12px 32px -18px rgba(21,32,25,.28);

  --road:#8B928A;
  --road-edge:#A7AEA4;
  --field:#DCE2D5;
  --mark:#FBFAF6;
  --scene-bg:#EEECE4;
  --fig-ink:#152019;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{
  font-family:var(--serif);
  font-weight:600;
  margin:0;
  text-wrap:balance;
  line-height:1.18;
  letter-spacing:-.012em;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:680px;margin:0 auto;padding:0 24px}

/* ---------- шапка ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.2) blur(14px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:680px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px;min-height:60px}
.brand{
  display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-size:21px;
  font-weight:600;letter-spacing:-.01em;text-decoration:none;color:inherit;
}
.brand svg{align-self:center;color:var(--accent)}
.brand b{font-weight:600}
.brand span{
  font-family:var(--mono);color:var(--ink-3);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:400;
}
.bar-sp{flex:1;min-width:0}
.icon-btn{
  background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:0 0 auto;
  transition:background .18s, color .18s, border-color .18s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}

/* ---------- титульный блок ---------- */
.hero{padding:76px 0 40px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--moss);display:flex;align-items:center;gap:14px;margin-bottom:22px;font-weight:500;
}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line)}
.hero h1{font-size:clamp(38px,8.5vw,58px);font-weight:600;letter-spacing:-.022em;line-height:1.08}
.hero p{color:var(--ink-2);margin:20px 0 0;max-width:52ch;font-size:18px}

/* ---------- режимы ---------- */
.modes{display:grid;gap:12px;margin:44px 0 0}
.mode{
  display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:18px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;text-align:left;cursor:pointer;
  transition:border-color .2s, background .2s;
}
.mode:hover{border-color:var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.mode .m-ic{width:46px;height:46px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode .m-t{display:block;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.mode .m-d{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.5;margin-top:4px}
.mode .m-go{color:var(--ink-3)}
.mode.primary{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
.mode.primary .m-d{color:color-mix(in srgb, var(--on-accent) 76%, transparent)}
.mode.primary .m-ic{background:color-mix(in srgb, var(--on-accent) 14%, transparent);color:var(--on-accent)}
.mode.primary .m-go{color:color-mix(in srgb, var(--on-accent) 62%, transparent)}
.mode.primary:hover{border-color:var(--accent)}

/* ---------- статистика ---------- */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:40px;
}
.stat{background:var(--surface);padding:20px 12px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- темы ---------- */
.topics{display:grid;gap:8px;margin-top:18px}
.topic{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px 14px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 18px;
  cursor:pointer;text-align:left;transition:border-color .2s;
}
.topic:hover{border-color:var(--accent)}
.topic-n{font-size:16px}
.topic-c{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tprog{height:2px;border-radius:2px;background:var(--line-2);grid-column:1/-1;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--ok);border-radius:2px}

/* ---------- рубрики и врезки ---------- */
.sec-h{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:56px 0 18px;display:flex;align-items:center;gap:14px;font-weight:500;
}
.sec-h::after{content:"";height:1px;flex:1;background:var(--line)}

.note{
  border:1px solid var(--line);border-left:2px solid var(--moss);background:var(--surface);
  border-radius:var(--r-sm);padding:20px 22px;font-size:15px;line-height:1.6;color:var(--ink-2);margin-top:24px;
}
.note b{color:var(--ink);font-weight:600}

footer{padding:72px 0 88px;color:var(--ink-3);font-size:13.5px;text-align:center;line-height:1.7}
footer a{color:var(--ink-2)}

/* ---------- ход прохождения ---------- */
.qbar{display:flex;align-items:center;gap:14px;width:100%}
.qcount{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.qcount b{color:var(--ink);font-weight:500}
.track{flex:1;height:2px;background:var(--line-2);border-radius:2px;overflow:hidden;min-width:30px}
.track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.timer{
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;padding:5px 10px;
  border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;
}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

/* ---------- карточка вопроса ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:28px;
}
.figure{
  background:var(--scene-bg);border-bottom:1px solid var(--line);padding:26px 20px;
  display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;
}
.figure svg{width:100%;max-width:430px;height:auto;display:block}
.figure.sign svg{width:126px}
.q-topic{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--moss);padding:24px 26px 0;font-weight:500;
}
.q-text{padding:12px 26px 22px;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.38;letter-spacing:-.011em;margin:0}

.opts{display:grid;gap:9px;padding:0 18px 18px}
.opt{
  display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;
  background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:15px 16px;text-align:left;cursor:pointer;width:100%;font-size:16px;line-height:1.5;
  transition:border-color .16s, background .16s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .n{
  font-family:var(--mono);font-size:12px;width:28px;height:28px;border-radius:7px;
  background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:var(--ok);border-color:var(--ok);color:#08150F}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{background:var(--bad);border-color:var(--bad);color:#25100B}

.exp{
  margin:0 18px 18px;border-radius:var(--r-sm);padding:18px 20px;font-size:15.5px;
  line-height:1.62;border:1px solid var(--line);color:var(--ink-2);
}
.exp.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.exp.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.exp .verdict{
  font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;
  display:block;margin-bottom:9px;font-weight:500;
}
.exp.ok .verdict{color:var(--ok)}
.exp.no .verdict{color:var(--bad)}

/* ---------- кнопки ---------- */
.actions{display:flex;gap:12px;padding:28px 0 64px}
.btn{
  flex:1;border:1px solid var(--accent-deep);background:var(--accent-deep);color:var(--on-accent);
  border-radius:var(--r-sm);padding:15px 22px;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;letter-spacing:.005em;
  transition:background .18s, border-color .18s, opacity .18s;
}
.btn:hover{background:color-mix(in srgb, var(--accent-deep) 82%, var(--accent));border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2);flex:0 0 auto;font-weight:400}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--accent);color:var(--ink)}
.btn.acc{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}

/* ---------- результат ---------- */
.verdict-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:52px 32px;text-align:center;box-shadow:var(--shadow);margin-top:32px;
}
.ring{width:138px;height:138px;margin:0 auto 26px;display:block}
.verdict-card h2{font-size:34px;font-weight:600;letter-spacing:-.02em}
.verdict-card .sub{color:var(--ink-2);margin-top:12px;font-size:16px;line-height:1.6;max-width:46ch;margin-left:auto;margin-right:auto}
.rstats{display:flex;justify-content:center;gap:40px;margin-top:32px;flex-wrap:wrap}
.rstats div{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.rstats b{display:block;color:var(--ink);font-size:24px;letter-spacing:-.02em;margin-bottom:4px;font-weight:400}

.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px 22px;margin-top:10px}
.rev .rq{font-family:var(--serif);font-size:17.5px;line-height:1.42;letter-spacing:-.008em}
.rev .ra{font-size:14.5px;margin-top:12px;color:var(--ink-2);line-height:1.55}
.rev .ra b{color:var(--ok);font-weight:600}
.rev .rn{color:var(--bad)}
.rev .rx{font-size:14.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}

/* ---------- длинный текст ---------- */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:36px 34px 40px;margin-top:24px}
.prose h3{font-size:23px;margin:44px 0 14px;letter-spacing:-.015em}
.prose h3:first-child{margin-top:0}
.prose p{margin:0 0 16px;color:var(--ink-2);font-size:16px;line-height:1.68}
.prose ul{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:16px;line-height:1.68}
.prose li{margin-bottom:9px}
.prose strong{color:var(--ink);font-weight:600}
.prose ul.credits{font-family:var(--mono);font-size:11.5px;line-height:1.7;columns:2;column-gap:32px;margin-bottom:20px}
.prose ul.credits li{margin-bottom:5px;break-inside:avoid}
.prose a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.prose a:hover{color:var(--ink)}
.prose code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-family:var(--mono);font-size:13px;color:var(--ink)}
@media (max-width:520px){.prose ul.credits{columns:1}}

@media (max-width:520px){
  body{font-size:16.5px}
  .wrap{padding:0 18px}
  .bar-in{padding:10px 18px}
  .hero{padding:48px 0 30px}
  .hero p{font-size:17px}
  .modes{margin-top:32px}
  .mode{padding:17px;gap:15px}
  .q-text{font-size:19.5px;padding:10px 20px 18px}
  .q-topic{padding:20px 20px 0}
  .opts{padding:0 14px 14px}
  .opt{font-size:15.5px;padding:14px}
  .exp{margin:0 14px 14px;padding:16px}
  .prose{padding:26px 22px 30px}
  .verdict-card{padding:38px 22px}
  .sec-h{margin:42px 0 16px}
  .brand span{display:none}
  .rstats{gap:26px}
}
.pill-t{font-family:var(--mono);font-weight:500;letter-spacing:.02em}
.ring-pct{font-family:var(--serif);font-weight:600;letter-spacing:-.02em}

/* ============================================================
   МОБИЛЬНЫЕ УСТРОЙСТВА: безопасные зоны, касания, отклики
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mode,.topic,.opt,.btn,.icon-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* вырез и «дом-бар» iPhone */
.bar{padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.bar-in{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
footer{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.actions{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* размеры под палец: не меньше 48px */
.btn,.icon-btn{min-height:48px}
.opt{min-height:48px}
.mode{min-height:64px}
.topic{min-height:56px}

.lang-btn{width:auto;min-width:52px;padding:0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:500}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}

/* на сенсорных экранах наведение «залипает» — гасим его */
@media (hover:none){
  .mode:hover{border-color:var(--line)}
  .mode.primary:hover{border-color:var(--accent-deep)}
  .topic:hover{border-color:var(--line)}
  .opt:hover:not(:disabled){border-color:var(--line-2);background:transparent}
  .icon-btn:hover{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
  .btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn.ghost:hover{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
  .prose a:hover{color:var(--accent)}
}
/* отклик на нажатие вместо наведения */
.mode:active,.topic:active,.opt:active:not(:disabled){transform:scale(.994)}
.btn:active:not(:disabled),.icon-btn:active{opacity:.82}
.opt.sel,.opt.right,.opt.wrong{transform:none}

/* длинная надрубрика не должна ломаться об линейку */
@media (max-width:430px){
  .eyebrow{gap:10px;line-height:1.45}
  .eyebrow::after{display:none}
}

/* очень узкие экраны (iPhone SE и подобные) */
@media (max-width:360px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1/-1}
  .rstats{gap:18px}
  .lang-btn{min-width:46px;padding:0 9px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">

<script>
/* ============================================================
   ГРАФИКА: дорожные знаки и схемы перекрёстков (чистый SVG)
   ============================================================ */
const RED='#D0342C', BLUE='#12569E', YEL='#F2C31B', BLK='#151515', WHT='#FFFFFF';

function sv(inner,vb){return '<svg viewBox="'+(vb||'0 0 100 100')+'" xmlns="http://www.w3.org/2000/svg" role="img">'+inner+'</svg>';}

/* пешеход — используется в схемах */
function ped(cx,cy,s,fill){
  return '<g transform="translate('+cx+','+cy+') scale('+s+')" fill="'+fill+'">'+
  '<circle cx="0" cy="-20" r="5.4"/>'+
  '<path d="M-2 -13 L4 -13 L9 0 L5 2 L1 -5 L1 4 L8 20 L3.5 22 L-3 8 L-8 21 L-12 19 L-6 2 L-6 -6 L-10 1 L-13 -1 Z"/></g>';
}

/* --- дорожные знаки: спрайт из Викисклада (см. КРЕДИТЫ) --- */
const SIGNS = {"main": {"n": "Главная дорога", "vb": "0 0 952.68 952.68", "ar": 1.0, "code": "2.1"}, "mainEnd": {"n": "Конец главной дороги", "vb": "0 0 952.68 952.68", "ar": 1.0, "code": "2.2"}, "giveway": {"n": "Уступите дорогу", "vb": "0 0 834.12 734.42", "ar": 0.8805, "code": "2.4"}, "stop": {"n": "Движение без остановки запрещено", "vb": "0 0 700 700", "ar": 1.0, "code": "2.5"}, "noentry": {"n": "Въезд запрещён", "vb": "0 0 700 700", "ar": 1.0, "code": "3.1"}, "novehicle": {"n": "Движение запрещено", "vb": "0 0 700 700", "ar": 1.0, "code": "3.2"}, "noRight": {"n": "Поворот направо запрещён", "vb": "0 0 700 700", "ar": 1.0, "code": "3.18.1"}, "noLeft": {"n": "Поворот налево запрещён", "vb": "0 0 700 700", "ar": 1.0, "code": "3.18.2"}, "noOvertake": {"n": "Обгон запрещён", "vb": "0 0 600 600", "ar": 1.0, "code": "3.20"}, "sp20": {"n": "Ограничение максимальной скорости", "vb": "0 0 600 600", "ar": 1.0, "code": "3.24-20"}, "sp40": {"n": "Ограничение максимальной скорости", "vb": "0 0 600 600", "ar": 1.0, "code": "3.24-40"}, "sp50": {"n": "Ограничение максимальной скорости", "vb": "0 0 700 700", "ar": 1.0, "code": "3.24-50"}, "sp60": {"n": "Ограничение максимальной скорости", "vb": "0 0 600 600", "ar": 1.0, "code": "3.24-60"}, "noStop": {"n": "Остановка запрещена", "vb": "0 0 700 700", "ar": 1.0, "code": "3.27"}, "noPark": {"n": "Стоянка запрещена", "vb": "0 0 700 700", "ar": 1.0, "code": "3.28"}, "fwdOnly": {"n": "Движение прямо", "vb": "0 0 700 700", "ar": 1.0, "code": "4.1.1"}, "rightOnly": {"n": "Движение направо", "vb": "0 0 700 700", "ar": 1.0, "code": "4.1.2"}, "roundabout": {"n": "Круговое движение", "vb": "0 0 700 700", "ar": 1.0, "code": "4.3"}, "crosswalk": {"n": "Пешеходный переход", "vb": "0 0 700 700", "ar": 1.0, "code": "5.19.1"}, "residential": {"n": "Жилая зона", "vb": "0 0 600 900", "ar": 1.5, "code": "5.21"}, "crossWarn": {"n": "Пешеходный переход", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.22"}, "children": {"n": "Дети", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.23"}, "rwBarrier": {"n": "Ж/д переезд со шлагбаумом", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.1"}, "rwNoBar": {"n": "Ж/д переезд без шлагбаума", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.2"}, "bump": {"n": "Искусственная неровность", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.17"}, "slippery": {"n": "Скользкая дорога", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.15"}, "twoWay": {"n": "Двустороннее движение", "vb": "0 0 834.116 734.423", "ar": 0.8805, "code": "1.21"}};

function sign(code){
  const s = SIGNS[code];
  if(!s) return '';
  return '<svg viewBox="'+s.vb+'" role="img" aria-label="'+s.n+'"><use href="#sg-'+code+'"/></svg>';
}
/* знак на стойке — для схем перекрёстков */
function signPost(cx,cy,code,w){
  const s = SIGNS[code]; if(!s) return '';
  const h = w*s.ar;
  return '<rect x="'+(cx-1.7)+'" y="'+(cy+h/2-3)+'" width="3.4" height="15" rx="1.7" fill="#8A97A0"/>'+
    '<svg x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" viewBox="'+s.vb+'"><use href="#sg-'+code+'"/></svg>';
}

/* ============================================================
   СХЕМЫ ПЕРЕКРЁСТКОВ  —  viewBox 320 x 200, центр (160,100)
   ============================================================ */
const CAR_C = {you:'#4FB884', blue:'#4FB884', red:'#C86A52', white:'#E5EAE1', gray:'#7E8F84', tram:'#C79A4B'};
const APPR = {
  S:{rot:0,   idle:[144,152], stop:[144,136]},
  N:{rot:180, idle:[176,48],  stop:[176,64]},
  W:{rot:90,  idle:[52,116],  stop:[124,116]},
  E:{rot:270, idle:[268,84],  stop:[196,84]}
};
const EXITP = {N:[144,-6], S:[176,206], W:[-6,84], E:[326,116]};
const TURNS = {
  S:{straight:'N',left:'W',right:'E'},
  N:{straight:'S',left:'E',right:'W'},
  W:{straight:'E',left:'N',right:'S'},
  E:{straight:'W',left:'S',right:'N'}
};
let _uid = 0;

function pill(x,y,text){
  const w = Math.max(30, 11*text.length+16);
  return '<g transform="translate('+x+','+y+')">'+
    '<rect x="'+(-w/2)+'" y="-10.5" width="'+w+'" height="21" rx="10.5" fill="#08120D" opacity=".9"/>'+
    '<text x="0" y="1" class="pill-t" font-size="12.5" fill="#fff" text-anchor="middle" dominant-baseline="central">'+text+'</text></g>';
}

/* вид сверху: кузов со скруглённым носом, стёкла, крыша, зеркала */
function topCar(x,y,rot,color,label){
  const f = CAR_C[color]||color;
  const glass = 'rgba(226,240,248,.92)';
  let g = '<g transform="translate('+x+','+y+') rotate('+rot+')">'+
    '<ellipse cx="1" cy="2" rx="11.5" ry="19" fill="#000" opacity=".22"/>'+
    '<path d="M-9.6 -12.5 Q-9.6 -19.4 -4.6 -20 L4.6 -20 Q9.6 -19.4 9.6 -12.5 L9.6 13.6 Q9.6 19.2 4.6 19.7 L-4.6 19.7 Q-9.6 19.2 -9.6 13.6 Z" fill="'+f+'"/>'+
    '<path d="M-9.6 -12.5 Q-9.6 -19.4 -4.6 -20 L0 -20 L0 19.7 L-4.6 19.7 Q-9.6 19.2 -9.6 13.6 Z" fill="#fff" opacity=".1"/>'+
    '<path d="M-7.4 -12.2 Q-6.2 -15.6 0 -15.9 Q6.2 -15.6 7.4 -12.2 L6.6 -7.4 L-6.6 -7.4 Z" fill="'+glass+'"/>'+
    '<rect x="-7.6" y="-6.2" width="15.2" height="12.4" rx="3.4" fill="#000" opacity=".16"/>'+
    '<path d="M-6.6 7.4 L6.6 7.4 L5.6 12.4 L-5.6 12.4 Z" fill="'+glass+'" opacity=".82"/>'+
    '<rect x="-11.6" y="-10.4" width="2.6" height="5" rx="1.3" fill="'+f+'"/>'+
    '<rect x="9" y="-10.4" width="2.6" height="5" rx="1.3" fill="'+f+'"/>'+
    '<rect x="-8.4" y="-20.4" width="5.6" height="3" rx="1.5" fill="#FFEBB0"/>'+
    '<rect x="2.8" y="-20.4" width="5.6" height="3" rx="1.5" fill="#FFEBB0"/>'+
    '<rect x="-8.2" y="17.4" width="5.2" height="2.6" rx="1.3" fill="#E8574A"/>'+
    '<rect x="3" y="17.4" width="5.2" height="2.6" rx="1.3" fill="#E8574A"/>'+
    '</g>';
  if(label) g += pill(x, y+34, label);
  return g;
}

function tramCar(x,y,rot,label){
  const glass='rgba(226,240,248,.9)';
  let g = '<g transform="translate('+x+','+y+') rotate('+rot+')">'+
    '<rect x="-11" y="-29" width="24" height="60" rx="6" fill="#000" opacity=".22"/>'+
    '<rect x="-12" y="-30" width="24" height="60" rx="6" fill="#C08A26"/>'+
    '<path d="M-12 -30 h12 v60 h-12 z" fill="#fff" opacity=".08"/>'+
    '<path d="M-8.5 -25.5 h17 v9.5 h-17 Z" fill="'+glass+'"/>'+
    '<rect x="-9" y="-11" width="18" height="7" rx="2" fill="'+glass+'" opacity=".75"/>'+
    '<rect x="-9" y="3" width="18" height="7" rx="2" fill="'+glass+'" opacity=".75"/>'+
    '<rect x="-8.5" y="20" width="17" height="8" rx="2" fill="'+glass+'" opacity=".6"/>'+
    '<rect x="-6" y="-31" width="12" height="2.6" rx="1.3" fill="#FFEBB0"/></g>';
  if(label) g += pill(x, y+45, label);
  return g;
}

function trafficLight(x,y,state){
  const on = c => state===c ? ({red:'#E0342A',yellow:'#F0B41C',green:'#22A45D'})[c] : 'rgba(255,255,255,.14)';
  return '<g transform="translate('+x+','+y+')">'+
    '<rect x="-2" y="20" width="4" height="16" fill="#3C5145"/>'+
    '<rect x="-10" y="-25" width="20" height="50" rx="6" fill="#1E2E26" stroke="#0B1510" stroke-width="1.5"/>'+
    '<circle cx="0" cy="-14" r="5.4" fill="'+on('red')+'"/>'+
    '<circle cx="0" cy="0" r="5.4" fill="'+on('yellow')+'"/>'+
    '<circle cx="0" cy="14" r="5.4" fill="'+on('green')+'"/></g>';
}

/* регулировщик: pose = 'up' | 'side' | 'fwd' */
function warden(x,y,pose){
  const INK='var(--fig-ink)', SK='#E8B98F';
  /* жезл: чёрно-белые полосы, рисуется от точки кисти в заданную сторону */
  function baton(hx,hy,ang){
    let b='<g transform="translate('+hx+','+hy+') rotate('+ang+')">';
    for(let i=0;i<4;i++)
      b+='<rect x="'+(i*5.5)+'" y="-1.9" width="5.5" height="3.8" fill="'+(i%2?'#1A1A1A':'#F2F5F6')+'" stroke="#1A1A1A" stroke-width=".6"/>';
    return b+'</g>';
  }
  let arms='', bat='';
  if(pose==='up'){
    arms = '<path d="M0 -12 L1 -30" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<path d="M0 -12 L-12 -1" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="1" cy="-31" r="2.6" fill="'+SK+'"/>';
    bat = baton(1,-33,-90);
  } else if(pose==='side'){
    arms = '<path d="M0 -12 L-20 -12 M0 -12 L20 -12" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="21" cy="-12" r="2.6" fill="'+SK+'"/><circle cx="-21" cy="-12" r="2.6" fill="'+SK+'"/>';
    bat = baton(23,-12,0);
  } else {
    arms = '<path d="M0 -12 L19 -19" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<path d="M0 -12 L-11 -1" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="20" cy="-19" r="2.6" fill="'+SK+'"/>';
    bat = baton(22,-20,-14);
  }
  return '<g transform="translate('+x+','+y+')">'+
    '<ellipse cx="0" cy="28" rx="13" ry="4" fill="#000" opacity=".18"/>'+
    '<path d="M-6 -13 h12 l3 16 h-18 z" fill="'+INK+'"/>'+
    '<path d="M0 3 L-6 27 M0 3 L6 27" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M-7 26 h9 M-2 26 h9" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>'+
    arms +
    '<circle cx="0" cy="-21" r="6.4" fill="'+SK+'"/>'+
    '<path d="M-7.2 -24 a7.2 7.2 0 0 1 14.4 0 z" fill="'+INK+'"/>'+
    '<rect x="-8.4" y="-24.6" width="16.8" height="2.6" rx="1.3" fill="'+INK+'"/>'+
    '<rect x="-6.6" y="-14.6" width="13.2" height="3" rx="1.5" fill="#F2F5F6" opacity=".85"/>'+
    bat + '</g>';
}

function arrowPath(from,turn,startXY){
  const a = APPR[from];
  const to = TURNS[from][turn];
  const ex = EXITP[to];
  const s = startXY || a.idle;
  const st = a.stop;
  const id = 'ar'+(++_uid);
  let d;
  if(turn==='straight') d = 'M'+s[0]+' '+s[1]+' L'+ex[0]+' '+ex[1];
  else d = 'M'+s[0]+' '+s[1]+' L'+st[0]+' '+st[1]+' Q160 100 '+ex[0]+' '+ex[1];
  return '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink)"/></marker></defs>'+
    '<path d="'+d+'" fill="none" stroke="var(--fig-ink)" stroke-width="2.6" stroke-dasharray="7 6" opacity=".8" marker-end="url(#'+id+')"/>';
}

function zebra(side){
  const st='fill="var(--mark)"';
  let o='';
  if(side==='S'||side==='N'){
    const y = side==='S' ? 140 : 46;
    for(let i=0;i<7;i++) o+='<rect x="'+(130+i*9)+'" y="'+y+'" width="5" height="14" '+st+'/>';
  }else{
    const x = side==='W' ? 106 : 200;
    for(let i=0;i<7;i++) o+='<rect x="'+x+'" y="'+(70+i*9)+'" width="14" height="5" '+st+'/>';
  }
  return o;
}

function scene(sp){
  sp = sp||{};
  const arms = sp.arms || ['N','S','W','E'];
  let o = '<rect width="320" height="200" fill="var(--field)"/>';
  const hasV = arms.includes('N')||arms.includes('S');
  const hasH = arms.includes('W')||arms.includes('E');
  const vy0 = arms.includes('N')?0:68, vy1 = arms.includes('S')?200:132;
  const hx0 = arms.includes('W')?0:128, hx1 = arms.includes('E')?320:192;
  if(hasV) o += '<rect x="128" y="'+vy0+'" width="64" height="'+(vy1-vy0)+'" fill="var(--road)"/>';
  if(hasH) o += '<rect x="'+hx0+'" y="68" width="'+(hx1-hx0)+'" height="64" fill="var(--road)"/>';
  /* осевая разметка */
  const dash='stroke="var(--mark)" stroke-width="2.4" stroke-dasharray="10 9" opacity=".9"';
  const solid='stroke="var(--mark)" stroke-width="2.4" opacity=".9"';
  const vLine = sp.solidV ? solid : dash, hLine = sp.solidH ? solid : dash;
  if(arms.includes('N')) o += '<path d="M160 4 V62" '+vLine+'/>';
  if(arms.includes('S')) o += '<path d="M160 138 V196" '+vLine+'/>';
  if(arms.includes('W')) o += '<path d="M4 100 H122" '+hLine+'/>';
  if(arms.includes('E')) o += '<path d="M198 100 H316" '+hLine+'/>';
  (sp.zebra||[]).forEach(s=>{ o += zebra(s); });
  (sp.arrows||[]).forEach(a=>{ o += arrowPath(a.at, a.turn, a.from); });
  (sp.signs||[]).forEach(s=>{
    const pos = {S:[110,152],N:[210,48],W:[60,146],E:[260,54],SW:[110,152],SE:[210,152],NW:[110,48],NE:[210,48]}[s.at]||[110,152];
    o += signPost(pos[0],pos[1],s.code,s.size||34);
  });
  (sp.lights||[]).forEach(l=>{
    const pos = {S:[206,128],N:[114,72],W:[62,58],E:[258,142],C:[160,100]}[l.at]||[206,128];
    o += trafficLight(pos[0],pos[1],l.state);
  });
  if(sp.warden) o += warden(160,100,sp.warden);
  (sp.cars||[]).forEach(c=>{
    const a = APPR[c.at];
    const p = c.pos || a.idle;
    const rot = (c.rot!==undefined)?c.rot:a.rot;
    if(c.tram) o += tramCar(p[0],p[1],rot,c.label);
    else o += topCar(p[0],p[1],rot,c.color||'white',c.label);
  });
  (sp.peds||[]).forEach(p=>{ o += ped(p[0],p[1],1.0,'var(--fig-ink)'); });
  return sv(o,'0 0 320 200');
}

function road(sp){
  sp = sp||{};
  let o = '<rect width="320" height="200" fill="var(--field)"/>'+
          '<rect x="0" y="56" width="320" height="88" fill="var(--road)"/>'+
          '<path d="M0 58 H320" stroke="var(--road-edge)" stroke-width="3"/>'+
          '<path d="M0 142 H320" stroke="var(--road-edge)" stroke-width="3"/>';
  const m = sp.marking||'dash';
  if(m==='dash')   o += '<path d="M0 100 H320" stroke="var(--mark)" stroke-width="3" stroke-dasharray="16 14"/>';
  if(m==='solid')  o += '<path d="M0 100 H320" stroke="var(--mark)" stroke-width="3"/>';
  if(m==='double') o += '<path d="M0 96 H320 M0 104 H320" stroke="var(--mark)" stroke-width="3"/>';
  if(m==='mixed')  o += '<path d="M0 96 H320" stroke="var(--mark)" stroke-width="3"/><path d="M0 104 H320" stroke="var(--mark)" stroke-width="3" stroke-dasharray="16 14"/>';
  if(sp.zebraX) { for(let i=0;i<9;i++) o += '<rect x="'+(sp.zebraX+i*9)+'" y="58" width="5" height="84" fill="var(--mark)"/>'; }
  (sp.cars||[]).forEach(c=>{ o += topCar(c.x,c.y,c.rot!==undefined?c.rot:90,c.color||'white',c.label); });
  (sp.arrows||[]).forEach(a=>{
    const id='ar'+(++_uid);
    o += '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink)"/></marker></defs>'+
      '<path d="'+a+'" fill="none" stroke="var(--fig-ink)" stroke-width="2.6" stroke-dasharray="7 6" opacity=".8" marker-end="url(#'+id+')"/>';
  });
  (sp.peds||[]).forEach(p=>{ o += ped(p[0],p[1],1.0,'var(--fig-ink)'); });
  (sp.signs||[]).forEach(s=>{ o += signPost(s.x,s.y,s.code,s.size||34); });
  return sv(o,'0 0 320 200');
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function plural(n,f){const c=n%100,d=n%10;return f[(c>4&&c<20)?2:(d===1?0:(d>1&&d<5?1:2))];}

/* ---- состояние сессии ---- */
let S = null, tick = null;

function stopTimer(){ if(tick){clearInterval(tick); tick=null;} }

function makeQueue(list){
  return shuffle(list).map(q=>{
    const idx = shuffle(q.o.map((_,i)=>i));
    return {q, order:idx, correct:idx.indexOf(q.a), picked:null};
  });
}

function start(mode, topicId){
  let list, limit=null, instant=true, timed=false;
  if(mode==='exam'){ list=Q; limit=Math.min(EXAM_N,Q.length); instant=false; timed=true; }
  else if(mode==='topic'){ list=Q.filter(q=>q.t===topicId); }
  else if(mode==='mistakes'){ list=Q.filter(q=>DB.mistakes.includes(q.id)); }
  else { list=Q; }
  if(!list.length) return;
  let queue = makeQueue(list);
  if(limit) queue = queue.slice(0,limit);
  S = {mode, topicId, queue, i:0, errors:0, instant, timed,
       left: EXAM_MIN*60, started:Date.now(), answered:false, finished:false};
  stopTimer();
  if(timed){
    tick = setInterval(()=>{
      S.left--;
      if(S.left<=0){ stopTimer(); finish('time'); }
      else { const el=document.getElementById('timer'); if(el){el.textContent=fmt(S.left); el.classList.toggle('low',S.left<=120);} }
    },1000);
  }
  render();
}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}

function pick(n){
  const it = S.queue[S.i];
  if(S.instant && it.picked!==null) return;
  it.picked = n;
  if(S.instant){
    S.answered = true;
    record(it);
  }
  render();
}

function record(it){
  const id = it.q.id, ok = it.picked===it.correct;
  const d = DB.done[id] || (DB.done[id]={ok:0,bad:0});
  ok ? d.ok++ : d.bad++;
  const mi = DB.mistakes.indexOf(id);
  if(ok){ if(mi>-1) DB.mistakes.splice(mi,1); }
  else if(mi===-1) DB.mistakes.push(id);
  save();
}

function next(){
  const it = S.queue[S.i];
  if(!S.instant){
    if(it.picked===null) return;
    record(it);
    if(it.picked!==it.correct) S.errors++;
  }
  S.answered = false;
  if(S.i >= S.queue.length-1) return finish('done');
  S.i++; render();
}

function finish(reason){
  stopTimer();
  S.finished = true; S.reason = reason;
  S.spent = Math.round((Date.now()-S.started)/1000);
  if(!S.instant){
    S.queue.slice(S.i+1).forEach(it=>{ if(it.picked!==null) record(it); });
  }
  const answered = S.queue.filter(it=>it.picked!==null);
  S.right = answered.filter(it=>it.picked===it.correct).length;
  S.wrongList = answered.filter(it=>it.picked!==it.correct);
  if(S.mode==='exam'){
    S.pass = S.right >= EXAM_PASS;
    DB.exams.unshift({d:Date.now(), r:S.right, n:S.queue.length, p:S.pass});
    DB.exams = DB.exams.slice(0,50); save();
  }
  render();
}

function t(k){
  let s = (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : T.ru[k];
  if(s === undefined) return k;
  for(let i = 1; i < arguments.length; i++) s = s.split('{'+(i-1)+'}').join(arguments[i]);
  return s;
}
/* название темы на текущем языке */
function tn(id){ const x = TOPICS.find(v=>v.id===id); return x ? (LANG==='kk' && x.nk ? x.nk : x.n) : ''; }
/* текст вопроса на текущем языке, с откатом на русский */
function qt(q){
  if(LANG==='kk' && q.kk) return { q:q.kk.q||q.q, o:q.kk.o||q.o, e:q.kk.e||q.e };
  return { q:q.q, o:q.o, e:q.e };
}
const KK_READY = Q.filter(q=>q.kk).length;

function applyLang(l){
  LANG = LANGS.includes(l) ? l : 'ru';
  lsSet('zholtest.lang', LANG);
  try{ document.documentElement.setAttribute('lang', T[LANG].htmlLang); }catch(e){}
  const lb = document.getElementById('lang-btn');
  if(lb){ lb.textContent = T[LANG].langShort; lb.title = T[LANG].langTitle; }
  const tb = document.getElementById('theme-btn');
  if(tb) tb.title = T[LANG].themeTitle;
  const bs = document.getElementById('brand-sub');
  if(bs) bs.textContent = T[LANG].brandSub;
}

function screenQuiz(){
  const it = S.queue[S.i], q = it.q, L = qt(q);
  const pct = Math.round((S.i)/S.queue.length*100);
  barSlot.innerHTML =
    '<div class="qbar">'+
      '<span class="qcount"><b>'+(S.i+1)+'</b>/'+S.queue.length+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      (S.timed ? '<span class="timer'+(S.left<=120?' low':'')+'" id="timer">'+fmt(S.left)+'</span>' : '')+
    '</div>';

  const shown = it.picked!==null && (S.instant || S.finished);
  const opts = it.order.map((oi,pos)=>{
    let cls = '';
    if(shown){
      if(pos===it.correct) cls=' right';
      else if(pos===it.picked) cls=' wrong';
    } else if(pos===it.picked) cls=' sel';
    return '<button class="opt'+cls+'" data-pick="'+pos+'"'+(shown?' disabled':'')+'>'+
      '<span class="n">'+(pos+1)+'</span><span>'+esc(L.o[oi])+'</span></button>';
  }).join('');

  const ok = it.picked===it.correct;
  const exp = shown ? '<div class="exp '+(ok?'ok':'no')+'"><span class="verdict">'+(ok?t('right'):t('wrong'))+'</span>'+esc(L.e)+'</div>' : '';

  app.innerHTML =
    '<div class="card">'+
      (q.img ? '<div class="figure">'+q.img()+'</div>' : '')+
      '<div class="q-topic">'+tn(q.t)+'</div>'+
      '<p class="q-text">'+esc(L.q)+'</p>'+
      '<div class="opts">'+opts+'</div>'+
      exp+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn ghost" id="quit">'+t('quit')+'</button>'+
      '<button class="btn'+(shown?' acc':'')+'" id="nextb"'+(it.picked===null?' disabled':'')+'>'+
        (S.i===S.queue.length-1 ? t('finishBtn') : t('next'))+'</button>'+
    '</div>';

  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick));
  document.getElementById('nextb').onclick = next;
  document.getElementById('quit').onclick = ()=>{
    if(S.queue.filter(x=>x.picked!==null).length && !confirm(t('confirmQuit'))) return;
    stopTimer(); S=null; render();
  };
}

function ring(pct, good){
  const r=58, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<svg class="ring" viewBox="0 0 134 134">'+
    '<circle cx="67" cy="67" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="11"/>'+
    '<circle cx="67" cy="67" r="'+r+'" fill="none" stroke="'+(good?'var(--ok)':'var(--bad)')+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 67 67)"/>'+
    '<text x="67" y="67" class="ring-pct" font-size="34" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">'+pct+'%</text></svg>';
}

function screenResult(){
  barSlot.innerHTML = '';
  const n = S.queue.length, r = S.right;
  const pct = Math.round(r/n*100);
  const isExam = S.mode==='exam';
  const good = isExam ? S.pass : pct>=80;
  let title, sub;
  if(isExam){
    title = S.pass ? t('examPass') : t('examFail');
    const need = EXAM_PASS - r;
    if(S.reason==='time' && !S.pass) sub = t('subTime',EXAM_MIN,n,r,EXAM_PASS);
    else if(S.pass) sub = t('subPass',r,n,EXAM_PASS);
    else sub = t('subFail',EXAM_PASS,n,need);
  } else {
    title = pct>=80 ? t('resGood') : t('resSoso');
    sub = t('resSub');
  }

  const rev = S.wrongList.length ? '<div class="sec-h">'+t('secReview')+'</div>'+ S.wrongList.map(it=>{
    const L = qt(it.q);
    return '<div class="rev">'+
      '<div class="rq">'+esc(L.q)+'</div>'+
      '<div class="ra">'+t('yourAnswer')+' <span class="rn">'+esc(L.o[it.order[it.picked]])+'</span></div>'+
      '<div class="ra">'+t('correctIs')+' <b>'+esc(L.o[it.q.a])+'</b></div>'+
      '<div class="rx">'+esc(L.e)+'</div>'+
    '</div>'; }).join('') : '';

  app.innerHTML =
    '<div class="verdict-card">'+
      ring(pct,good)+
      '<h2>'+title+'</h2>'+
      '<div class="sub">'+sub+'</div>'+
      '<div class="rstats">'+
        '<div><b>'+r+'</b>'+t('rsRight')+'</div>'+
        '<div><b>'+S.wrongList.length+'</b>'+t('rsWrong')+'</div>'+
        '<div><b>'+fmt(S.spent)+'</b>'+t('rsTime')+'</div>'+
      '</div>'+
    '</div>'+
    rev+
    '<div class="actions">'+
      '<button class="btn ghost" id="tohome">'+t('toHome')+'</button>'+
      '<button class="btn" id="again">'+t('again')+'</button>'+
    '</div>';

  document.getElementById('tohome').onclick = ()=>{ S=null; render(); };
  document.getElementById('again').onclick = ()=>{ const m=S.mode,tp=S.topicId; S=null; start(m,tp); };
}

function screenAbout(){
  S=null; stopTimer(); barSlot.innerHTML='';
  app.innerHTML =
   '<section class="hero" style="padding-bottom:6px"><div class="eyebrow">'+t('aboutEyebrow')+'</div><h1>'+t('aboutTitle')+'</h1></section>'+
   '<div class="prose">'+
     '<h3>'+t('aH0')+'</h3>'+
     '<p>'+t('aP01')+'</p>'+
     '<p>'+t('aP02')+'</p>'+
     '<p>'+t('aP03')+'</p>'+
     '<h3>'+t('aH1')+'</h3>'+
     '<p>'+t('aP1')+'</p>'+
     '<p>'+t('aP2')+'</p>'+
     '<p>'+t('aP3')+'</p>'+
     '<h3>'+t('aH2')+'</h3>'+
     '<p>'+t('aP4')+'</p>'+
     '<p>'+t('aP5')+'</p>'+
     '<h3>'+t('aH6')+'</h3>'+
     '<p>'+t('aP6',KK_READY,Q.length)+'</p>'+
     '<h3>'+t('aH3')+'</h3>'+
     '<ul>'+
       '<li>'+t('aL1',EXAM_N,EXAM_MIN,EXAM_PASS,EXAM_ERR)+'</li>'+
       '<li>'+t('aL2')+'</li>'+
       '<li>'+t('aL3')+'</li>'+
       '<li>'+t('aL4')+'</li>'+
     '</ul>'+
     '<h3>'+t('aH4')+'</h3><p>'+t('aImg1')+'</p><p>'+t('aImgPD')+'</p>'+CREDITS_PD+'<p>'+t('aImgCC')+'</p>'+CREDITS_CC+'<p>'+t('aImg2')+'</p>'+
     '<h3>'+t('aH5')+'</h3>'+
     '<ul>'+
       '<li>'+t('aM1')+'</li>'+
       '<li>'+t('aM2')+'</li>'+
       '<li>'+t('aM3')+'</li>'+
       '<li>'+t('aM4')+'</li>'+
     '</ul>'+
   '</div>'+
   '<div class="actions"><button class="btn" id="back">'+t('toHome')+'</button></div>';
  document.getElementById('back').onclick = ()=>{ S=null; render(); };
}

function render(){
  if(!S) return screenHome();
  if(S.finished) return screenResult();
  screenQuiz();
}

document.getElementById('home-link').onclick = ()=>{
  if(S && !S.finished && S.queue.filter(x=>x.picked!==null).length && !confirm(t('confirmQuit'))) return;
  stopTimer(); S=null; render();
};

document.getElementById('lang-btn').onclick = ()=>{
  applyLang(LANG==='ru' ? 'kk' : 'ru');
  render();
};

document.addEventListener('keydown', e=>{
  if(!S || S.finished) return;
  if(e.key>='1' && e.key<='4'){
    const n = +e.key-1;
    if(n < S.queue[S.i].order.length) pick(n);
  }
  if(e.key==='Enter'){ const b=document.getElementById('nextb'); if(b && !b.disabled) next(); }
});

applyLang(LANG);
render();
</script>
