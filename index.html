   ============================================================ */
function renderMobileNav(activeTab){
  const tabs = [
    { id: 'tests', label: t('navTests') },
    { id: 'rules', label: t('navRules') },
    { id: 'signs', label: t('navSigns') },
    { id: 'markings', label: t('navMarkings') },
    { id: 'fines', label: t('navFines') },
    { id: 'pmp', label: t('navPmp') }
  ];
  const pills = tabs.map(t =>
    '<button class="mobile-nav-pill'+(activeTab===t.id?' active':'')+'" data-mnav="'+t.id+'">'+t.label+'</button>'
  ).join('');
  return '<div class="mobile-nav-bar">'+pills+'</div>';
}

function hookMobileNav(){
  app.querySelectorAll('[data-mnav]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.mnav;
      if(id === 'tests') screenHome();
      else if(id === 'rules') screenRules('ch1', '');
      else if(id === 'signs') screenSigns('all', '');
      else if(id === 'markings') screenMarkings('all', '');
      else if(id === 'fines') screenFines('all', '');
      else if(id === 'pmp') screenPmp();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}

function screenRules(chId, query, targetPIdx){
  S = null; stopTimer(); barSlot.innerHTML = '';
  if(chId) RULES_STATE.chId = chId;
  if(query !== undefined) RULES_STATE.q = query;
  if(targetPIdx !== undefined) RULES_STATE.targetPIdx = targetPIdx;

  const curCh = RULES_DATA.find(c=>c.id===RULES_STATE.chId) || RULES_DATA[0];
  const curIdx = RULES_DATA.indexOf(curCh);
  const prevCh = curIdx > 0 ? RULES_DATA[curIdx-1] : null;
  const nextCh = curIdx < RULES_DATA.length-1 ? RULES_DATA[curIdx+1] : null;

  const isSearching = !!(RULES_STATE.q && RULES_STATE.q.trim());
  const searchResults = isSearching ? searchRules(RULES_STATE.q) : [];

  // Group chapters by part for sidebar
  const parts = [];
  RULES_DATA.forEach(c=>{
    let p = parts.find(x=>x.id===c.partId);
    if(!p){
      p = { id:c.partId, title: (LANG==='kk'?c.partTitleKk:c.partTitle), chapters:[] };
      parts.push(p);
    }
    p.chapters.push(c);
  });

  const sidebarHtml = parts.map(p=>{
    const items = p.chapters.map(c=>
      '<button class="rules-ch-item'+(c.id===curCh.id&&!isSearching?' active':'')+'" data-chid="'+c.id+'">'+
        '<span>'+esc(c.title)+'</span>'+
        '<span class="badge">'+c.paragraphs.length+'</span>'+
      '</button>'
    ).join('');
    return '<div class="rules-part-title">'+esc(p.title)+'</div>'+items;
  }).join('');

  const mobileOptions = RULES_DATA.map(c=>
    '<option value="'+c.id+'"'+(c.id===curCh.id?' selected':'')+'>'+esc(c.title)+'</option>'
  ).join('');

  let bodyContent = '';
  if(isSearching){
    if(searchResults.length){
      const cards = searchResults.map(r=>
        '<div class="rules-search-card" data-jump-ch="'+r.chapterId+'" data-jump-pidx="'+r.pIdx+'">'+
          '<div class="rules-search-meta">'+
            '<span class="rules-search-ch">'+esc(r.partTitle)+' · '+esc(r.chapterTitle)+'</span>'+
            (r.paragraph.num ? '<span class="clause-num">п. '+esc(r.paragraph.num)+'</span>' : '')+
          '</div>'+
          '<div class="rules-search-txt">'+highlightMatches(r.paragraph.text, RULES_STATE.q)+'</div>'+
        '</div>'
      ).join('');
      bodyContent = '<div class="rules-search-stat">'+t('rulesSearchResults', searchResults.length)+'</div>'+
                    '<div class="rules-search-results">'+cards+'</div>';
    } else {
      bodyContent = '<div class="rules-search-stat">'+t('rulesSearchEmpty', esc(RULES_STATE.q))+'</div>';
    }
  } else {
    const paragraphsHtml = curCh.paragraphs.map((p, idx)=>{
      if(p.isFootnote){
        return '<div class="clause-footnote" id="p-'+idx+'">'+esc(p.text)+'</div>';
      }
      return '<div class="clause'+(RULES_STATE.targetPIdx===idx?' flash':'')+'" id="p-'+idx+'">'+
        (p.num ? '<span class="clause-num">п. '+esc(p.num)+'</span>' : '')+
        '<span>'+esc(p.text)+'</span>'+
      '</div>';
    }).join('');

    bodyContent =
      '<div class="rules-ch-header">'+
        '<span class="rules-part-badge">'+esc(LANG==='kk'?curCh.partTitleKk:curCh.partTitle)+'</span>'+
        '<h2>'+esc(curCh.title)+'</h2>'+
      '</div>'+
      '<div class="rules-clauses">'+paragraphsHtml+'</div>'+
      '<div class="ch-nav-bar">'+
        (prevCh ? '<button class="btn ghost" data-chid="'+prevCh.id+'">'+t('rulesPrevCh')+'</button>' : '<div></div>')+
        '<button class="btn ghost" id="scroll-top-btn">'+t('rulesToTop')+'</button>'+
        (nextCh ? '<button class="btn" data-chid="'+nextCh.id+'">'+t('rulesNextCh')+'</button>' : '<div></div>')+
      '</div>';
  }

  const searchSvg = '<svg class="rules-search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>';

  app.innerHTML =
    '<section class="hero rules-hero">'+
      '<div class="eyebrow">'+t('rulesEyebrow')+'</div>'+
      '<h1>'+t('rulesTitle')+'</h1>'+
    '</section>'+
    '<div class="rules-bar">'+
      '<button class="btn ghost" id="rules-back-btn" style="min-width:auto;padding:0 18px">← '+t('toHome')+'</button>'+
      '<div class="rules-search-wrap">'+
        searchSvg+
        '<input type="search" class="rules-search-input" id="rules-search-inp" placeholder="'+t('rulesSearchPh')+'" value="'+esc(RULES_STATE.q)+'">'+
        (RULES_STATE.q ? '<button class="rules-search-clear" id="rules-clear-btn" title="Очистить">✕</button>' : '')+
      '</div>'+
    '</div>'+
    '<select class="ch-mobile-sel" id="ch-mobile-select">'+mobileOptions+'</select>'+
    '<div class="rules-layout">'+
      '<aside class="rules-sidebar">'+sidebarHtml+'</aside>'+
      '<main class="rules-reader">'+bodyContent+'</main>'+
    '</div>';

  // Event handlers
  document.getElementById('rules-back-btn').onclick = ()=>{ screenHome(); window.scrollTo({top:0,behavior:'smooth'}); };
  
  const searchInp = document.getElementById('rules-search-inp');
  searchInp.oninput = (e)=>{
    screenRules(RULES_STATE.chId, e.target.value);
    const inp = document.getElementById('rules-search-inp');
    if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  };

  const clearBtn = document.getElementById('rules-clear-btn');
  if(clearBtn){
    clearBtn.onclick = ()=>{ screenRules(RULES_STATE.chId, ''); };
  }

  const mobSel = document.getElementById('ch-mobile-select');
  if(mobSel){
    mobSel.onchange = (e)=>{ screenRules(e.target.value, ''); window.scrollTo({top:180,behavior:'smooth'}); };
  }

  app.querySelectorAll('[data-chid]').forEach(b=>{
    b.onclick = ()=>{
      screenRules(b.dataset.chid, '');
      window.scrollTo({top:180,behavior:'smooth'});
    };
  });

  app.querySelectorAll('[data-jump-ch]').forEach(card=>{
    card.onclick = ()=>{
      const cId = card.dataset.jumpCh;
      const pIdx = +card.dataset.jumpPidx;
      screenRules(cId, '', pIdx);
      setTimeout(()=>{
        const el = document.getElementById('p-'+pIdx);
        if(el){
          el.scrollIntoView({behavior:'smooth', block:'center'});
          el.classList.add('flash');
          setTimeout(()=>el.classList.remove('flash'), 2500);
        }
      }, 50);
    };
  });

  const topBtn = document.getElementById('scroll-top-btn');
  if(topBtn){
    topBtn.onclick = ()=>window.scrollTo({top:180,behavior:'smooth'});
  }

  if(RULES_STATE.targetPIdx !== null && !isSearching){
    setTimeout(()=>{
      const el = document.getElementById('p-'+RULES_STATE.targetPIdx);
      if(el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
        setTimeout(()=>el.classList.remove('flash'), 2500);
      }
      RULES_STATE.targetPIdx = null;
    }, 60);
  }
}

function screenQuiz(){
  const it = S.queue[S.i], q = it.q, L = qt(q);
  const pct = Math.round((S.i)/S.queue.length*100);
  barSlot.innerHTML =
    '<div class="qbar">'+
      '<span class="qcount"><b>'+(S.i+1)+'</b>/'+S.queue.length+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      (S.timed ? '<span class="timer'+(S.left<=120?' low':'')+'" id="timer">'+fmt(S.left)+'</span>' : '')+
    '</div>';

  const shown = it.picked!==null && (S.instant || S.finished);
  const opts = it.order.map((oi,pos)=>{
    let cls = '';
    if(shown){
      if(pos===it.correct) cls=' right';
      else if(pos===it.picked) cls=' wrong';
    } else if(pos===it.picked) cls=' sel';
    return '<button class="opt'+cls+'" data-pick="'+pos+'"'+(shown?' disabled':'')+'>'+
      '<span class="n">'+(pos+1)+'</span><span>'+esc(L.o[oi])+'</span></button>';
  }).join('');

  const ok = it.picked===it.correct;
  const exp = shown ? '<div class="exp '+(ok?'ok':'no')+'"><span class="verdict">'+(ok?t('right'):t('wrong'))+'</span>'+esc(L.e)+'</div>' : '';

  app.innerHTML =
    '<div class="card'+(q.img?' has-fig':'')+'">'+
      (q.img ? '<div class="figure">'+q.img()+'</div>' : '')+
      '<div class="q-topic">'+tn(q.t)+'</div>'+
      '<p class="q-text">'+esc(L.q)+'</p>'+
      '<div class="opts">'+opts+'</div>'+
      exp+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn ghost" id="quit">'+t('quit')+'</button>'+
      '<button class="btn'+(shown?' acc':'')+'" id="nextb"'+(it.picked===null?' disabled':'')+'>'+
        (S.i===S.queue.length-1 ? t('finishBtn') : t('next'))+'</button>'+
    '</div>'+
    '<div class="kbdhint">'+t('kbdHint')+'</div>';

  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick));
  document.getElementById('nextb').onclick = next;
  document.getElementById('quit').onclick = ()=>{
    if(S.queue.filter(x=>x.picked!==null).length && !confirm(t('confirmQuit'))) return;
    stopTimer(); S=null; render();
  };
}

function ring(pct, good){
  const r=58, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<svg class="ring" viewBox="0 0 134 134">'+
    '<circle cx="67" cy="67" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="11"/>'+
    '<circle cx="67" cy="67" r="'+r+'" fill="none" stroke="'+(good?'var(--ok)':'var(--bad)')+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 67 67)"/>'+
    '<text x="67" y="67" class="ring-pct" font-size="34" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">'+pct+'%</text></svg>';
}

function screenResult(){
  barSlot.innerHTML = '';
  const n = S.queue.length, r = S.right;
  const pct = Math.round(r/n*100);
  const isExam = S.mode==='exam';
  const good = isExam ? S.pass : pct>=80;
  let title, sub;
  if(isExam){
    title = S.pass ? t('examPass') : t('examFail');
    const need = EXAM_PASS - r;
    if(S.reason==='time' && !S.pass) sub = t('subTime',EXAM_MIN,n,r,EXAM_PASS);
    else if(S.pass) sub = t('subPass',r,n,EXAM_PASS);
    else sub = t('subFail',EXAM_PASS,n,need);
  } else {
    title = pct>=80 ? t('resGood') : t('resSoso');
    sub = t('resSub');
  }

  const rev = S.wrongList.length ? '<div class="sec-h">'+t('secReview')+'</div>'+ S.wrongList.map(it=>{
    const L = qt(it.q);
    return '<div class="rev">'+
      '<div class="rq">'+esc(L.q)+'</div>'+
      '<div class="ra">'+t('yourAnswer')+' <span class="rn">'+esc(L.o[it.order[it.picked]])+'</span></div>'+
      '<div class="ra">'+t('correctIs')+' <b>'+esc(L.o[it.q.a])+'</b></div>'+
      '<div class="rx">'+esc(L.e)+'</div>'+
    '</div>'; }).join('') : '';

  app.innerHTML =
    '<div class="verdict-card">'+
      ring(pct,good)+
      '<h2>'+title+'</h2>'+
      '<div class="sub">'+sub+'</div>'+
      '<div class="rstats">'+
        '<div><b>'+r+'</b>'+t('rsRight')+'</div>'+
        '<div><b>'+S.wrongList.length+'</b>'+t('rsWrong')+'</div>'+
        '<div><b>'+fmt(S.spent)+'</b>'+t('rsTime')+'</div>'+
      '</div>'+
    '</div>'+
    rev+
    '<div class="actions">'+
      '<button class="btn ghost" id="tohome">'+t('toHome')+'</button>'+
      '<button class="btn" id="again">'+t('again')+'</button>'+
    '</div>';

  document.getElementById('tohome').onclick = ()=>{ S=null; render(); };
  document.getElementById('again').onclick = ()=>{ const m=S.mode,tp=S.topicId; S=null; start(m,tp); };
}

function render(){
  if(!S) return screenHome();
  if(S.finished) return screenResult();
  screenQuiz();
}

const rNav = document.getElementById('rules-nav-btn'); if(rNav) rNav.onclick = ()=>{ screenRules('ch1',''); window.scrollTo({top:0,behavior:'smooth'}); };


document.querySelectorAll('#main-nav [data-nav]').forEach(btn => {
  btn.onclick = (e) => {
    e.preventDefault();
    const nav = btn.dataset.nav;
    document.querySelectorAll('#main-nav .nav-link').forEach(l => l.classList.remove('active'));
    btn.classList.add('active');
    if(nav === 'tests') screenHome();
    else if(nav === 'rules') screenRules('ch1', '');
    else if(nav === 'signs') screenSigns('all', '');
    else if(nav === 'markings') screenMarkings('all', '');
    else if(nav === 'fines') screenFines('all', '');
    else if(nav === 'pmp') screenPmp();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

document.getElementById('home-link').onclick = ()=>{
  if(S && !S.finished && S.queue.filter(x=>x.picked!==null).length && !confirm(t('confirmQuit'))) return;
  stopTimer(); S=null; render();
};

document.getElementById('lang-btn').onclick = ()=>{
  applyLang(LANG==='ru' ? 'kk' : 'ru');
  render();
};

document.addEventListener('keydown', e=>{
  if(!S || S.finished) return;
  if(e.key>='1' && e.key<='4'){
    const n = +e.key-1;
    if(n < S.queue[S.i].order.length) pick(n);
  }
  if(e.key==='Enter'){ const b=document.getElementById('nextb'); if(b && !b.disabled) next(); }
});

applyLang(LANG);
render();
</script>
