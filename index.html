<title>Jol Ustazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Бесплатный тренажёр теоретического экзамена ПДД Республики Казахстан">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<style>
/* ============================================================
   Тёмно-зелёная редакторская тема.
   Базовое состояние — тёмное. Светлая «бумажная» тема
   включается только явным переключателем [data-theme="light"].
   ============================================================ */
:root{
  color-scheme:dark;

  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --bg:#0A120E;
  --surface:#111F18;
  --surface-2:#1A2B22;
  --ink:#EDF3EE;
  --ink-2:#9BB5A6;
  --ink-3:#6E8A7B;
  --line:#1E3228;
  --line-2:#2C4A3B;

  --accent:#4EA37B;
  --accent-deep:#1F6B4A;
  --accent-soft:#12291F;
  --on-accent:#F0F5F1;
  --moss:#A9BC7E;

  --ok:#57BC8B;
  --ok-soft:#102A1F;
  --bad:#D8785F;
  --bad-soft:#2A1712;
  --warn:#C79A4B;

  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -22px rgba(0,0,0,.9);

  /* схемы дорожных ситуаций */
  --road:#33453B;
  --road-edge:#43584C;
  --field:#16241C;
  --mark:#D6E2D8;
  --scene-bg:#0D1712;
  --fig-ink:#DCE7DE;

  --r:12px;
  --r-sm:9px;
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F0E9;
  --surface:#FBFAF6;
  --surface-2:#EAE8DF;
  --ink:#152019;
  --ink-2:#4A5A50;
  --ink-3:#78887E;
  --line:#DEDBD0;
  --line-2:#C9C5B7;

  --accent:#1F6B4A;
  --accent-deep:#1F6B4A;
  --accent-soft:#E3EEE7;
  --on-accent:#FBFAF6;
  --moss:#6E7C46;

  --ok:#1D7A4C;
  --ok-soft:#E4F1E9;
  --bad:#B0503B;
  --bad-soft:#F7E9E4;
  --warn:#8E6A26;

  --shadow:0 1px 2px rgba(21,32,25,.05), 0 12px 32px -18px rgba(21,32,25,.28);

  --road:#8B928A;
  --road-edge:#A7AEA4;
  --field:#DCE2D5;
  --mark:#FBFAF6;
  --scene-bg:#EEECE4;
  --fig-ink:#152019;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{
  font-family:var(--serif);
  font-weight:600;
  margin:0;
  text-wrap:balance;
  line-height:1.18;
  letter-spacing:-.012em;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:680px;margin:0 auto;padding:0 24px}

/* ---------- шапка ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.2) blur(14px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:680px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px;min-height:60px}
.brand{
  display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-size:21px;
  font-weight:600;letter-spacing:-.01em;text-decoration:none;color:inherit;
}
.brand svg{align-self:center;color:var(--accent)}
.brand b{font-weight:600}
.brand span{
  font-family:var(--mono);color:var(--ink-3);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:400;
}
.bar-sp{flex:1;min-width:0}
.icon-btn{
  background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:0 0 auto;
  transition:background .18s, color .18s, border-color .18s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}

/* ---------- титульный блок ---------- */
.hero{padding:76px 0 40px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--moss);display:flex;align-items:center;gap:14px;margin-bottom:22px;font-weight:500;
}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line)}
.hero h1{font-size:clamp(38px,8.5vw,58px);font-weight:600;letter-spacing:-.022em;line-height:1.08}
.hero p{color:var(--ink-2);margin:20px 0 0;max-width:52ch;font-size:18px}

/* ---------- режимы ---------- */
.modes{display:grid;gap:12px;margin:44px 0 0}
.mode{
  display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:18px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;text-align:left;cursor:pointer;
  transition:border-color .2s, background .2s;
}
.mode:hover{border-color:var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.mode .m-ic{width:46px;height:46px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode .m-t{display:block;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.mode .m-d{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.5;margin-top:4px}
.mode .m-go{color:var(--ink-3)}
.mode.primary{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
.mode.primary .m-d{color:color-mix(in srgb, var(--on-accent) 76%, transparent)}
.mode.primary .m-ic{background:color-mix(in srgb, var(--on-accent) 14%, transparent);color:var(--on-accent)}
.mode.primary .m-go{color:color-mix(in srgb, var(--on-accent) 62%, transparent)}
.mode.primary:hover{border-color:var(--accent)}

/* ---------- статистика ---------- */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:40px;
}
.stat{background:var(--surface);padding:20px 12px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- темы ---------- */
.topics{display:grid;gap:8px;margin-top:18px}
.topic{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px 14px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 18px;
  cursor:pointer;text-align:left;transition:border-color .2s;
}
.topic:hover{border-color:var(--accent)}
.topic-n{font-size:16px}
.topic-c{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tprog{height:2px;border-radius:2px;background:var(--line-2);grid-column:1/-1;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--ok);border-radius:2px}

/* ---------- рубрики и врезки ---------- */
.sec-h{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:56px 0 18px;display:flex;align-items:center;gap:14px;font-weight:500;
}
.sec-h::after{content:"";height:1px;flex:1;background:var(--line)}

.note{
  border:1px solid var(--line);border-left:2px solid var(--moss);background:var(--surface);
  border-radius:var(--r-sm);padding:20px 22px;font-size:15px;line-height:1.6;color:var(--ink-2);margin-top:24px;
}
.note b{color:var(--ink);font-weight:600}

footer{padding:72px 0 88px;color:var(--ink-3);font-size:13.5px;text-align:center;line-height:1.7}
footer a{color:var(--ink-2)}

/* ---------- ход прохождения ---------- */
.qbar{display:flex;align-items:center;gap:14px;width:100%}
.qcount{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.qcount b{color:var(--ink);font-weight:500}
.track{flex:1;height:2px;background:var(--line-2);border-radius:2px;overflow:hidden;min-width:30px}
.track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.timer{
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;padding:5px 10px;
  border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;
}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

/* ---------- карточка вопроса ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:28px;
}
.figure{
  background:var(--scene-bg);border-bottom:1px solid var(--line);padding:26px 20px;
  display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;
}
.figure svg{width:100%;max-width:430px;height:auto;display:block}
.figure.sign svg{width:126px}
.q-topic{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--moss);padding:24px 26px 0;font-weight:500;
}
.q-text{padding:12px 26px 22px;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.38;letter-spacing:-.011em;margin:0}

.opts{display:grid;gap:9px;padding:0 18px 18px}
.opt{
  display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;
  background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:15px 16px;text-align:left;cursor:pointer;width:100%;font-size:16px;line-height:1.5;
  transition:border-color .16s, background .16s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .n{
  font-family:var(--mono);font-size:12px;width:28px;height:28px;border-radius:7px;
  background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:var(--ok);border-color:var(--ok);color:#08150F}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{background:var(--bad);border-color:var(--bad);color:#25100B}

.exp{
  margin:0 18px 18px;border-radius:var(--r-sm);padding:18px 20px;font-size:15.5px;
  line-height:1.62;border:1px solid var(--line);color:var(--ink-2);
}
.exp.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.exp.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.exp .verdict{
  font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;
  display:block;margin-bottom:9px;font-weight:500;
}
.exp.ok .verdict{color:var(--ok)}
.exp.no .verdict{color:var(--bad)}

/* ---------- кнопки ---------- */
.actions{display:flex;gap:12px;padding:28px 0 64px}
.btn{
  flex:1;border:1px solid var(--accent-deep);background:var(--accent-deep);color:var(--on-accent);
  border-radius:var(--r-sm);padding:15px 22px;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;letter-spacing:.005em;
  transition:background .18s, border-color .18s, opacity .18s;
}
.btn:hover{background:color-mix(in srgb, var(--accent-deep) 82%, var(--accent));border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2);flex:0 0 auto;font-weight:400}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--accent);color:var(--ink)}
.btn.acc{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}

/* ---------- результат ---------- */
.verdict-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:52px 32px;text-align:center;box-shadow:var(--shadow);margin-top:32px;
}
.ring{width:138px;height:138px;margin:0 auto 26px;display:block}
.verdict-card h2{font-size:34px;font-weight:600;letter-spacing:-.02em}
.verdict-card .sub{color:var(--ink-2);margin-top:12px;font-size:16px;line-height:1.6;max-width:46ch;margin-left:auto;margin-right:auto}
.rstats{display:flex;justify-content:center;gap:40px;margin-top:32px;flex-wrap:wrap}
.rstats div{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.rstats b{display:block;color:var(--ink);font-size:24px;letter-spacing:-.02em;margin-bottom:4px;font-weight:400}

.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px 22px;margin-top:10px}
.rev .rq{font-family:var(--serif);font-size:17.5px;line-height:1.42;letter-spacing:-.008em}
.rev .ra{font-size:14.5px;margin-top:12px;color:var(--ink-2);line-height:1.55}
.rev .ra b{color:var(--ok);font-weight:600}
.rev .rn{color:var(--bad)}
.rev .rx{font-size:14.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}

/* ---------- длинный текст ---------- */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:36px 34px 40px;margin-top:24px}
.prose h3{font-size:23px;margin:44px 0 14px;letter-spacing:-.015em}
.prose h3:first-child{margin-top:0}
.prose p{margin:0 0 16px;color:var(--ink-2);font-size:16px;line-height:1.68}
.prose ul{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:16px;line-height:1.68}
.prose li{margin-bottom:9px}
.prose strong{color:var(--ink);font-weight:600}
.prose ul.credits{font-family:var(--mono);font-size:11.5px;line-height:1.7;columns:2;column-gap:32px;margin-bottom:20px}
.prose ul.credits li{margin-bottom:5px;break-inside:avoid}
.prose a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.prose a:hover{color:var(--ink)}
.prose code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-family:var(--mono);font-size:13px;color:var(--ink)}
@media (max-width:520px){.prose ul.credits{columns:1}}

@media (max-width:520px){
  body{font-size:16.5px}
  .wrap{padding:0 18px}
  .bar-in{padding:10px 18px}
  .hero{padding:48px 0 30px}
  .hero p{font-size:17px}
  .modes{margin-top:32px}
  .mode{padding:17px;gap:15px}
  .q-text{font-size:19.5px;padding:10px 20px 18px}
  .q-topic{padding:20px 20px 0}
  .opts{padding:0 14px 14px}
  .opt{font-size:15.5px;padding:14px}
  .exp{margin:0 14px 14px;padding:16px}
  .prose{padding:26px 22px 30px}
  .verdict-card{padding:38px 22px}
  .sec-h{margin:42px 0 16px}
  .brand span{display:none}
  .rstats{gap:26px}
}
.pill-t{font-family:var(--mono);font-weight:500;letter-spacing:.02em}
.ring-pct{font-family:var(--serif);font-weight:600;letter-spacing:-.02em}



/* ---------- готовность, история, шпаргалка ---------- */
.ready{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:12px}
.ready-head{display:flex;gap:18px;align-items:center}
.ring-mini{width:80px;height:80px;flex:0 0 auto;display:block}
.ready-t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.ready-d{color:var(--ink-2);font-size:14.5px;line-height:1.5;margin-top:4px}
.ready .stats{margin-top:18px;border-radius:var(--r-sm)}

.exams{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.exrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:var(--surface);padding:13px 16px}
.exd{color:var(--ink-2);font-size:14.5px}
.exn{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.exv{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.exv.ok{color:var(--ok)}
.exv.no{color:var(--bad)}

.cheat{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:8px}
.cheat-signs{display:flex;gap:10px;flex:0 0 auto}
.cheat-signs svg{width:52px;height:auto;display:block}
.cheat-t{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
@media (max-width:400px){
  .cheat{gap:14px;padding:14px}
  .cheat-signs svg{width:44px}
  .cheat-t{font-size:14px}
  .ready-head{gap:14px}
  .ring-mini{width:68px;height:68px}
}

/* ============================================================
   ШИРОКИЕ ЭКРАНЫ: раскладка для компьютера
   ============================================================ */
.home-grid{display:contents}
.home-a,.home-b{display:contents}
.kbdhint{display:none}

@media (min-width:900px){
  .wrap{max-width:1120px}
  .bar-in{max-width:1120px}

  .hero{padding:88px 0 12px}
  .hero h1{font-size:clamp(52px,4.6vw,66px)}
  .hero p{font-size:19px;max-width:56ch}

  /* действия слева, справочник справа */
  .home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:0 64px;align-items:start;margin-top:48px}
  .home-a,.home-b{display:block}
  .modes{margin-top:0;gap:14px}
  .mode{padding:24px}
  .stats{margin-top:0}
  .sec-h{margin-top:36px}
  .home-b .sec-h:first-child{margin-top:0}
  .note{max-width:74ch}

  /* карточка вопроса: схема слева, текст и ответы справа */
  .card{margin-top:36px}
  .card.has-fig{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr)}
  .card.has-fig>.figure{
    grid-column:1;grid-row:1/span 20;
    border-bottom:0;border-right:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;padding:32px 26px;
  }
  .card.has-fig>.figure svg{max-width:360px}
  .card.has-fig>*:not(.figure){grid-column:2;align-self:start}
  .card.has-fig>.q-topic{padding-top:30px}
  .q-text{font-size:24px}
  .opt{font-size:16.5px}

  /* кнопки не растягиваются во всю ширину */
  .actions{justify-content:flex-end;padding-top:24px}
  .btn{flex:0 0 auto;min-width:190px}
  .btn.ghost{min-width:130px}

  /* подсказка по клавишам — только там, где есть клавиатура */
  .kbdhint{
    display:block;text-align:right;margin:-28px 0 48px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);
  }

  /* длинные тексты держим в читаемой мере, а не во всю ширину */
  .prose{max-width:78ch;margin-left:auto;margin-right:auto;padding:44px 48px 48px}
  .verdict-card{max-width:660px;margin-left:auto;margin-right:auto}
  .rev{max-width:860px;margin-left:auto;margin-right:auto}
  .sec-h{max-width:860px;margin-left:auto;margin-right:auto}
  .home-b .sec-h{max-width:none}
}

@media (min-width:1180px){
  .hero{padding:104px 0 12px}
  .home-grid{gap:0 80px}
}

/* сенсорным устройствам подсказка про клавиши не нужна */
@media (hover:none){ .kbdhint{display:none} }

/* ============================================================
   МОБИЛЬНЫЕ УСТРОЙСТВА: безопасные зоны, касания, отклики
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mode,.topic,.opt,.btn,.icon-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* вырез и «дом-бар» iPhone */
.bar{padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.bar-in{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
footer{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.actions{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* размеры под палец: не меньше 48px */
.btn,.icon-btn{min-height:48px}
.opt{min-height:48px}
.mode{min-height:64px}
.topic{min-height:56px}

.lang-btn{width:auto;min-width:52px;padding:0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:500}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}

/* на сенсорных экранах наведение «залипает» — гасим его */
@media (hover:none){
  .mode:hover{border-color:var(--line)}
  .mode.primary:hover{border-color:var(--accent-deep)}
  .topic:hover{border-color:var(--line)}
  .opt:hover:not(:disabled){border-color:var(--line-2);background:transparent}
  .icon-btn:hover{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
  .btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn.ghost:hover{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
  .prose a:hover{color:var(--accent)}
}
/* отклик на нажатие вместо наведения */
.mode:active,.topic:active,.opt:active:not(:disabled){transform:scale(.994)}
.btn:active:not(:disabled),.icon-btn:active{opacity:.82}
.opt.sel,.opt.right,.opt.wrong{transform:none}

/* длинная надрубрика не должна ломаться об линейку */
@media (max-width:430px){
  .eyebrow{gap:10px;line-height:1.45}
  .eyebrow::after{display:none}
}

/* очень узкие экраны (iPhone SE и подобные) */
@media (max-width:360px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1/-1}
  .rstats{gap:18px}
  .lang-btn{min-width:46px;padding:0 9px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ============================================================
   ПОРТАЛ: РАЗДЕЛЫ И НАВИГАЦИЯ (по регламенту STYLE.md)
   ============================================================ */
.nav-links{display:flex;gap:8px;align-items:center}
.nav-link{
  background:none;border:1px solid transparent;color:var(--ink-2);padding:8px 12px;border-radius:var(--r-sm);
  font-family:var(--sans);font-size:14.5px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .18s,border-color .18s,color .18s;text-decoration:none;
}
.nav-link.active{background:var(--surface-2);border-color:var(--line);color:var(--accent);font-weight:600}

@media (hover:hover){
  .nav-link:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
}
@media (max-width:960px){
  .nav-links{display:none}
}

/* Мобильная панель навигации */
.mobile-nav-bar{
  display:none;background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px 18px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;
  position:sticky;top:54px;z-index:90;-webkit-overflow-scrolling:touch;gap:8px;
}
.mobile-nav-bar::-webkit-scrollbar{display:none}
.mobile-nav-pill{
  display:inline-flex;align-items:center;padding:8px 14px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;flex:0 0 auto;
}
.mobile-nav-pill.active{background:var(--accent-deep);color:var(--on-accent);border-color:var(--accent-deep);font-weight:600}

@media (max-width:960px){
  .mobile-nav-bar{display:flex}
}

/* Витрина разделов (Portal Hub) */
.portal-hub{margin-top:44px}
.portal-hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:18px}
.hub-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;cursor:pointer;transition:border-color .18s,transform .18s;
  display:flex;flex-direction:column;gap:12px;
}
.hub-card-head{display:flex;align-items:center;gap:12px}
.hub-card-icon{
  width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);
  color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.hub-card-icon svg{width:20px;height:20px}
.hub-card-title{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.012em;color:var(--ink);margin:0;line-height:1.25}
.hub-card-desc{font-family:var(--sans);font-size:14.5px;line-height:1.62;color:var(--ink-2);margin:0}
.hub-card-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}

@media (hover:hover){
  .hub-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
}
@media (hover:none){
  .hub-card:active{transform:scale(.994)}
}

/* Фильтры и вкладки разделов */
.p-filter-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px;margin:24px 0 24px;-webkit-overflow-scrolling:touch}
.p-filter-bar::-webkit-scrollbar{display:none}
.p-filter-chip{
  flex:0 0 auto;padding:8px 16px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
  transition:background .18s,border-color .18s,color .18s;
}
.p-filter-chip.active{background:var(--accent-deep);color:var(--on-accent);border-color:var(--accent-deep);font-weight:600}

@media (hover:hover){
  .p-filter-chip:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
}

/* Сетка карточек знаков и разметки */
.signs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:18px}
.sign-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;display:flex;flex-direction:column;gap:12px;transition:border-color .18s;
}
.sign-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sign-num-badge{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:var(--r-sm);color:var(--accent);
}
.sign-cat-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.sign-card-title{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.012em;color:var(--ink);margin:0;line-height:1.3}
.sign-card-desc{font-family:var(--sans);font-size:14.5px;line-height:1.62;color:var(--ink-2);margin:0}

@media (hover:hover){
  .sign-card:hover{border-color:var(--line-2)}
}

/* Таблица штрафов */
.fines-info-banner{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);
  padding:18px 24px;margin-bottom:24px;font-family:var(--sans);font-size:15px;line-height:1.62;color:var(--ink-2);
  display:flex;align-items:center;gap:14px;
}
.fines-info-banner svg{width:22px;height:22px;flex:0 0 auto;color:var(--accent)}

.fines-grid{display:grid;gap:12px;margin-top:18px}
.fine-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;transition:border-color .18s;
}
.fine-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.fine-art-badge{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:var(--r-sm);color:var(--accent);
}
.fine-price-wrap{text-align:right}
.fine-mrp{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.fine-sum{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--bad);letter-spacing:-.012em;margin-top:2px}
.fine-sum-disc{font-family:var(--sans);font-size:13.5px;color:var(--ok);font-weight:600;margin-top:2px}
.fine-title{font-family:var(--sans);font-size:16px;font-weight:500;color:var(--ink);line-height:1.62;margin:0 0 12px}
.fine-repeat{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

@media (hover:hover){
  .fine-card:hover{border-color:var(--line-2)}
}

/* Раздел ПМП */
.pmp-content{max-width:78ch;margin:24px auto 0}
.pmp-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px;margin-bottom:18px}
.pmp-section h3{font-family:var(--serif);font-size:21px;letter-spacing:-.012em;font-weight:600;margin:0 0 18px;color:var(--ink);line-height:1.3}
.pmp-section p{margin:0 0 12px;color:var(--ink-2);font-family:var(--sans);font-size:16px;line-height:1.68}
.pmp-section p:last-child{margin-bottom:0}
.pmp-section strong{color:var(--ink);font-weight:600}

/* Правила ПДД / читалка */
.rules-bar{display:flex;gap:12px;align-items:center;margin:24px 0 18px;flex-wrap:wrap}
.rules-search-wrap{flex:1 1 280px;position:relative}
.rules-search-input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 16px 12px 42px;font-size:15px;color:var(--ink);font-family:inherit;
  outline:none;box-sizing:border-box;transition:border-color .18s;
}
.rules-search-input:focus{border-color:var(--accent)}
.rules-search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.rules-search-clear{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--ink-3);cursor:pointer;padding:4px 8px;font-size:14px;border-radius:var(--r-sm);
}
@media (hover:hover){
  .rules-search-clear:hover{color:var(--ink)}
}

.rules-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:32px;align-items:start;margin-top:18px}
.rules-sidebar{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 12px;position:sticky;top:80px;max-height:calc(100vh - 100px);
  overflow-y:auto;scrollbar-width:thin;
}
.rules-part-title{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 10px 6px;border-top:1px solid var(--line);margin-top:8px;
}
.rules-part-title:first-child{border-top:0;margin-top:0;padding-top:4px}
.rules-ch-item{
  display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--r-sm);padding:9px 12px;margin-bottom:2px;
  font-family:var(--sans);font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.4;transition:background .15s,color .15s;
}
.rules-ch-item.active{background:var(--accent-deep);color:var(--on-accent);font-weight:600}
.rules-ch-item .badge{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.75;margin-left:6px;flex:0 0 auto;
}
@media (hover:hover){
  .rules-ch-item:hover:not(.active){background:var(--surface-2);color:var(--ink)}
}

.rules-reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:44px}
.rules-ch-header{margin-bottom:32px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.rules-part-badge{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--moss);margin-bottom:8px;display:inline-block;
}
.rules-ch-header h2{font-family:var(--serif);font-size:26px;margin:0;line-height:1.25;letter-spacing:-.012em}

.clause{margin-bottom:24px;line-height:1.72;font-size:16.5px;color:var(--ink);border-radius:var(--r-sm);transition:background .25s}
.clause.flash{background:var(--accent-soft);padding:6px 12px;margin-left:-12px;margin-right:-12px}
.clause-num{
  display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;
  border-radius:var(--r-sm);color:var(--accent);margin-right:8px;vertical-align:baseline;
}
.clause-footnote{
  background:var(--surface-2);border-left:3px solid var(--line-2);
  padding:12px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-family:var(--sans);font-size:13.5px;
  color:var(--ink-3);margin:14px 0 20px;line-height:1.6;
}

.rules-search-stat{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.rules-search-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .18s;
}
.rules-search-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rules-search-ch{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--moss);font-weight:500}
.rules-search-txt{font-family:var(--sans);font-size:15.5px;line-height:1.62;color:var(--ink)}

mark.hl{background:var(--surface-2);color:var(--accent);border-bottom:1px solid var(--accent);padding:0 2px;border-radius:2px}

.ch-nav-bar{
  display:flex;justify-content:space-between;align-items:center;margin-top:44px;
  padding-top:24px;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap;
}
.ch-mobile-sel{
  display:none;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;color:var(--ink);font-family:var(--sans);font-size:15px;margin-bottom:18px;
}
@media (max-width:900px){
  .rules-layout{display:block}
  .rules-sidebar{display:none}
  .ch-mobile-sel{display:block}
  .rules-reader{padding:24px 20px 28px}
}


/* Иллюстрации в карточках знаков и разметки */
.sign-figure{
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:16px;min-height:88px;margin-bottom:4px;
}
.sign-figure svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.mark-figure{
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px;min-height:72px;margin-bottom:4px;
}
.mark-figure svg{border-radius:4px;overflow:hidden}

/* Компактный справочный блок на главной справа */
.home-hub-list{display:grid;gap:12px}
.home-hub-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;
  transition:border-color .18s,background .18s;
}
.home-hub-item:hover{border-color:var(--accent);background:var(--surface-2)}
.home-hub-item-left{display:flex;align-items:center;gap:12px}
.home-hub-item-icon{
  width:36px;height:36px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);
  color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.home-hub-item-icon svg{width:18px;height:18px}
.home-hub-item-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin:0}
.home-hub-item-desc{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin:2px 0 0}
.home-hub-item-arrow{font-family:var(--mono);font-size:14px;color:var(--ink-3)}


/* Полноширинный баннер готовности на главной */
.ready-banner{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 32px;margin:24px 0 36px;display:flex;align-items:center;justify-content:space-between;
  gap:32px;flex-wrap:wrap;box-shadow:var(--shadow);
}
.ready-banner-left{display:flex;align-items:center;gap:20px;flex:1 1 360px}
.ready-banner-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.012em;color:var(--ink);margin-bottom:4px}
.ready-banner-sub{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink-2)}
.ready-banner-stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ready-stat-item{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 18px;min-width:100px;text-align:center;
}
.ready-stat-item b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.ready-stat-item span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.ready-stat-item.has-err b{color:var(--bad)}

@media (max-width:900px){
  .ready-banner{padding:20px;gap:20px}
  .ready-banner-stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ready-stat-item{min-width:0;padding:10px 8px}
}

/* Карточки режимов тренировки */
.mode-primary{
  background:var(--accent-deep);color:var(--on-accent);border:1px solid var(--accent);border-radius:var(--r);
  padding:24px;display:flex;align-items:center;justify-content:space-between;gap:18px;cursor:pointer;
  transition:all .18s ease;text-align:left;width:100%;box-sizing:border-box;margin-bottom:12px;
}
.mode-primary .m-ic{
  width:44px;height:44px;border-radius:var(--r-sm);background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--on-accent);
}
.mode-primary .m-t{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.012em;display:block;color:var(--on-accent)}
.mode-primary .m-d{font-family:var(--sans);font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.85);margin-top:4px;display:block}
.mode-primary .m-go{
  width:36px;height:36px;border-radius:var(--r-sm);background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;color:var(--on-accent);flex:0 0 auto;
}
@media (hover:hover){
  .mode-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
}

.mode-sec{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;
  transition:all .18s ease;text-align:left;width:100%;box-sizing:border-box;margin-bottom:10px;
}
.mode-sec .m-ic{
  width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);
}
.mode-sec .m-t{font-family:var(--serif);font-size:17.5px;font-weight:600;color:var(--ink);display:block}
.mode-sec .m-d{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:2px;display:block}
.mode-sec .m-go{color:var(--ink-3);display:flex;align-items:center;flex:0 0 auto}
.mode-sec[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
@media (hover:hover){
  .mode-sec:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
}

/* Карточки знаков (с честной обработкой SVG vs текст) */
.sign-card-noimg{
  background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-sm);
  padding:10px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);text-align:center;margin-bottom:6px;
}
.sign-figure-real{
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px;min-height:84px;margin-bottom:6px;
}
.sign-figure-real svg{width:56px;height:56px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}

/* Блок шпаргалки "Легко перепутать" в разделе знаков */
.signs-cheat-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;margin-bottom:28px;
}
.signs-cheat-head{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.012em;color:var(--ink);margin:0 0 16px}
.signs-cheat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.signs-cheat-item{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.signs-cheat-pair{display:flex;gap:12px;align-items:center}
.signs-cheat-pair svg{width:46px;height:46px;flex:0 0 auto}
.signs-cheat-desc{font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:0}

function trafficLight(x,y,state){
  const on = c => state===c ? ({red:'#E0342A',yellow:'#F0B41C',green:'#22A45D'})[c] : 'rgba(255,255,255,.14)';
  return '<g transform="translate('+x+','+y+')">'+
    '<rect x="-2" y="20" width="4" height="16" fill="#3C5145"/>'+
    '<rect x="-10" y="-25" width="20" height="50" rx="6" fill="#1E2E26" stroke="#0B1510" stroke-width="1.5"/>'+
    '<circle cx="0" cy="-14" r="5.4" fill="'+on('red')+'"/>'+
    '<circle cx="0" cy="0" r="5.4" fill="'+on('yellow')+'"/>'+

/* регулировщик: pose = 'up' | 'side' | 'fwd' */
function warden(x,y,pose){
  const INK='var(--fig-ink)', SK='#E8B98F';
  /* жезл: чёрно-белые полосы, рисуется от точки кисти в заданную сторону */
  function baton(hx,hy,ang){
    let b='<g transform="translate('+hx+','+hy+') rotate('+ang+')">';
    for(let i=0;i<4;i++)
      b+='<rect x="'+(i*5.5)+'" y="-1.9" width="5.5" height="3.8" fill="'+(i%2?'#1A1A1A':'#F2F5F6')+'" stroke="#1A1A1A" stroke-width=".6"/>';
    return b+'</g>';
  }
  let arms='', bat='';
  if(pose==='up'){
    arms = '<path d="M0 -12 L1 -30" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<path d="M0 -12 L-12 -1" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="1" cy="-31" r="2.6" fill="'+SK+'"/>';
    bat = baton(1,-33,-90);
  } else if(pose==='side'){
    arms = '<path d="M0 -12 L-20 -12 M0 -12 L20 -12" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="21" cy="-12" r="2.6" fill="'+SK+'"/><circle cx="-21" cy="-12" r="2.6" fill="'+SK+'"/>';
    bat = baton(23,-12,0);
  } else {
    arms = '<path d="M0 -12 L19 -19" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<path d="M0 -12 L-11 -1" stroke="'+INK+'" stroke-width="4.6" stroke-linecap="round"/>'+
           '<circle cx="20" cy="-19" r="2.6" fill="'+SK+'"/>';
    bat = baton(22,-20,-14);
  }
  return '<g transform="translate('+x+','+y+')">'+
    '<ellipse cx="0" cy="28" rx="13" ry="4" fill="#000" opacity=".18"/>'+
    '<path d="M-6 -13 h12 l3 16 h-18 z" fill="'+INK+'"/>'+
    '<path d="M0 3 L-6 27 M0 3 L6 27" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M-7 26 h9 M-2 26 h9" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>'+
    arms +
    '<circle cx="0" cy="-21" r="6.4" fill="'+SK+'"/>'+
    '<path d="M-7.2 -24 a7.2 7.2 0 0 1 14.4 0 z" fill="'+INK+'"/>'+
    '<rect x="-8.4" y="-24.6" width="16.8" height="2.6" rx="1.3" fill="'+INK+'"/>'+
    '<rect x="-6.6" y="-14.6" width="13.2" height="3" rx="1.5" fill="#F2F5F6" opacity=".85"/>'+
    bat + '</g>';
}

function arrowPath(from,turn,startXY){
  const a = APPR[from];
  const to = TURNS[from][turn];
  const ex = EXITP[to];
  const s = startXY || a.idle;
  const st = a.stop;
  const id = 'ar'+(++_uid);
  let d;
  if(turn==='straight') d = 'M'+s[0]+' '+s[1]+' L'+ex[0]+' '+ex[1];
  else d = 'M'+s[0]+' '+s[1]+' L'+st[0]+' '+st[1]+' Q160 100 '+ex[0]+' '+ex[1];
  return '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink)"/></marker></defs>'+
    '<path d="'+d+'" fill="none" stroke="var(--fig-ink)" stroke-width="2.6" stroke-dasharray="7 6" opacity=".8" marker-end="url(#'+id+')"/>';
}

function zebra(side){
  const st='fill="var(--mark)"';
  let o='';
  if(side==='S'||side==='N'){
    const y = side==='S' ? 140 : 46;
    for(let i=0;i<7;i++) o+='<rect x="'+(130+i*9)+'" y="'+y+'" width="5" height="14" '+st+'/>';
  }else{
    const x = side==='W' ? 106 : 200;
    for(let i=0;i<7;i++) o+='<rect x="'+x+'" y="'+(70+i*9)+'" width="14" height="5" '+st+'/>';
  }
  return o;
}

function scene(sp){
  sp = sp||{};
  const arms = sp.arms || ['N','S','W','E'];
  let o = '<rect width="320" height="200" fill="var(--field)"/>';
  const hasV = arms.includes('N')||arms.includes('S');
  const hasH = arms.includes('W')||arms.includes('E');
  const vy0 = arms.includes('N')?0:68, vy1 = arms.includes('S')?200:132;
  const hx0 = arms.includes('W')?0:128, hx1 = arms.includes('E')?320:192;
  if(hasV) o += '<rect x="128" y="'+vy0+'" width="64" height="'+(vy1-vy0)+'" fill="var(--road)"/>';
  if(hasH) o += '<rect x="'+hx0+'" y="68" width="'+(hx1-hx0)+'" height="64" fill="var(--road)"/>';
  /* осевая разметка */
  const dash='stroke="var(--mark)" stroke-width="2.4" stroke-dasharray="10 9" opacity=".9"';
  const solid='stroke="var(--mark)" stroke-width="2.4" opacity=".9"';
  const vLine = sp.solidV ? solid : dash, hLine = sp.solidH ? solid : dash;
  if(arms.includes('N')) o += '<path d="M160 4 V62" '+vLine+'/>';
  if(arms.includes('S')) o += '<path d="M160 138 V196" '+vLine+'/>';
  if(arms.includes('W')) o += '<path d="M4 100 H122" '+hLine+'/>';
  if(arms.includes('E')) o += '<path d="M198 100 H316" '+hLine+'/>';
  (sp.zebra||[]).forEach(s=>{ o += zebra(s); });
  (sp.arrows||[]).forEach(a=>{ o += arrowPath(a.at, a.turn, a.from); });
  (sp.signs||[]).forEach(s=>{
    const pos = {S:[210,152],N:[110,48],W:[60,146],E:[260,54],SW:[110,152],SE:[210,152],NW:[110,48],NE:[210,48]}[s.at]||[210,152];
    o += signPost(pos[0],pos[1],s.code,s.size||34);
  });
  (sp.lights||[]).forEach(l=>{
    const pos = {S:[206,128],N:[114,72],W:[62,142],E:[258,58],C:[160,100]}[l.at]||[206,128];
    o += trafficLight(pos[0],pos[1],l.state);
  });
  if(sp.warden) o += warden(160,100,sp.warden);
  (sp.cars||[]).forEach(c=>{
    const a = APPR[c.at];
    const p = c.pos || a.idle;
    const rot = (c.rot!==undefined)?c.rot:a.rot;
    if(c.tram) o += tramCar(p[0],p[1],rot,c.label);
    else o += topCar(p[0],p[1],rot,c.color||'white',c.label);
  });
  (sp.peds||[]).forEach(p=>{ o += ped(p[0],p[1],1.0,'var(--fig-ink)'); });
  return sv(o,'0 0 320 200');
}

/* прямой участок дороги — для обгона, разметки, остановки */
function road(sp){
  sp = sp||{};
  let o = '<rect width="320" height="200" fill="var(--field)"/>'+
          '<rect x="0" y="56" width="320" height="88" fill="var(--road)"/>'+
          '<path d="M0 58 H320" stroke="var(--road-edge)" stroke-width="3"/>'+
          '<path d="M0 142 H320" stroke="var(--road-edge)" stroke-width="3"/>';
  const m = sp.marking||'dash';
  if(m==='dash')   o += '<path d="M0 100 H320" stroke="var(--mark)" stroke-width="3" stroke-dasharray="16 14"/>';
  if(m==='solid')  o += '<path d="M0 100 H320" stroke="var(--mark)" stroke-width="3"/>';
  if(m==='double') o += '<path d="M0 96 H320 M0 104 H320" stroke="var(--mark)" stroke-width="3"/>';
  if(m==='mixed')  o += '<path d="M0 96 H320" stroke="var(--mark)" stroke-width="3"/><path d="M0 104 H320" stroke="var(--mark)" stroke-width="3" stroke-dasharray="16 14"/>';
  if(sp.zebraX) { for(let i=0;i<9;i++) o += '<rect x="'+(sp.zebraX+i*9)+'" y="58" width="5" height="84" fill="var(--mark)"/>'; }
  (sp.cars||[]).forEach(c=>{ o += topCar(c.x,c.y,c.rot!==undefined?c.rot:90,c.color||'white',c.label); });
  (sp.arrows||[]).forEach(a=>{
    const id='ar'+(++_uid);
    o += '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink)"/></marker></defs>'+
      '<path d="'+a+'" fill="none" stroke="var(--fig-ink)" stroke-width="2.6" stroke-dasharray="7 6" opacity=".8" marker-end="url(#'+id+')"/>';
  });
  (sp.peds||[]).forEach(p=>{ o += ped(p[0],p[1],1.0,'var(--fig-ink)'); });
  (sp.signs||[]).forEach(s=>{ o += signPost(s.x,s.y,s.code,s.size||34); });
  return sv(o,'0 0 320 200');
}

const RULES_DATA = [{"id":"ch1","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 1. Общие положения","paragraphs":[{"text":"1. Настоящие Правила дорожного движения (далее - Правила) устанавливают единый порядок дорожного движения на всей территории Республики Казахстан.","isFootnote":false,"num":"1"},{"text":"2. В настоящих Правилах используются следующие основные понятия:","isFootnote":false,"num":"2"},{"text":"1) автомагистраль - дорога, специально построенная или реконструированная в соответствии с проектом для движения транспортных средств, которая не обслуживает придорожные владения. Доступ на нее возможен только с других дорог через развязки в разных уровнях. Эта дорога:","isFootnote":false,"num":"1)"},{"text":"имеет раздельные проезжие части для движения в разных направлениях, отделенные друг от друга разделительной полосой, не предназначенной для движения;","isFootnote":false,"num":null},{"text":"не имеет пересечений на одном уровне с другими дорогами, железнодорожными и трамвайными путями и пешеходными дорожками;","isFootnote":false,"num":null},{"text":"специально обозначена как автомагистраль, при въезде на автомагистраль знаком 5.1 и выезде знаком 5.2 согласно приложению 1 к настоящим Правилам;","isFootnote":false,"num":null},{"text":"2) автобус - автомобиль, предназначенный для перевозки пассажиров и багажа, имеющий более восьми мест для сидения, не включая место водителя;","isFootnote":false,"num":"2)"},{"text":"3) автомобиль – механическое транспортное средство, предназначенное для движения по дорогам и перевозки по ним людей, грузов или оборудования, установленного на нем, или буксировки по дорогам транспортных средств, предназначенных для перевозки людей, грузов или оборудования, установленного на нем, в том числе включая троллейбусы, за исключением сельскохозяйственных тракторов или механических транспортных средств, для которых перевозка людей и грузов является вспомогательной функцией. Данное понятие не распространяется на тракторы и самоходные машины;","isFootnote":false,"num":"3)"},{"text":"4) автопоезд - механическое транспортное средство, сцепленное с прицепом (прицепами);","isFootnote":false,"num":"4)"},{"text":"5) преимущество (приоритет) - первоочередность движения в намеченном направлении по отношению к другим участникам движения;","isFootnote":false,"num":"5)"},{"text":"6) тяжеловесное транспортное средство - транспортное средство с грузом или без груза, полная масса или распределение нагрузки по осям которого превышает величины предельно допустимых нагрузок для данной категории дорог и сооружений на них;","isFootnote":false,"num":"6)"},{"text":"7) остановка - преднамеренное прекращение движения транспортного средства на время до пяти минут либо на большее время, если это необходимо для посадки или высадки пассажиров, загрузки или разгрузки транспортного средства (не считается остановкой (стоянкой) необходимость прекращения движения транспортного средства, обусловленная организацией дорожного движения);","isFootnote":false,"num":"7)"},{"text":"8) багаж - имущество пассажира, упакованное и перевозимое в багажном отделении автобуса, микроавтобуса или багажном автомобиле, сопровождающем автобус, микроавтобус, в пределах норм, установленных Правилами перевозки пассажиров и багажа автомобильным транспортом, а также в такси на основании дополнительного соглашения с перевозчиком;","isFootnote":false,"num":"8)"},{"text":"9) главная дорога -дорога, обозначенная знаками 2.1, 2.3.1-2.3.3 или 5.1 согласно приложению 1 к настоящим Правилам по отношению к пересекаемой (примыкающей), или дорога с твердым покрытием (асфальто- и цементобетон, каменные материалы и тому подобное) по отношению к грунтовой. Наличие на второстепенной дороге непосредственно перед перекрестком участка с покрытием не делает ее равной по значению с пересекаемой;","isFootnote":false,"num":"9)"},{"text":"10) обгон - опережение движущегося впереди одного или нескольких транспортных средств, связанное с выездом из занимаемой полосы и последующим возвращением на ранее занимаемую полосу;","isFootnote":false,"num":"10)"},{"text":"11) разделительная полоса - конструктивно выделенный элемент дороги, разделяющий смежные проезжие части дороги и не предназначенный для движения или остановки безрельсовых транспортных средств и пешеходов, за исключением вынужденной остановки пешеходов при пересечении дороги вне населенного пункта;","isFootnote":false,"num":"11)"},{"text":"12) велосипед – транспортное средство, имеющее два колеса или более и приводимое в движение мускульной силой людей, находящихся на нем, в том числе с использованием двигателя;","isFootnote":false,"num":"12)"},{"text":"13) велосипедист - лицо, управляющее велосипедом;","isFootnote":false,"num":"13)"},{"text":"14) велосипедная дорожка - отдельная дорога или часть дороги, предназначенная для движения велосипедов и обозначенная соответствующим знаком. Велосипедная дорожка конструктивно отделяется от других дорог или от других элементов одной и той же дороги;","isFootnote":false,"num":"14)"},{"text":"15) велосипедная полоса движения - полоса проезжей части дороги, предназначенная для движения велосипедов. Велосипедная полоса движения отделяется от остальной проезжей части с помощью продольной дорожной разметки и специальных знаков;","isFootnote":false,"num":"15)"},{"text":"16) газон - участок земли с искусственным травяным покровом, являющийся фоном для посадок растений и парковых сооружений;","isFootnote":false,"num":"16)"},{"text":"17) клумба - участок земли в форме геометрической фигуры, на котором растения образуют узор или рисунок;","isFootnote":false,"num":"17)"},{"text":"18) населенный пункт - застроенная территория, въезды на которую и выезды с которой обозначены знаками 5.22 - 5.25 согласно приложению 1 к настоящим Правилам;","isFootnote":false,"num":"18)"},{"text":"18-1) светоотражающий предмет – предмет, изготовленный из специальных материалов, обладающих способностью возвращать луч света обратно к источнику, обеспечивающий видимость водителя на расстоянии ста пятидесяти метров при включенном ближнем свете фар и четырехсот при включенном дальнем свете фар, в том числе светоотражающая одежда, светоотражающий элемент на одежде;","isFootnote":false,"num":null},{"text":"19) пешеход - лицо, находящееся вне транспортного средства на дороге и не производящее на ней работы. К пешеходам приравниваются физические лица, передвигающиеся на креслах-колясках для лиц с инвалидностью, ведущие велосипед, электрический самокат, малое электрическое транспортное средство, мопед, мотоцикл, везущие санки, тележку, детскую коляску;","isFootnote":false,"num":"19)"},{"text":"20) пешеходный переход - участок проезжей части дороги, обозначенный знаками 5.16.1, 5.16.2, 5.16.3 согласно приложению 1 к настоящим Правилам и (или) разметкой 1.14.1 - 1.14.3 согласно приложению 2 к настоящим Правилам и выделенный для движения пешеходов через дорогу. При отсутствии разметки ширина пешеходного перехода определяется расстоянием между знаками 5.16.1 и 5.16.2 согласно приложению 1 к настоящим Правилам по оси дороги;","isFootnote":false,"num":"20)"},{"text":"21) недостаточная видимость - видимость дороги менее 300 метров в условиях тумана, дождя, пыли, снегопада и тому подобного, а также в сумерки;","isFootnote":false,"num":"21)"},{"text":"22) пассажир - лицо, находящееся на (в) транспортном средстве и не управляющее им;","isFootnote":false,"num":"22)"},{"text":"23) нерегулярные автомобильные перевозки пассажиров и багажа - перевозки, которые не относятся к регулярным, осуществляемые с использованием автобусов, микроавтобусов перевозчиками, имеющими лицензии, выданные в установленном порядке;","isFootnote":false,"num":"23)"},{"text":"24) дорога - вся полоса отвода земли либо поверхность искусственного сооружения, обустроенная или приспособленная и используемая для движения транспортных средств и пешеходов в порядке, установленном Законом Республики Казахстан \"О дорожном движении\" (далее-Закон \"О дорожном движении\") и настоящими Правилами. Дорога включает в себя одну или несколько проезжих частей дороги, а также трамвайные пути, тротуары, обочины и разделительные полосы при их наличии;","isFootnote":false,"num":"24)"},{"text":"25) уступить дорогу (не создавать помех) - означает, что участник дорожного движения не начинает, не возобновляет или не продолжает движение, не осуществляет какой-либо маневр, если это может вынудить других участников движения, имеющих по отношению к нему преимущество, изменить направление движения или скорость;","isFootnote":false,"num":"25)"},{"text":"26) обочина - элемент дороги, примыкающий непосредственно к проезжей части и предназначенный для обеспечения устойчивости земляного полотна, повышения безопасности дорожного движения, организации движения пешеходов и велосипедистов, а также использования при чрезвычайных ситуациях;","isFootnote":false,"num":"26)"},{"text":"27) дорожное движение - совокупность общественных отношений, возникающих в процессе перемещения людей и грузов посредством транспортных средств или без таковых в пределах дорог;","isFootnote":false,"num":"27)"},{"text":"28) проезжая часть дороги - часть дороги, используемая для движения транспортных средств;","isFootnote":false,"num":"28)"},{"text":"29) участник дорожного движения - лицо, принимающее непосредственное участие в процессе дорожного движения в качестве пешехода, пассажира или водителя;","isFootnote":false,"num":"29)"},{"text":"30) безопасность дорожного движения - состояние дорожного движения, отражающее степень защищенности его участников от дорожно-транспортных происшествий и их последствий, а также негативных воздействий дорожного движения на экологическую обстановку, здоровье населения;","isFootnote":false,"num":"30)"},{"text":"31) организация дорожного движения - комплекс организационно-правовых, нормативно-методических, проектно-изыскательских, организационно-технических, контрольно-надзорных, распорядительных и других мероприятий по управлению дорожным движением;","isFootnote":false,"num":"31)"},{"text":"32) дорожно-транспортное происшествие - событие, возникшее в процессе движения по дороге транспортного средства и с его участием, повлекшее причинение вреда здоровью, смерть человека, повреждение транспортных средств, сооружений, грузов либо иной материальный ущерб;","isFootnote":false,"num":"32)"},{"text":"33) перекресток - место пересечения, примыкания или разветвления дорог на одном уровне, ограниченное воображаемыми линиями, соединяющими соответственно противоположные, наиболее удаленные от центра перекрестка начала закруглений проезжих частей дорог. Не считаются перекрестками выезды с прилегающих территорий, а также места пересечения (примыкания) с полевыми, лесными дорогами;","isFootnote":false,"num":"33)"},{"text":"34) водитель – лицо, управляющее транспортным средством, погонщик, ведущий по дороге скот, стадо, вьючных, упряжных или верховых животных. К водителю приравнивается мастер обучения вождению во время образовательного процесса;","isFootnote":false,"num":"34)"},{"text":"35) масса без нагрузки - масса транспортного средства без экипажа, пассажиров и груза, но с полным запасом топлива и необходимым комплектом инструмента;","isFootnote":false,"num":"35)"},{"text":"36) масса с нагрузкой - фактическая масса груженого транспортного средства, экипажа и пассажиров;","isFootnote":false,"num":"36)"},{"text":"37) край проезжей части дороги - определяется линией разметки, а при ее отсутствии условной линией, проходящей по кромке дорожного покрытия, а также в месте примыкания проезжей части дороги к трамвайным путям у края дороги. При невозможности определить кромку дорожного покрытия, в том числе и по дорожным условиям край проезжей части дороги определяется самим участником дорожного движения по краю накатанной полосы;","isFootnote":false,"num":"37)"},{"text":"38) полоса движения - любая из продольных полос проезжей части дороги, обозначенная или не обозначенная продольной разметкой и имеющая ширину, достаточную для движения автомобилей в один ряд;","isFootnote":false,"num":"38)"},{"text":"39) препятствие для движения - неподвижный объект на полосе движения, не позволяющий продолжить движение по этой полосе. Не является препятствием затор или транспортное средство, остановившееся на этой полосе движения в соответствии с требованиями настоящих Правил;","isFootnote":false,"num":"39)"},{"text":"40) опасность для движения - ситуация, возникшая в процессе дорожного движения, при которой продолжение движения в том же направлении и с той же скоростью создает угрозу возникновения дорожно-транспортного происшествия;","isFootnote":false,"num":"40)"},{"text":"41) перестроение - смена занимаемой транспортным средством полосы движения с сохранением первоначального направления движения;","isFootnote":false,"num":"41)"},{"text":"42) опасный груз - груз, который в силу присущих ему свойств и особенностей при перевозке, производстве погрузочно-разгрузочных работ и хранении может послужить причиной взрыва, пожара или повреждения технических средств, устройств, зданий, строений и сооружений, а также гибели, травмирования или заболевания людей, животных, нанесения вреда окружающей среде;","isFootnote":false,"num":"42)"},{"text":"43) общественный транспорт - транспорт общего пользования, осуществляющий регулярные и нерегулярные автомобильные перевозки пассажиров и багажа, а также такси;","isFootnote":false,"num":"43)"},{"text":"44) транспортное средство - устройство, предназначенное для перевозки по дорогам людей, грузов или оборудования, установленного на нем;","isFootnote":false,"num":"44)"},{"text":"45) дневные ходовые огни - внешние световые приборы, предназначенные для улучшения видимости движущегося транспортного средства спереди в светлое время суток;","isFootnote":false,"num":"45)"},{"text":"45-1) средняя скорость движения транспортного средства – скорость, определяемая путем деления протяженности участка дорог общего пользования международного, республиканского значения, пройденного транспортным средством, на промежуток времени, в течение которого это расстояние пройдено;","isFootnote":false,"num":null},{"text":"46) маневрирование - начало движения от остановки (стоянки), остановка, поворот (разворот), перестроение, торможение и движение транспортного средства задним ходом;","isFootnote":false,"num":"46)"},{"text":"47) маршрутное транспортное средство - транспортное средство общего пользования (автобус, троллейбус, трамвай), предназначенное для перевозки по дорогам пассажиров и движущееся по установленному маршруту с обозначенными остановочными пунктами (остановками);","isFootnote":false,"num":"47)"},{"text":"48) вынужденная остановка - прекращение движения транспортного средства из-за его технической неисправности или опасности, создаваемой перевозимым грузом, состоянием водителя (пассажира) или появлением препятствия на дороге;","isFootnote":false,"num":"48)"},{"text":"49) механическое транспортное средство - самоходное дорожное транспортное средство, приводимое в движение двигателем, за исключением электрических самокатов, малых электрических транспортных средств и рельсовых транспортных средств. Понятие распространяется также на тракторы и самоходные машины при их участии в дорожном движении;","isFootnote":false,"num":"49)"},{"text":"50) мопед – двух- или трехколесное механическое транспортное средство, снабженное двигателем внутреннего сгорания с объемом двигателя, не превышающим пятидесяти кубических сантиметров, либо электрическим двигателем и имеющее максимальную конструктивную скорость не более пятидесяти километров в час. К мопедам приравниваются мокики, скутеры и другие механические транспортные средства с аналогичными характеристиками;","isFootnote":false,"num":"50)"},{"text":"51) мотоцикл - двухколесное механическое транспортное средство с боковым прицепом или без него, имеющее двигатель. К мотоциклам приравниваются трех- и четырехколесные транспортные средства, вес которых без нагрузки не превышает четырехсот килограммов, скутеры с объемом цилиндра, превышающим пятьдесят кубических сантиметров, и другие транспортные средства с аналогичными характеристиками;","isFootnote":false,"num":"51)"},{"text":"52) опережение - движение транспортного средства со скоростью, большей, чем скорость движения транспортного средства, движущегося по соседней полосе, одного направления;","isFootnote":false,"num":"52)"},{"text":"53) разрешенная максимальная масса - масса снаряженного транспортного средства с грузом, водителем и пассажирами, установленная предприятием-изготовителем в качестве максимально допустимой. За разрешенную максимальную массу состава транспортных средств, то есть сцепленных и движущихся как одно целое, принимается сумма разрешенных максимальных масс транспортных средств, входящих в состав;","isFootnote":false,"num":"53)"},{"text":"54) регулировщик - распознаваемый и видимый в любое время суток сотрудник органов внутренних дел, военной полиции или военнослужащий дорожно-комендантского подразделения, работник органов транспортного контроля Министерства индустрии и инфраструктурного развития Республики Казахстан (далее - органов транспортного контроля), работник дорожно-эксплуатационной службы, дежурный на железнодорожном переезде, паромной переправе, имеющие соответствующее удостоверение и экипировку (форменную одежду или отличительный знак - нарукавную повязку, жезл, диск с красным сигналом либо световозвращателем, красный фонарь или флажок), уполномоченные выполнять распорядительные действия по управлению движением на дорогах;","isFootnote":false,"num":"54)"},{"text":"55) такси - легковой автомобиль, предназначенный для автомобильной перевозки пассажиров и багажа, оборудованный в соответствии с Правилами перевозок пассажиров и багажа автомобильным транспортом;","isFootnote":false,"num":"55)"},{"text":"56) темное время суток - промежуток времени от конца вечерних сумерек до начала утренних сумерек;","isFootnote":false,"num":"56)"},{"text":"57) железнодорожный переезд - пересечение дороги с железнодорожными путями на одном уровне. Границей переезда является участок дороги, ограниченный воображаемой линией на расстоянии 10 метров от ближайшего рельса;","isFootnote":false,"num":"57)"},{"text":"58) стоянка - преднамеренное прекращение движения транспортного средства на время более пяти минут по причинам, не связанным с посадкой или высадкой пассажиров либо загрузкой или разгрузкой транспортного средства;","isFootnote":false,"num":"58)"},{"text":"59) тротуар - часть дороги, предназначенная для движения пешеходов, примыкающая к проезжей части дороги или отделенная от нее газоном;","isFootnote":false,"num":"59)"},{"text":"60) жилая зона - участок, застроенная территория или массив, обозначенные знаком 5.38 согласно приложению 1 к настоящим Правилам;","isFootnote":false,"num":"60)"},{"text":"61) прицеп - транспортное средство, не оборудованное двигателем и предназначенное для движения в составе с механическим транспортным средством. Понятие распространяется также на полуприцепы и прицепы-роспуски;","isFootnote":false,"num":"61)"},{"text":"62) организованная пешая колонна - группа движущихся по дороге пешеходов, организованная и обозначенная в соответствии с требованиями пункта 14 главы 3 настоящих Правил;","isFootnote":false,"num":"62)"},{"text":"63) организованная транспортная колонна - группа из трех и более механических транспортных средств, следующих непосредственно друг за другом по одной и той же полосе движения с постоянно включенными фарами в сопровождении головного транспортного средства с включенным проблесковым маячком синего цвета или маячками синего и красного цветов;","isFootnote":false,"num":"63)"},{"text":"63-1) малое электрическое транспортное средство – транспортное средство, оснащенное электрическим двигателем, предназначенное для индивидуального передвижения, имеющее одно или несколько колес, за исключением электрических самокатов и велосипедов с электрическим двигателем;","isFootnote":false,"num":null},{"text":"64) ограниченная видимость – видимость водителем дороги менее 100 метров в направлении движения, ограниченная рельефом местности, геометрическими параметрами дороги, растительностью, строениями, сооружениями или иными объектами, в том числе транспортными средствами;","isFootnote":false,"num":"64)"},{"text":"65) прилегающая территория – территория, непосредственно прилегающая к дороге и не предназначенная для сквозного движения транспортных средств. Движение по прилегающей территории осуществляется в соответствии с настоящими Правилами;","isFootnote":false,"num":"65)"},{"text":"66) крупногабаритное транспортное средство - транспортное средство с грузом или без груза, имеющее превышение габаритных размеров, установленных нормативными правовыми актами;","isFootnote":false,"num":"66)"},{"text":"66-1) электромобиль – механическое транспортное средство, оснащенное и приводимое в движение электрическим двигателем, получающим энергию от аккумуляторных батарей, емкостных накопителей и (или) топливных элементов, и заряжаемое исключительно с помощью внешнего источника электрической энергии;","isFootnote":false,"num":null},{"text":"67) электрический самокат – транспортное средство индивидуальной мобильности, имеющее два или три колеса, предназначенное для передвижения одного человека посредством использования электрического двигателя (электрических двигателей), не имеющее сиденья, с максимальной конструктивной скоростью не более двадцати пяти километров в час;","isFootnote":false,"num":"67)"},{"text":"68) упрощенное оформление дорожно-транспортного происшествия – оформление документов о дорожно-транспортном происшествии без участия сотрудников органов внутренних дел Республики Казахстан в случаях, установленных Законом Республики Казахстан \"Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств.","isFootnote":false,"num":"68)"},{"text":"Сноска. Пункт 2 с изменениями, внесенными приказами Министра внутренних дел РК от 31.08.2023 № 671 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 25.12.2024 № 1013 (порядок введения в действие см. п. 4).","isFootnote":true,"num":null},{"text":"3. На территории Республики Казахстан установлено правостороннее движение транспортных средств.","isFootnote":false,"num":"3"},{"text":"4. Необходимые изменения и ограничения в организации дорожного движения вводятся в установленном порядке только при помощи дорожных знаков, дорожной разметки, сигналов светофоров и регулировщиков, а также распоряжениями лиц, уполномоченных регулировать движение.","isFootnote":false,"num":"4"},{"text":"При изменении в организации дорожного движения на дорогах или отдельных участках дорог участники дорожного движения уведомляются через средства массовой информации.","isFootnote":false,"num":null},{"text":"В местах производства дорожных работ и временного изменения направления движения применяются временные дорожные знаки, на желтом фоне.","isFootnote":false,"num":null},{"text":"5. Реализация прав одних участников дорожного движения не должна нарушать права других участников дорожного движения.","isFootnote":false,"num":"5"},{"text":"Участники дорожного движения обязаны:","isFootnote":false,"num":null},{"text":"1) знать и соблюдать настоящие Правила, требования Закона \"О дорожном движении\";","isFootnote":false,"num":"1)"},{"text":"2) выполнять требования сигналов регулировщика и светофора, дорожных знаков, дорожной разметки, которые применяются для регулировки дорожного движения, звуковых и световых сигналов, используемых при дорожных работах, специальных световых и звуковых сигналов транспортных средств оперативных и специальных служб;","isFootnote":false,"num":"2)"},{"text":"3) создавать безопасные условия для дорожного движения, своими действиями или бездействием не причинять вреда другим участникам дорожного движения, их транспортным средствам и иному имуществу;","isFootnote":false,"num":"3)"},{"text":"4) не повреждать и не загрязнять дорожное покрытие, не снимать дорожных знаков, не заслонять и не повреждать их, не устанавливать самовольно дорожные знаки, светофоры и другие технические средства организации дорожного движения;","isFootnote":false,"num":"4)"},{"text":"5) не затруднять дорожное движение или не создавать угрозы его безопасности выбрасыванием, разгрузкой или оставлением на дороге предметов или материалов, мешающих движению, воздерживаться от любых действий, которые могут создавать помехи для дорожного движения, представлять опасность для людей или причинять ущерб имуществу;","isFootnote":false,"num":"5)"},{"text":"6) принять меры в случае обнаружения или создания на дороге препятствия для дорожного движения по устранению этого препятствия, а если это невозможно - обозначить это препятствие в соответствии с требованиями Закона \"О дорожном движении\" или иным способом, обеспечивающим безопасность дорожного движения, и сообщить о препятствии в уполномоченный орган по обеспечению безопасности дорожного движения или владельцам дорог;","isFootnote":false,"num":"6)"},{"text":"7) действовать добросовестно, корректно, быть внимательными и взаимно вежливыми, не создавать препятствий и опасности для дорожного движения;","isFootnote":false,"num":"7)"},{"text":"8) не допускать загрязнения дорог, в том числе не выбрасывать мусор, предметы, создающие опасность для движения, и иные предметы вне специально отведенных мест;","isFootnote":false,"num":"8)"},{"text":"9) исполнять иные обязанности в сфере дорожного движения, установленные законами Республики Казахстан.","isFootnote":false,"num":"9)"},{"text":"6. Лица, нарушившие настоящие Правила, несут ответственность в соответствии с законодательством Республики Казахстан.","isFootnote":false,"num":"6"},{"text":"Примечание ИЗПИ!","isFootnote":false,"num":null},{"text":"Пункт 7 предусматривается в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводятся в действие с 12.07.2026).","isFootnote":false,"num":null},{"text":"7. В случае остановки транспортного средства лица, обладающие правом проверять у водителя транспортного средства документы или использовать транспортное средство, незамедлительно подходят к транспортному средству, разъясняют причины остановки транспортного средства и предъявляют по требованию водителя для ознакомления и установления фамилии и должности, служебное удостоверение без его передачи водителю, в случае, если нарушение водителем транспортного средства требований Закона \"О дорожном движении\" и (или) настоящих Правил зафиксировано сертифицированными специальными техническими средствами и приборами, предъявить водителю соответствующие материалы для ознакомления.","isFootnote":false,"num":"7"},{"text":"8. В случае дорожно-транспортного происшествия, если нет пострадавших, при взаимном согласии водителей в оценке обстоятельств случившегося, предварительно составив схему происшествия и подписав ее, они прибывают в ближайшее подразделение органов внутренних дел для оформления происшествия, за исключением упрощенного оформления дорожно-транспортного происшествия.","isFootnote":false,"num":"8"},{"text":"Сноска. Пункт 8 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null}]},{"id":"ch2","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 2. Общие обязанности водителей","paragraphs":[{"text":"9. Водитель механического транспортного средства обязан:","isFootnote":false,"num":"9"},{"text":"1) иметь при себе и по требованию уполномоченных на то должностных лиц органов внутренних дел, органов транспортного контроля передавать им для проверки:","isFootnote":false,"num":"1)"},{"text":"водительское удостоверение на право управления транспортным средством либо временное удостоверение, выданное взамен водительского удостоверения, за исключением выданных в Республике Казахстан, при наличии документа, удостоверяющего личность водителя;","isFootnote":false,"num":null},{"text":"свидетельство о государственной регистрации транспортного средства, за исключением выданного в Республике Казахстан, либо документ, свидетельствующий о праве собственности на транспортное средство;","isFootnote":false,"num":null},{"text":"путевой лист, документ на провозимый груз (товарно-транспортную накладную), а также иные установленные законодательством Республики Казахстан документы на транспортное средство, за исключением зарегистрированных в единой системе управления транспортными документами;","isFootnote":false,"num":null},{"text":"2) остановить транспортное средство по требованию сотрудника органов внутренних дел, транспортного контроля в форменной одежде об остановке транспортного средства путем подачи сигнала с помощью громкоговорящего устройства, жестом руки или жезлом, направленных на транспортное средство, с одновременным сигналом свистка, которые должны быть понятны водителю и поданы своевременно с тем, чтобы их исполнение не создало аварийную обстановку;","isFootnote":false,"num":"2)"},{"text":"3) не покидать транспортное средство без принятия мер, исключающих самопроизвольное движение транспортного средства, а также в случае его остановки сотрудником органов внутренних дел без его разрешения;","isFootnote":false,"num":"3)"},{"text":"4) пройти по требованию сотрудника органов внутренних дел освидетельствование на состояние опьянения;","isFootnote":false,"num":"4)"},{"text":"5) при движении на транспортном средстве, оборудованном ремнями безопасности, быть пристегнутым и не перевозить пассажиров, не пристегнутых ремнями;","isFootnote":false,"num":"5)"},{"text":"6) пройти проверку знаний настоящих Правил в случаях, установленных Кодексом Республики Казахстан об административных правонарушениях;","isFootnote":false,"num":"6)"},{"text":"7) предоставить транспортное средство:","isFootnote":false,"num":"7)"},{"text":"медицинским работникам, следующим в попутном направлении для оказания медицинской помощи, а также, независимо от направления движения, медицинским работникам, сотрудникам органов внутренних дел и органов национальной безопасности для транспортировки граждан, нуждающихся в срочной медицинской помощи, в лечебные учреждения, а также при проведении антитеррористических операций с возмещением затрат;","isFootnote":false,"num":null},{"text":"сотрудникам органов внутренних дел для транспортировки транспортных средств, поврежденных при дорожно-транспортных происшествиях, проезда к месту стихийного бедствия, а также сотрудникам органов внутренних дел, Службы государственной охраны Республики Казахстан и органов национальной безопасности в других предусмотренных законодательством Республики Казахстан случаях.","isFootnote":false,"num":null},{"text":"Требование о предоставлении транспортного средства не распространяется на транспортные средства представительств иностранных государств и международных организаций, обладающих дипломатическим иммунитетом.","isFootnote":false,"num":null},{"text":"Лица, воспользовавшиеся транспортным средством, должны по требованию водителя выдать справку или сделать запись в путевом листе (с указанием продолжительности поездки, пройденного расстояния, своей фамилии, должности, номера служебного удостоверения, наименования своей организации).","isFootnote":false,"num":null},{"text":"Расходы, связанные с предоставлением транспортного средства вышеперечисленным сотрудникам государственных организаций, по требованию владельца транспортного средства возмещаются этими организациями в установленном порядке.","isFootnote":false,"num":null},{"text":"8) при дорожно-транспортном происшествии водитель, причастный к нему, обязан:","isFootnote":false,"
