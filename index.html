num":"8)"},{"text":"немедленно остановить (не трогать с места) транспортное средство, включить аварийную световую сигнализацию и выставить знак аварийной остановки (мигающий красный фонарь) в соответствии с требованиями пункта 45 главы 7 настоящих Правил, не перемещать предметы, имеющие отношение к происшествию;","isFootnote":false,"num":null},{"text":"принять возможные меры для оказания доврачебной медицинской помощи пострадавшим, вызвать скорую медицинскую помощь, а в экстренных случаях отправить пострадавших на попутном, а если это невозможно, доставить на своем транспортном средстве в ближайшее лечебное учреждение, сообщить свою фамилию, государственный регистрационный номерной знак транспортного средства (с предъявлением документа, удостоверяющего личность, или водительского удостоверения и регистрационного документа на транспортное средство) и возвратиться к месту происшествия;","isFootnote":false,"num":null},{"text":"сообщить незамедлительно о случившемся в ближайший орган внутренних дел, записать фамилии и адреса очевидцев и ожидать прибытия сотрудников органов внутренних дел, за исключением случаев, предусмотренных пунктом 8 главы 1 настоящих Правил;","isFootnote":false,"num":null},{"text":"освободить проезжую часть дороги, если движение других транспортных средств невозможно;","isFootnote":false,"num":null},{"text":"при необходимости освобождения проезжей части дороги предварительно зафиксировать в присутствии свидетелей положение транспортного средства, следов и предметов, относящихся к происшествию, принять все возможные меры к их сохранению и обеспечить объезд места происшествия.","isFootnote":false,"num":null},{"text":"При управлении мотоциклом или мопедом водители находятся в застегнутом мотошлеме и не перевозят пассажиров без застегнутого мотошлема.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 9 с изменениями, внесенными приказами Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025); от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"10. Транспортные средства, находящиеся в международном движении, допускаются к участию в дорожном движении на территории Республики Казахстан при наличии выданных в соответствии с требованиями международных договоров, ратифицированных Республикой Казахстан:","isFootnote":false,"num":"10"},{"text":"1) свидетельство о регистрации транспортного средства, прицепа;","isFootnote":false,"num":"1)"},{"text":"2) регистрационного номера транспортного средства;","isFootnote":false,"num":"2)"},{"text":"3) отличительного знака государства;","isFootnote":false,"num":"3)"},{"text":"4) опознавательного знака транспортного средства;","isFootnote":false,"num":"4)"},{"text":"5) документа, подтверждающий факт прохождения технического осмотра транспортным средством.","isFootnote":false,"num":"5)"},{"text":"11. При возникновении в пути прочих неисправностей и условий, с которыми Основными положениями по допуску транспортных средств к эксплуатации (далее - Основные положения) запрещена эксплуатация транспортных средств и которые водитель в состоянии обнаружить, он устраняет их, а если это невозможно, то следует к месту стоянки или ремонта с соблюдением необходимых мер предосторожности.","isFootnote":false,"num":"11"},{"text":"12. Водителю запрещается:","isFootnote":false,"num":"12"},{"text":"1) управлять транспортным средством без водительского удостоверения на право управления транспортным средством либо временного удостоверения, выданного взамен водительского удостоверения, за исключением выданных в Республике Казахстан, в случае наличия при себе документа, удостоверяющего личность водителя;","isFootnote":false,"num":"1)"},{"text":"2) управлять транспортным средством в состоянии опьянения (алкогольного, наркотического и (или) токсикоманического); под воздействием лекарственных препаратов, ухудшающих реакцию и внимание; в болезненном или утомленном состоянии, ставящем под угрозу безопасность дорожного движения;","isFootnote":false,"num":"2)"},{"text":"3) управлять неисправным транспортным средством, транспортным средством, не прошедшим обязательный технический осмотр, за исключением транспортных средств категорий M1, возраст которых не превышает семи лет, включая год выпуска, не используемых в предпринимательской деятельности в сфере автомобильного транспорта;","isFootnote":false,"num":"3)"},{"text":"4) управлять транспортным средством, владелец которого в установленных законодательством Республики Казахстан случаях не заключил договор обязательного страхования гражданско-правовой ответственности владельцев транспортных средств и (или) договор обязательного страхования гражданско-правовой ответственности перевозчика перед пассажирами;","isFootnote":false,"num":"4)"},{"text":"5) управлять транспортным средством в случаях отсутствия государственных регистрационных номерных знаков или их несоответствия регистрационным документам;","isFootnote":false,"num":"5)"},{"text":"6) передавать управление транспортным средством лицам, находящимся в состоянии опьянения, под воздействием лекарственных препаратов, ухудшающих реакцию и внимание, в болезненном или утомленном состоянии, а также лицам, кроме обучаемых вождению, не имеющим при себе водительского удостоверения либо временного удостоверения, выданного взамен водительского удостоверения, на право управления транспортным средством данной категории, за исключением выданных в Республике Казахстан, в случае наличия при себе документа, удостоверяющего личность водителя, или не указанного в путевом (маршрутном) листе, либо лицам, не имеющим права управления или лишенным права управления транспортным средством;","isFootnote":false,"num":"6)"},{"text":"7) пересекать организованные (в том числе и пешие) колонны и занимать место в них;","isFootnote":false,"num":"7)"},{"text":"8) при управлении транспортным средством пользоваться телефоном либо радиостанцией, за исключением их использования посредством применения наушников или громкой связи;","isFootnote":false,"num":"8)"},{"text":"9) управлять транспортным средством с недействующей рабочей тормозной системой или рулевым управлением, неисправным сцепным устройством (в составе поезда), а в темное время суток на дорогах без искусственного освещения или в условиях недостаточной видимости - с не горящими (отсутствующими) фарами и (или) задними габаритными огнями, во время дождя или снегопада - с неисправными стеклоочистителями ветрового стекла;","isFootnote":false,"num":"9)"},{"text":"Недействующими считаются рабочая тормозная система или рулевое управление, которые не позволяют остановить транспортное средство или осуществить маневр при движении с минимальной скоростью.","isFootnote":false,"num":null},{"text":"10) употреблять алкогольные напитки, наркотические или психотропные вещества после дорожно-транспортного происшествия, к которому он причастен, либо после того, как транспортное средство было остановлено по требованию сотрудника органов внутренних дел, до проведения уполномоченным должностным лицом освидетельствования в целях установления состояния опьянения или до принятия уполномоченным должностным лицом решения об освобождении от проведения такого освидетельствования;","isFootnote":false,"num":"10)"},{"text":"11) осуществлять стоянку в местах, оборудованных электрозарядными станциями, без их зарядки.","isFootnote":false,"num":"11)"},{"text":"В пунктах 58 и 59 главы 8, пунктах 61 и 62 главы 9, пункте 76 главы 10, пунктах 80 и 81 главы 11, пунктах 87, 88 и 90 главы 12, пунктах 92 и 93 главы 13, пункте 109 главы 14, пункте 115 главы 15, пункте 118 главы 16, пункте 122 главы 17, пунктах 144 и 145 главы 20, пунктах 156 и 157 главы 22 настоящих Правил предусмотрены иные запреты для водителей.","isFootnote":false,"num":null},{"text":"12) управлять мотоциклом или мопедом, не держась за руль хотя бы одной рукой;","isFootnote":false,"num":"12)"},{"text":"13) управлять мотоциклом или мопедом на одном колесе, а равно располагаться вне места, предназначенного для управления данным транспортным средством;","isFootnote":false,"num":"13)"},{"text":"14) перевозить на мотоциклах или мопедах, а также на специальных приспособлениях груз, который выступает более чем на пятьдесят сантиметров по длине или ширине за их габариты, или груз, мешающий управлению.","isFootnote":false,"num":"14)"},{"text":"Сноска. Пункт 12 с изменениями, внесенными приказами Министра внутренних дел РК от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null}]},{"id":"ch3","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 3. Обязанности пешеходов","paragraphs":[{"text":"13. Пешеходы двигаются по тротуарам или пешеходным дорожкам, а при их отсутствии – по обочинам, а также в соответствии с требованиями пунктов 121 и 124 главы 17 настоящих Правил.","isFootnote":false,"num":"13"},{"text":"Пешеходы, перевозящие или переносящие громоздкие предметы, а также лица, передвигающиеся на креслах-колясках без двигателя, двигаются по краю проезжей части дороги (на дорогах с разделительной полосой - по внешнему краю проезжей части дороги), если их движение по тротуарам или обочинам создает помехи для других пешеходов.","isFootnote":false,"num":null},{"text":"При отсутствии тротуаров, пешеходных дорожек или обочин, а также в случае невозможности двигаться по ним пешеходы двигаются по велосипедной дорожке или идут в один ряд по краю проезжей части дороги (на дорогах с разделительной полосой - по внешнему краю проезжей части дороги).","isFootnote":false,"num":null},{"text":"Вне населенных пунктов при движении по проезжей части дороги пешеходы идут навстречу движению транспортных средств.","isFootnote":false,"num":null},{"text":"Лица, передвигающиеся на креслах-колясках без двигателя, ведущие мотоцикл, мопед, велосипед по краю проезжей части дороги, следуют по правой стороне дороги по ходу движения транспортных средств.","isFootnote":false,"num":null},{"text":"14. Движение организованных пеших колонн по проезжей части дороги осуществляется по направлению движения транспортных средств по правой стороне не более чем по четыре человека в ряд. Спереди и сзади колонны с левой стороны находятся сопровождающие с красными флажками, а в темное время суток и условиях недостаточной видимости - с включенными фонарями: спереди - белого цвета, сзади - красного.","isFootnote":false,"num":"14"},{"text":"15. Пешеходы пересекают проезжую часть дороги по пешеходным переходам, в том числе по подземным и надземным, а при их отсутствии в пределах видимости - на перекрестках по линии тротуаров или обочин.","isFootnote":false,"num":"15"},{"text":"При отсутствии в зоне видимости перехода или перекрестка разрешается пересекать дорогу под прямым углом к краю проезжей части дороги там, где она хорошо просматривается в обе стороны. Не допускается пересекать проезжую часть дороги вне пешеходного перехода при наличии разделительной полосы в населенном пункте, а также в местах, где установлены пешеходные или дорожные ограждения.","isFootnote":false,"num":null},{"text":"16. В местах, где движение регулируется, пешеходы руководствуются сигналами регулировщика или пешеходного светофора, а при их отсутствии - транспортного светофора.","isFootnote":false,"num":"16"},{"text":"17. На нерегулируемых пешеходных переходах пешеходы выходят на проезжую часть дороги после того, как оценят расстояние до приближающихся транспортных средств, их скорость и убедятся, что переход будет для них безопасен. При пересечении проезжей части дороги вне пешеходного перехода пешеходы не создают помех для движения транспортных средств и не выходят из-за стоящего транспортного средства или иного препятствия, ограничивающего обзорность, не убедившись в отсутствии приближающихся транспортных средств.","isFootnote":false,"num":"17"},{"text":"Понятия регулируемого и нерегулируемого пешеходного перехода аналогичны понятиям регулируемого и нерегулируемого перекрестка, установленным в пункте 94 главы 13 настоящих Правил.","isFootnote":false,"num":null},{"text":"18. Выйдя на проезжую часть дороги, пешеходы не задерживаются и не останавливаются, если это не связано с обеспечением безопасности движения. Пешеходы, не успевшие закончить переход, останавливаются на линии, разделяющей транспортные потоки противоположных направлений. Продолжать переход можно лишь убедившись в безопасности дальнейшего движения и с учетом сигналов светофора (регулировщика).","isFootnote":false,"num":"18"},{"text":"19. При приближении транспортных средств с включенными проблесковыми маячками синего и (или) красного цвета и специальным звуковым сигналом пешеходы не переходят проезжую часть дороги, а находящиеся на ней уступают дорогу этим транспортным средствам и освобождают проезжую часть дороги.","isFootnote":false,"num":"19"},{"text":"Сноска. Пункт 19 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"20. Ожидание маршрутного транспортного средства и такси осуществляется на приподнятых по отношению к проезжей части дороги посадочных площадках, а при их отсутствии - на тротуаре или обочине. На остановочных пунктах, не оборудованных приподнятыми посадочными площадками, допускается выходить на проезжую часть дороги для посадки в транспортное средство лишь после его остановки. После высадки пешеходы не задерживаясь освобождают проезжую часть дороги.","isFootnote":false,"num":"20"},{"text":"При движении через проезжую часть дороги к остановочному пункту или от него пешеходы руководствуются требованиями пунктов 16, 17, 18 и 19 настоящей главы.","isFootnote":false,"num":null}]},{"id":"ch4","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 4. Обязанности пассажиров","paragraphs":[{"text":"21. Пассажиры обязаны:","isFootnote":false,"num":"21"},{"text":"1) при поездке на транспортном средстве, оборудованном ремнями безопасности, быть пристегнутыми ими (с учетом подпункта 5) пункта 9 главы 2 настоящих Правил), а при поездке на мотоцикле или мопеде - быть в застегнутом мотошлеме;","isFootnote":false,"num":"1)"},{"text":"2) посадку и высадку производить со стороны тротуара или обочины и только после полной остановки транспортного средства.","isFootnote":false,"num":"2)"},{"text":"Если посадка и высадка невозможна со стороны тротуара или обочины, она осуществляется со стороны проезжей части дороги при условии, что это будет безопасно и не создаст помех другим участникам движения.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 21 с изменением, внесенным приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"22. Пассажирам запрещается:","isFootnote":false,"num":"22"},{"text":"1) отвлекать водителя от управления транспортным средством во время его движения;","isFootnote":false,"num":"1)"},{"text":"2) при поездке на грузовом автомобиле с бортовой платформой стоять, сидеть на бортах или на грузе выше бортов;","isFootnote":false,"num":"2)"},{"text":"3) открывать двери, а также высовываться в оконные проемы и люки транспортного средства во время его движения.","isFootnote":false,"num":"3)"},{"text":"4) вставать на опоры для ног или сиденье во время движения мотоцикла или мопеда.","isFootnote":false,"num":"4)"},{"text":"Пункт 22 с изменением, внесенным приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":false,"num":null}]},{"id":"ch5","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 5. Сигналы светофора и регулировщика","paragraphs":[{"text":"Изображения сигналов светофоров и регулировщика приведены в приложении 3 к настоящим Правилам.","isFootnote":false,"num":null},{"text":"23. Для регулирования дорожного движения применяются светофоры, имеющие вертикальное или горизонтальное расположение.","isFootnote":false,"num":"23"},{"text":"В светофорах применяются световые сигналы зеленого, желтого, красного и бело-лунного цвета.","isFootnote":false,"num":null},{"text":"В светофорах с вертикальным расположением сигналов красный сигнал размещается вверху, а зеленый - внизу; при горизонтальном расположении сигналов - красный размещается слева, зеленый - справа.","isFootnote":false,"num":null},{"text":"В зависимости от назначения сигналы светофора могут быть круглые, в виде стрелки (стрелок), силуэта пешехода или велосипеда, \"Х\" и \"+\"-образные.","isFootnote":false,"num":null},{"text":"Светофоры с круглыми сигналами могут иметь одну или две дополнительные секции с сигналами в виде зеленой стрелки (стрелок), которые располагаются на уровне зеленого круглого сигнала.","isFootnote":false,"num":null},{"text":"24. Круглые сигналы светофора имеют следующие значения:","isFootnote":false,"num":"24"},{"text":"1) зеленый сигнал разрешает движение;","isFootnote":false,"num":"1)"},{"text":"2) зеленый мигающий сигнал разрешает движение и информирует, что время его действия истекает и вскоре будет включен запрещающий сигнал (для информирования водителей и пешеходов о времени в секундах, оставшемся до выключения зеленого сигнала, применяются цифровые табло);","isFootnote":false,"num":"2)"},{"text":"3) желтый сигнал запрещает движение, кроме случаев, предусмотренных пунктом 37 настоящей главы, и предупреждает о предстоящей смене сигналов;","isFootnote":false,"num":"3)"},{"text":"4) желтый мигающий сигнал информирует о наличии нерегулируемого светофором перекрестка или пешеходного перехода, предупреждает об опасности;","isFootnote":false,"num":"4)"},{"text":"5) красный сигнал, в том числе мигающий, запрещает движение. Сочетание красного и желтого сигналов запрещает движение и информирует о предстоящем включении зеленого сигнала.","isFootnote":false,"num":"5)"},{"text":"25. Сигналы светофора, выполненные в виде стрелок красного, желтого и зеленого цветов, имеют то же значение, что и круглые сигналы соответствующего цвета, но их действие распространяется только на направление (направления), указываемое стрелками. При этом стрелка, разрешающая поворот налево, разрешает и разворот, если это не запрещено соответствующим дорожным знаком.","isFootnote":false,"num":"25"},{"text":"Вместо красных и желтых стрелок в том же значении могут использоваться круглые красные и желтые сигналы с нанесенными на них черными контурными стрелками.","isFootnote":false,"num":null},{"text":"Такое же значение имеет и зеленая стрелка в дополнительной секции. Выключенный сигнал дополнительной секции означает запрещение движения в направлении, регулируемом этой секцией.","isFootnote":false,"num":null},{"text":"26. Если на основной зеленый сигнал светофора нанесена черная контурная стрелка (стрелки), то она информирует водителей о наличии дополнительной секции светофора и указывает иные разрешенные направления движения, чем сигнал дополнительной секции.","isFootnote":false,"num":"26"},{"text":"27. Если сигнал светофора выполнен в виде силуэта пешехода (велосипеда), то его действие распространяется только на пешеходов (велосипедистов). При этом зеленый сигнал разрешает, а красный запрещает движение пешеходов (велосипедистов).","isFootnote":false,"num":"27"},{"text":"Для регулирования движения велосипедистов используется также светофор с круглыми сигналами уменьшенного размера, дополненный прямоугольной табличкой белого цвета размером 300x200 мм с изображением велосипеда черного цвета.","isFootnote":false,"num":null},{"text":"28. Для информирования пешеходов с полной потерей зрения о возможности пересечения проезжей части дороги световые сигналы светофора могут быть дополнены звуковым сигналом.","isFootnote":false,"num":"28"},{"text":"29. Для регулирования движения транспортных средств по полосам проезжей части дороги, в частности по тем, направления движения по которым может изменяться на противоположное, применяются реверсивные светофоры с красным Х-образным сигналом и зеленым сигналом в виде стрелы, направленной вниз. Эти сигналы соответственно запрещают или разрешают движение по полосе, над которой они расположены.","isFootnote":false,"num":"29"},{"text":"Основные сигналы реверсивного светофора могут быть дополнены желтым сигналом в виде стрелы, наклоненной по диагонали вниз направо или налево, включение которой информирует о предстоящей смене сигнала и необходимости перестроиться на полосу, на которую указывает стрела.","isFootnote":false,"num":null},{"text":"При выключенных сигналах реверсивного светофора, который расположен над полосой, обозначенной с обеих сторон разметкой 1.9 согласно приложению 2 к настоящим Правилам, въезд на эту полосу запрещен.","isFootnote":false,"num":null},{"text":"30. Для регулирования движения трамваев, а также общественного транспорта, движущихся по выделенной для них полосе, применяются светофоры одноцветной сигнализации с четырьмя круглыми сигналами бело-лунного цвета, расположенными в виде буквы \"Т\". Движение разрешается только при включении одновременно нижнего сигнала и одного или нескольких верхних, из которых левый разрешает движение налево, средний - прямо, правый - направо.","isFootnote":false,"num":"30"},{"text":"31. Круглый бело-лунный мигающий сигнал, расположенный на железнодорожном переезде, разрешает движение транспортных средств через переезд. При выключенных мигающих бело-лунном и красном сигналах движение разрешается при отсутствии в пределах видимости приближающегося к переезду поезда (локомотива, дрезины).","isFootnote":false,"num":"31"},{"text":"32. Зеленый \"+\" - образный сигнал информирует о том, что для транспортных средств встречного направления включен запрещающий красный сигнал светофора.","isFootnote":false,"num":"32"},{"text":"Выключенный зеленый \"+\" -образный сигнал информирует о том, что для транспортных средств встречного направления включен разрешающий зеленый сигнал светофора.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 32 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"33. Сигналами регулировщика служат положения его корпуса и жесты руками, в том числе с жезлом, которые имеют следующие значения:","isFootnote":false,"num":"33"},{"text":"1) руки вытянуты в стороны или опущены:","isFootnote":false,"num":"1)"},{"text":"со стороны левого и правого бока - разрешено движение трамваю прямо, безрельсовым транспортным средствам прямо и направо, пешеходам разрешено переходить проезжую часть дороги;","isFootnote":false,"num":null},{"text":"со стороны груди и спины - движение всех транспортных средств и пешеходов запрещено.","isFootnote":false,"num":null},{"text":"2) правая рука вытянута вперед:","isFootnote":false,"num":"2)"},{"text":"со стороны левого бока - разрешено движение трамваю налево, безрельсовым транспортным средствам во всех направлениях;","isFootnote":false,"num":null},{"text":"со стороны груди - всем транспортным средствам разрешено движение только направо;","isFootnote":false,"num":null},{"text":"со стороны правого бока и спины - движение всех транспортных средств запрещено;","isFootnote":false,"num":null},{"text":"пешеходам разрешено переходить проезжую часть дороги за спиной регулировщика.","isFootnote":false,"num":null},{"text":"3) рука поднята вверх:","isFootnote":false,"num":"3)"},{"text":"движение всех транспортных средств и пешеходов запрещено во всех направлениях, кроме случаев, предусмотренных пунктом 37 настоящей главы.","isFootnote":false,"num":null},{"text":"Регулировщик может подавать жестами рук и другие сигналы, понятные водителям и пешеходам.","isFootnote":false,"num":null},{"text":"Для лучшей видимости сигналов регулировщик может применять жезл или диск с красным сигналом (световозвращателем).","isFootnote":false,"num":null},{"text":"34. Требование об остановке транспортного средства подается с помощью громкоговорящего устройства, жестом руки или жезлом, направленных на транспортное средство с одновременным сигналом свистка, которые должны быть понятны водителю и поданы своевременно с тем, чтобы их исполнение не создало аварийную обстановку.","isFootnote":false,"num":"34"},{"text":"35. Сигнал свистком подается дополнительно для привлечения внимания участников движения.","isFootnote":false,"num":"35"},{"text":"36. При запрещающем сигнале светофора (кроме реверсивного) или регулировщика водители останавливаются перед стоп-линией (знаком 5.33 согласно приложению 1 к настоящим Правилам), а при ее отсутствии:","isFootnote":false,"num":"36"},{"text":"1) на перекрестке - перед пересекаемой проезжей частью дороги либо руководствуются требованиями пункта 98 главы 13 настоящих Правил, не создавая помех пешеходам;","isFootnote":false,"num":"1)"},{"text":"2) перед железнодорожным переездом - в соответствии с пунктом 116 главы 15 настоящих Правил;","isFootnote":false,"num":"2)"},{"text":"3) в других местах - перед светофором или регулировщиком, не создавая помех транспортным средствам и пешеходам, движение которых разрешено.","isFootnote":false,"num":"3)"},{"text":"37. Водители, которые при поднятии регулировщиком руки или включении желтого сигнала в случаях, если режим работы светофорной сигнализации не обеспечивает мигание зеленого сигнала непосредственно перед его выключением, не могут остановиться, не прибегая к экстренному торможению, в местах, определенных пунктом 36 настоящей главы, продолжают дальнейшее движение.","isFootnote":false,"num":"37"},{"text":"Пешеходы, которые при поднятии регулировщиком руки или включении желтого сигнала находились на проезжей части дороги, освобождают ее, а если это невозможно - останавливаются на линии, разделяющей транспортные потоки противоположных направлений.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 37 - в редакции приказа Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"38. Водители и пешеходы выполняют требования сигналов и распоряжения регулировщика, даже если они противоречат сигналам светофора, требованиям дорожных знаков или разметки.","isFootnote":false,"num":"38"},{"text":"39. На железнодорожных переездах одновременно с красным мигающим сигналом светофора может подаваться звуковой сигнал, дополнительно информирующий участников движения о запрещении движения через переезд.","isFootnote":false,"num":"39"}]},{"id":"ch6","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 6. Применение специальных сигналов","paragraphs":[{"text":"40. Водители транспортных средств оперативных и специальных служб с включенным проблесковым маячком синего и (или) красного цвета, выполняя неотложное служебное задание, могут отступать от требований главы 5 (кроме сигналов регулировщика), глав 8-18 настоящих Правил, приложений 1-3 (кроме сигналов регулировщика) к настоящим Правилам при условии обеспечения безопасности движения.","isFootnote":false,"num":"40"},{"text":"Для получения преимущества перед другими участниками движения водители таких транспортных средств включают проблесковый маячок синего и (или) красного цвета и специальный звуковой сигнал. Пользуются преимуществом они только убедившись, что им уступают дорогу.","isFootnote":false,"num":null},{"text":"Этим же правом пользуются водители транспортных средств, сопровождаемых транспортными средствами оперативных и специальных служб в случаях, установленных настоящим пунктом Правил.","isFootnote":false,"num":null},{"text":"41. При приближении транспортных средств с включенными проблесковым маячком синего и (или) красного цвета и специальным звуковым сигналом водители уступают дорогу для обеспечения беспрепятственного проезда этих и сопровождаемых ими других транспортных средств.","isFootnote":false,"num":"41"},{"text":"42. Приближаясь к стоящему транспортному средству с включенным проблесковым маячком синего и (или) красного цвета, водитель снижает скорость, чтобы иметь возможность немедленно остановиться в случае необходимости.","isFootnote":false,"num":"42"},{"text":"43. Водители транспортных средств с включенным проблесковым маячком оранжевого или желтого цвета могут отступать от требований дорожных знаков (кроме дорожных знаков 2.2, 2.4, 2.5 2.6, 3.11, 3.12, 3.13, 3.14, 3.17.2, 3.20 согласно приложению 1 к настоящим Правилам) и разметки, а также пунктов 63, 64, 65, 66, 67 и 118 настоящих Правил при условии обеспечения безопасности дорожного движения и убедившись в отсутствии помех. Кроме того, участники дорожного движения не препятствуют осуществлению ими своих функций.","isFootnote":false,"num":"43"},{"text":"Сноска. Пункт 43 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null}]},{"id":"ch7","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 7. Применение аварийной сигнализации и знака аварийной остановки","paragraphs":[{"text":"44. Аварийная световая сигнализация включается:","isFootnote":false,"num":"44"},{"text":"1) при дорожно-транспортном происшествии;","isFootnote":false,"num":"1)"},{"text":"2) при вынужденной остановке в местах, где остановка запрещена;","isFootnote":false,"num":"2)"},{"text":"3) при движении задним ходом;","isFootnote":false,"num":"3)"},{"text":"4) при ослеплении водителя светом фар;","isFootnote":false,"num":"4)"},{"text":"5) при буксировке (на буксируемом механическом транспортном средстве);","isFootnote":false,"num":"5)"},{"text":"6) при остановке и стоянке на неосвещенных участках дорог или в условиях недостаточной видимости при неисправных габаритных огнях;","isFootnote":false,"num":"6)"},{"text":"7) вне населенного пункта при остановке на обочине в случае, когда ее ширина недостаточна для полного съезда с проезжей части дороги или ширину обочины определить в данных дорожных условиях не представляется возможным.","isFootnote":false,"num":"7)"},{"text":"Аварийная световая сигнализация включается и в других случаях для предупреждения участников движения об опасности, которую может создать транспортное средство.","isFootnote":false,"num":null},{"text":"45. После включения аварийной световой сигнализации, а также при ее неисправности или отсутствии незамедлительно выставляет на проезжей части дороги со стороны наибольшей опасности знак аварийной остановки (или мигающий красный фонарь) при:","isFootnote":false,"num":"45"},{"text":"1) дорожно-транспортном происшествии;","isFootnote":false,"num":"1)"},{"text":"2) вынужденной остановке в местах, где она запрещена, или местах с видимостью дороги менее ста метров хотя бы в одном направлении.","isFootnote":false,"num":"2)"},{"text":"Знак аварийной остановки (или мигающий красный фонарь) устанавливается на расстоянии, обеспечивающем в конкретной обстановке своевременное предупреждение других водителей об опасности на расстоянии не менее пятнадцати метров от транспортного средства в населенных пунктах и тридцати метров вне населенных пунктов.","isFootnote":false,"num":null},{"text":"46. При отсутствии или неисправности аварийной световой сигнализации на буксируемом механическом транспортном средстве сзади закрепляется знак аварийной остановки.","isFootnote":false,"num":"46"}]},{"id":"ch8","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 8. Маневрирование","paragraphs":[{"text":"47. Перед началом выполнения маневра водитель подает сигналы световыми указателями соответствующего назначения, а если они отсутствуют или неисправны - рукой. При этом маневр осуществляется с соблюдением безопасности и не создает помех другим участникам движения.","isFootnote":false,"num":"47"},{"text":"48. Сигналом маневра в левую сторону является включенный световой указатель левого поворота либо вытянутая в сторону левая рука либо правая, вытянутая в сторону и согнутая в локте под прямым углом вверх. Сигналом маневра в правую сторону является включенный световой указатель правого поворота либо вытянутая в сторону правая рука либо левая, вытянутая в сторону и согнутая в локте под прямым углом вверх. Сигнал торможения подается стоп-сигналом либо поднятой вверх рукой. Сигнал движения задним ходом подается включением фонарей заднего хода и аварийной сигнализации.","isFootnote":false,"num":"48"},{"text":"Подача сигнала указателями поворота или рукой производится не вводя в заблуждение других участников движения, заблаговременно до начала выполнения маневра и прекращается немедленно после его завершения (подача сигнала рукой может быть закончена непосредственно перед выполнением маневра).","isFootnote":false,"num":null},{"text":"Подача сигнала не дает водителю преимущества и не освобождает его от принятия мер предосторожности.","isFootnote":false,"num":null},{"text":"49. При выезде на дорогу со второстепенной дороги водитель уступает дорогу транспортным средствам и пешеходам, движущимся по ней, а при съезде с дороги - транспортным средствам и пешеходам, путь движения которых он пересекает.","isFootnote":false,"num":"49"},{"text":"Сноска. Пункт 49 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"50. При подъезде к месту остановки или стоянки водитель уступает дорогу движущимся по краю проезжей части дороги или обочине пешеходам, водителям велосипедов, мопедов, гужевых повозок, погонщикам верховых и вьючных животных.","isFootnote":false,"num":"50"},{"text":"51. При перестроении водитель уступает дорогу транспортным средствам, движущимся попутно без изменения направления движения. При одновременном перестроении транспортных средств, движущихся попутно, водитель уступает дорогу транспортному средству, находящемуся справа.","isFootnote":false,"num":"51"},{"text":"Не допускается перестроение, в результате которого между движущимися транспортными средствами создается опасная дистанция.","isFootnote":false,"num":null},{"text":"52. Перед поворотом направо, налево или разворотом водитель заблаговременно занимает соответствующее крайнее положение на проезжей части дороги и на полосе, предназначенной для движения в данном направлении, кроме случаев, когда совершается поворот при въезде на перекресток, где организовано круговое движение.","isFootnote":false,"num":"52"},{"text":"Если на дороге установлены знаки 5.8.1 или 5.8.2 согласно приложению 1 к настоящим Правилам, то указанные маневры разрешаются по соответствующим полосам движения; при этом не допускается занимать не крайние полосы движения при свободных крайних.","isFootnote":false,"num":null},{"text":"При наличии слева трамвайных путей попутного направления, расположенных на одном уровне с проезжей частью дороги, поворот налево и разворот должны выполняться с них, если знаками 5.8.1 или 5.8.2 согласно приложению 1 к настоящим Правилам не предписаны направления движения по полосам проезжей части дороги. При этом водитель уступает дорогу трамваю.","isFootnote":false,"num":null},{"text":"53. Поворот осуществляется таким образом, чтобы при выезде с пересечения проезжих частей дорог транспортное средство не оказалось на стороне встречного движения. Поворот осуществляется по полосе, соответствующей занимаемой при осуществлении маневра.","isFootnote":false,"num":"53"},{"text":"Сноска. Пункт 53 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"54. Если транспортное средство из-за своих габаритов или по другим причинам не может выполнить поворот на перекрестке и вне его или разворот на перекрестке с соблюдением требований пункта 52 настоящей главы, допускается сместиться частично, а при необходимости и полностью, на соседнюю полосу при условии обеспечения безопасности движения и если это не создаст помех другим транспортным средствам.","isFootnote":false,"num":"54"},{"text":"54-1. Вне зависимости от радиуса, разворот осуществляется при условии обеспечения безопасности движения и если это не создаст помех другим транспортным средствам.","isFootnote":false,"num":"54-1"},{"text":"Сноска. Правила дополнены пунктом 54-1 в соответствии с приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"55. При повороте налево или развороте вне перекрестка водитель безрельсового транспортного средства уступает дорогу встречным транспортным средствам.","isFootnote":false,"num":"55"},{"text":"Если при развороте вне перекрестка ширина проезжей части дороги недостаточна для выполнения маневра из крайнего левого положения, его допускается производить только от правого края проезжей части дороги (с правой обочины). При этом водитель уступает дорогу попутным и встречным транспортным средствам.","isFootnote":false,"num":null},{"text":"56. В случаях, когда траектории движения транспортных средств пересекаются, а очередность проезда не определена настоящими Правилами, дорогу уступает водитель, к которому транспортное средство приближается справа.","isFootnote":false,"num":"56"},{"text":"57. При наличии полосы торможения водитель, намеревающийся повернуть, своевременно перестраивается на эту полосу и снижает скорость только на ней.","isFootnote":false,"num":"57"},{"text":"При наличии в месте въезда на дорогу полосы разгона водитель двигается по ней и перестраивается на соседнюю полосу, уступая дорогу транспортным средствам, движущимся по этой дороге.","isFootnote":false,"num":null},{"text":"58. Разворот запрещается:","isFootnote":false,"num":"58"},{"text":"1) на пешеходных переходах и перекрестках по линии тротуаров или обочин;","isFootnote":false,"num":"1)"},{"text":"2) в тоннелях;","isFootnote":false,"num":"2)"},{"text":"3) на мостах, путепроводах, эстакадах и под ними;","isFootnote":false,"num":"3)"},{"text":"4) на железнодорожных переездах;","isFootnote":false,"num":"4)"},{"text":"5) в местах с видимостью дороги менее ста метров;","isFootnote":false,"num":"5)"},{"text":"6) в местах расположения остановочных пунктов.","isFootnote":false,"num":"6)"},{"text":"59. Движение транспортного средства задним ходом разрешается при условии, что маневр будет безопасен и не создаст помех другим участникам движения. Движение задним ходом запрещается на перекрестках и в местах, где запрещен разворот согласно пункту 58 настоящей главы.","isFootnote":false,"num":"59"}]},{"id":"ch9","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 9. Расположение транспортных средств на проезжей части дороги","paragraphs":[{"text":"60. Количество полос движения для безрельсовых транспортных средств определяется разметкой или знаками 5.8.1, 5.8.2, 5.8.7, 5.8.8 согласно приложению 1 к настоящим Правилам, а если их нет, то самими водителями с учетом ширины проезжей части дороги, габаритов транспортных средств и необходимых интервалов между ними. При этом стороной, предназначенной для встречного движения, считается половина ширины проезжей части дороги (либо дорожного полотна при невозможности определения края проезжей части дороги), расположенная слева, если организацией дорожного движения не определен иной порядок движения. При определении условной линии, отделяющей сторону, предназначенную для встречного движения, не принимается во внимание местное уширение проезжей части дороги (дорожного полотна).","isFootnote":false,"num":"60"},{"text":"61. На дорогах с двусторонним движением, имеющих четыре полосы или более, запрещается выезд на сторону дороги, предназначенную для встречного движения. На таких дорогах повороты налево или развороты могут выполняться на перекрестках и в других местах, где это не запрещено настоящими Правилами, знаками и (или) разметкой.","isFootnote":false,"num":"61"},{"text":"62. На дорогах с двусторонним движением, имеющих три полосы, выезжать на крайнюю левую полосу, предназначенную для встречного движения запрещается.","isFootnote":false,"num":"62"},{"text":"62-1. На дорогах с двусторонним движением, имеющих две полосы, разделенные дорожной разметкой 1.1. и (или) обозначенные знаком 3.20., запрещается выезд на сторону дороги, предназначенную для встречного движения, за исключением случаев, предусмотренных Правилами.","isFootnote":false,"num":"62-1"},{"text":"Сноска. Правила дополнены пунктом 62-1 в соответствии с приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"63. Вне населенных пунктов, а также в населенных пунктах на дорогах, обозначенных знаками 5.1 и 5.3 согласно приложению 1 к настоящим Правилам, или где разрешено движение со скоростью более 80 км/ч, водители транспортных средств ведут их ближе к правому краю проезжей части дороги, при этом не занимая левые полосы движения при свободных правых.","isFootnote":false,"num":"63"},{"text":"В населенных пунктах с учетом требований настоящего пункта и пункта 64 настоящей главы, пункта 118 главы 16 и пункта 166 главы 24 настоящих Правил движение осуществляется по любой полосе, однако водители транспортных средств, движущиеся по левым полосам со скоростью меньше разрешенной, освобождают занимаемую ими полосу с перестроением вправо транспортным средствам, приближающимся сзади по той же полосе с более высокой скоростью и подающим предупредительные сигналы в соответствии с пунктом 140 главы 19 настоящих Правил.","isFootnote":false,"num":null},{"text":"На любых дорогах, имеющих для движения в данном направлении три полосы и более, занимать крайнюю левую полосу разрешается только при интенсивном движении, когда заняты другие полосы, а также для обгона, поворота налево или разворота, а грузовым автомобилям с разрешенной максимальной массой более трех тысяч пятьсот килограмм - только для поворота налево или разворота. Выезд на левую сторону дороги с односторонним движением для остановки и стоянки осуществляется в соответствии с пунктом 84 главы 12 настоящих Правил.","isFootnote":false,"num":null},{"text":"Движение транспортных средств по одной полосе со скоростью большей, чем по соседней полосе, не считается обгоном.","isFootnote":false,"num":null},{"text":"64. Транспортные средства, скорость движения которых не превышает 40 км/ч или которые по техническим причинам не развивают такую скорость, двигаются по крайней правой полосе, предназначенной для движения данного транспортного средства в нужном ему направлении, кроме случаев объезда, обгона, перестроения перед поворотом налево, разворотом или остановкой (стоянкой) в разрешенных случаях на левой стороне дороги.","isFootnote":false,"num":"64"},{"text":"65. Разрешается движение по трамвайным путям попутного направления, расположенным слева на одном уровне с проезжей частью дороги, когда заняты все полосы данного направления, а также при объезде, обгоне, повороте налево или развороте с учетом пункта 52 главы 8 настоящих Правил. При этом не должно создаваться помех трамваю. Не допускается выезд на трамвайные пути встречного направления, а также движение через перекресток по трамвайным путям, если на дороге установлены знаки 5.8.1 или 5.8.2 согласно приложению 1 к настоящим Правилам.","isFootnote":false,"num":"65"},{"text":"66. Если проезжая часть дороги разделена на полосы линиями разметки, движение транспортных средств должно осуществляться строго по обозначенным полосам. Наезжать на прерывистые линии разметки разрешается лишь при перестроении.","isFootnote":false,"num":"66"},{"text":"67. При повороте на дорогу с реверсивным движением водитель ведет транспортное средство таким образом, чтобы при выезде с пересечения проезжих частей дорог транспортное средство заняло крайнюю правую полосу. Перестроение разрешается только после того, как водитель убедится, что движение в данном направлении разрешается и по другим полосам.","isFootnote":false,"num":"67"},{"text":"68. Не допускается движение транспортных средств по обочинам, тротуарам и пешеходным дорожкам (за исключением случаев, предусмотренных в пункте 84 главы 12 и пункте 166 главы 24 настоящих Правил), а в населенных пунктах - кроме того, вне проезжей части дороги. Допускаются движение машин дорожно-эксплуатационных и коммунальных служб, а также подъезд по кратчайшему пути транспортных средств, подвозящих грузы к объектам, расположенным непосредственно у обочин, тротуаров или пешеходных дорожек, при отсутствии других возможностей подъезда. При этом должна быть обеспечена безопасность движения.","isFootnote":false,"num":"68"},{"text":"69. Водитель в зависимости от скорости движения соблюдает такую дистанцию до движущегося впереди транспортного средства, которая позволит избежать столкновения, а также необходимый боковой интервал, обеспечивающий безопасность движения.","isFootnote":false,"num":"69"},{"text":"70. Вне населенных пунктов на дорогах с двусторонним движением, имеющих две полосы, водители транспортных средств, для которых установлено ограничение скорости, а также транспортных средств (состава транспортных средств) длиной более семи метров поддерживают между своим и движущимся впереди транспортным средством такую дистанцию, чтобы обгоняющие их транспортные средства могли без помех перестроиться на ранее занимаемую ими полосу. Это требование не действует, если водитель готовится к выполнению обгона, а также при интенсивном движении и при движении в организованной транспортной колонне.","isFootnote":false,"num":"70"},{"text":"71. На дорогах с двусторонним движением, при отсутствии разделительной полосы островки безопасности, тумбы и элементы дорожных сооружений (опоры мостов, путепроводов и тому подобное), находящиеся на середине проезжей части дороги, водитель объезжает справа, если знаки и разметка не предписывают иное.","isFootnote":false,"num":"71"}]},{"id":"ch10","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 10. Скорость движения","paragraphs":[{"text":"72. Водитель ведет транспортное средство со скоростью, не превышающей установленного ограничения, учитывая при этом интенсивность движения, особенности и состояние транспортного средства и груза, дорожные и метеорологические условия, в частности видимость в направлении движения. Скорость обеспечивает водителю возможность постоянного контроля за движением транспортного средства для выполнения требований настоящих Правил.","isFootnote":false,"num":"72"},{"text":"При возникновении препятствия и (или) опасности для движения, которые водитель в состоянии обнаружить, он принимает меры к снижению скорости вплоть до остановки транспортного средства или безопасному для других участников движения объезду препятствия.","isFootnote":false,"num":null},{"text":"73. В населенных пунктах разрешается движение:","isFootnote":false,"num":"73"},{"text":"1) транспортных средств со скоростью не более 60 км/ч, за исключением специальных режимов движения, установленных соответствующими дорожными знаками, но не более 90 км/ч;","isFootnote":false,"num":"1)"},{"text":"2) автобусов, грузовых автомобилей со скоростью не более 50 км/ч;","isFootnote":false,"num":"2)"},{"text":"3) транспортных средств в жилых зонах и дворовых территориях со скоростью не более 20 км/ч.","isFootnote":false,"num":"3)"},{"text":"Сноска. Пункт 73 – в редакции приказа Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"74. Вне населенных пунктов разрешается движение:","isFootnote":false,"num":"74"},{"text":"1) легковым автомобилям и мотоциклам на автомагистралях - со скоростью, не превышающей, установленной соответствующим дорожным знаком 3.24 согласно приложению 1 к настоящим Правилам, но не более 140 км/час, на дорогах, имеющих разделительную полосу, - не более 110 км/час, на остальных дорогах - не более 100 км/час;","isFootnote":false,"num":"1)"},{"text":"2) грузовым автомобилям с разрешенной максимальной массой не более трех тысяч пятьсот килограмм, междугородним автобусам, микроавтобусам на автомагистралях - не более 110 км/ч, на дорогах, имеющих разделительную полосу, - не более 100 км/час, на остальных дорогах - не более 90 км/час;","isFootnote":false,"num":"2)"},{"text":"3) другим автобусам, в том числе осуществляющим организованные перевозки групп детей, легковым автомобилям при буксировке прицепа, грузовым автомобилям с разрешенной максимальной массой более трех тысяч пятьсот килограмм на автомагистралях - не более 90 км/ч, на дорогах, имеющих разделительную полосу, - не более 80 км/час, на остальных дорогах - не более 70 км/час.","isFootnote":false,"num":"3)"},{"text":"75. Скорость движения транспортных средств не должна превышать:","isFootnote":false,"num":"75"},{"text":"1) 60 км/ч - при перевозке пассажиров в кузове грузового автомобиля;","isFootnote":false,"num":"1)"},{"text":"2) 50 км/ч - при буксировке механических транспортных средств;","isFootnote":false,"num":"2)"},{"text":"3) предписанной величины - при согласовании условий перевозки опасных, тяжеловесных и крупногабаритных грузов.","isFootnote":false,"num":"3)"},{"text":"76.","isFootnote":false,"num":null},{"text":"Примечание ИЗПИ!","isFootnote":false,"num":null},{"text":"Абзац первый пункта 76 вводятся в действие с 12.07.2026 в соответствии с приказом Министра внутренних дел РК от 27.04.2026 № 305 (текст исключен).","isFootnote":false,"num":null},{"text":"1) превышать максимальную скорость, определенную в установленном порядке.","isFootnote":false,"num":"1)"},{"text":"Примечание ИЗПИ!","isFootnote":false,"num":null},{"text":"Абзац второй подпункта 1) вводятся в действие с 12.07.2026 в соответствии с приказом Министра внутренних дел РК от 27.04.2026 № 305 (текст исключен).","isFootnote":false,"num":null},{"text":"2) превышать максимальную скорость, определенную технической характеристикой транспортного средства;","isFootnote":false,"num":"2)"},{"text":"3) превышать скорость, указанную на опознавательном знаке \"Ограничение скорости\", установленном на транспортном средстве (здесь и далее опознавательные знаки указаны в соответствии с Основными положениями);","isFootnote":false,"num":"3)"},{"text":"4) создавать помехи другим участникам дорожного движения;","isFootnote":false,"num":"4)"},{"text":"5) резко тормозить, если это не требуется для предотвращения дорожно-транспортного происшествия.","isFootnote":false,"num":"5)"},{"text":"Сноска. Пункт 76 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null}]},{"id":"ch11","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 11. Обгон, встречный разъезд","paragraphs":[{"text":"77. Прежде чем начать обгон, водителю необходимо убедиться в том, что:","isFootnote":false,"num":"77"},{"text":"1) полоса движения, на которую он намерен выехать, свободна на достаточном для обгона расстоянии и этим маневром он не создаст помех встречным и движущимся позади по этой полосе транспортным средствам, в том числе и подающим предупредительные сигналы в соответствии с пунктами 139 и 140 главы 19 настоящих Правил;","isFootnote":false,"num":"1)"},{"text":"2) транспортное средство, следующее позади по той же полосе, не начало обгон;","isFootnote":false,"num":"2)"},{"text":"3) водитель транспортного средства, движущегося впереди по той же полосе, не подал сигнал о маневрировании налево;","isFootnote":false,"num":"3)"},{"text":"4) по завершении обгона с выездом на полосу (сторону) встречного движения он сможет, не создавая помех обгоняемому транспортному средству, вернуться на ранее занимаемую полосу.","isFootnote":false,"num":"4)"},{"text":"78. Обгонять безрельсовое транспортное средство разрешается с левой стороны. Обгон транспортного средства, водитель которого подал сигнал поворота налево и приступил к выполнению маневра, производится с правой стороны.","isFootnote":false,"num":"78"},{"text":"79. По завершении обгона с выездом на полосу (сторону) встречного движения водитель возвращается на ранее занимаемую полосу движения.","isFootnote":false,"num":"79"},{"text":"80. Водителю обгоняемого транспортного средства запрещается препятствовать обгону повышением скорости движения или иными действиями.","isFootnote":false,"num":"80"},{"text":"81. Обгон запрещен:","isFootnote":false,"num":"81"},{"text":"1) на регулируемых перекрестках с выездом на полосу встречного движения;","isFootnote":false,"num":"1)"},{"text":"2) на нерегулируемых перекрестках при движении по главной дороге, меняющей направление (за исключением разрешенного обгона справа), и по дороге, не являющейся главной (за исключением обгона на перекрестках с круговым движением, обгона двухколесных транспортных средств без бокового прицепа и разрешенного обгона справа);","isFootnote":false,"num":"2)"},{"text":"3) на пешеходных переходах при наличии на них пешеходов;","isFootnote":false,"num":"3)"},{"text":"4) на железнодорожных переездах и ближе ста метров перед ними;","isFootnote":false,"num":"4)"},{"text":"5) транспортного средства, производящего обгон или объезд;","isFootnote":false,"num":"5)"},{"text":"6) в конце подъема и на других участках дорог с ограниченной видимостью с выездом на полосу встречного движения и (или) обозначенных знаками 3.20 и 3.22 согласно приложению 1 к настоящим Правилам.","isFootnote":false,"num":"6)"},{"text":"82. Водитель тихоходного или крупногабаритного транспортного средства вне населенных пунктов в случаях, когда обгон этого транспортного средства затруднен, принимает как можно правее, а при необходимости и останавливается, чтобы пропустить скопившиеся за ним транспортные средства.","isFootnote":false,"num":"82"},{"text":"83. Если встречный разъезд затруднен и приоритетность разъезда не определена знаками 2.6 и 2.7 согласно приложению 1 к настоящим Правилам, то водитель, на стороне которого имеется препятствие, уступает дорогу. На уклонах, обозначенных знаками 1.13 и 1.14 согласно приложению 1 к настоящим Правилам, при наличии препятствия уступает дорогу водитель транспортного средства, движущегося на спуск.","isFootnote":false,"num":"83"}]},{"id":"ch12","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 12. Остановка и стоянка","paragraphs":[{"text":"84. Остановка и стоянка транспортных средств допускается на правой стороне дороги на обочине, а при ее отсутствии - на проезжей части дороги у ее края.","isFootnote":false,"num":"84"},{"text":"На левой стороне дороги остановка и стоянка допускаются в населенных пунктах на дорогах с одной полосой движения для каждого направления без трамвайных путей посередине и дорогах с односторонним движением (грузовым автомобилям с разрешенной максимальной массой более 3,5 тонн на левой стороне дорог с односторонним движением допускается лишь остановка для загрузки или разгрузки).","isFootnote":false,"num":null},{"text":"85. Ставить транспортное средство на проезжей части дороги разрешается в один ряд параллельно краю проезжей части дороги, за исключением тех мест, конфигурация (местное уширение проезжей части дороги) которых допускает иное расположение транспортных средств. Двухколесные транспортные средства без бокового прицепа допускается ставить в два ряда.","isFootnote":false,"num":"85"},{"text":"Стоянка на краю тротуара, граничащего с проезжей частью дороги, с полным или частичным заездом на него, разрешается только легковым автомобилям, мотоциклам, мопедам и велосипедам при условии, что это не будет препятствовать движению пешеходов.","isFootnote":false,"num":null},{"text":"86. Стоянка в целях длительного отдыха, ночлега и тому подобное вне населенного пункта разрешается только на предусмотренных для этого площадках или за пределами дороги.","isFootnote":false,"num":"86"},{"text":"87. Остановка запрещается:","isFootnote":false,"num":"87"},{"text":"1) в непосредственной близости от трамвайных путей, если это создает помехи движению трамваев;","isFootnote":false,"num":"1)"},{"text":"2) на железнодорожных переездах, в тоннелях;","isFootnote":false,"num":"2)"},{"text":"3) на эстакадах, мостах, путепроводах (если для движения в данном направлении имеется менее трех полос) и под ними (независимо от количества полос);","isFootnote":false,"num":"3)"},{"text":"4) в местах, где расстояние между остановившимся транспортным средством и сплошной линией разметки (кроме обозначающей край проезжей части дороги) или противоположным краем проезжей части дороги, или стоящим у противоположного края проезжей части дороги транспортным средством меньше трех метров, если это создает помехи движению транспортных средств;","isFootnote":false,"num":"4)"},{"text":"5) на пешеходных переходах и ближе пяти метров перед ними;","isFootnote":false,"num":"5)"},{"text":"6) на проезжей части дороги вблизи опасных поворотов и выпуклых переломов продольного профиля дороги при видимости дороги менее ста метров хотя бы в одном направлении;","isFootnote":false,"num":"6)"},{"text":"7) на пересечении проезжих частей дорог и ближе тридцати метров от края пересекаемой проезжей части дороги, за исключением стороны напротив бокового проезда трехсторонних пересечений (перекрестков), имеющих сплошную линию разметки или разделительную полосу; на остановочных площадках и ближе пятнадцати метров к ним, а при их отсутствии - ближе пятнадцати метров от указателя остановки маршрутных транспортных средств или такси, за исключением транспортных средств категории М2 и М3;","isFootnote":false,"num":"7)"},{"text":"8) в местах, где транспортное средство закроет от других водителей сигналы светофора, дорожные знаки или сделает невозможным движение (въезд или выезд) других транспортных средств, или создаст помехи для движения других транспортных средств (заторы) и пешеходов;","isFootnote":false,"num":"8)"},{"text":"9) на клумбах, газонах, детской и спортивной площадке.","isFootnote":false,"num":"9)"},{"text":"10) на велосипедной дорожке и (или) велосипедной полосе движения.","isFootnote":false,"num":"10)"},{"text":"Сноска. Пункт 87 с изменениями, внесенными приказами Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"88. Стоянка запрещается:","isFootnote":false,"num":"88"},{"text":"1) в местах, где запрещена остановка;","isFootnote":false,"num":"1)"},{"text":"2) на эстакадах, мостах, путепроводах;","isFootnote":false,"num":"2)"},{"text":"3) вне населенных пунктов на проезжей части дорог, обозначенных знаком 2.1;","isFootnote":false,"num":"3)"},{"text":"4) ближе пятидесяти метров от железнодорожных переездов;","isFootnote":false,"num":"4)"},{"text":"5) механических транспортных средств с работающим двигателем в населенных пунктах, если это создает неудобства жителям;","isFootnote":false,"num":"5)"},{"text":"6) на клумбах, газонах, детских и спортивных площадках.","isFootnote":false,"num":"6)"},{"text":"89. При вынужденной остановке в местах, где остановка запрещена, водитель принимает все необходимые меры для отвода транспортного средства из этих мест.","isFootnote":false,"num":"89"},{"text":"90. Запрещается открывать двери транспортного средства, оставлять их открытыми или выходить на проезжую часть дороги, не убедившись, что это не создаст помехи или опасности для других участников движения.","isFootnote":false,"num":"90"}]},{"id":"ch13","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 13. Проезд перекрестков","paragraphs":[{"text":"91. При повороте направо или налево водитель уступает дорогу пешеходам, переходящим проезжую часть дороги по его направлению движения, на которую он поворачивает, велосипедистам, пересекающим ее по велосипедной дорожке, маршрутным транспортным средствам и другому общественному транспорту, движущимся по полосе, обозначенной знаком 5.9 согласно приложению 1 к настоящим Правилам (с учетом пункта 126 главы 18 настоящих Правил).","isFootnote":false,"num":"91"},{"text":"92. Запрещается выезд на перекресток или пересечение проезжих частей дорог, если образовался затор, который вынудит водителя остановиться, создав препятствие для движения транспортных средств в поперечном направлении.","isFootnote":false,"num":"92"},{"text":"93. Запрещается опережение движущихся в попутном направлении транспортных средств, ограничивающих водителю обзор.","isFootnote":false,"num":"93"},{"text":"Если на перекрестке или перед ним остановилось транспортное средство, то водители других транспортных средств, движущихся по соседним полосам, продолжают движение убедившись, что это будет безопасно.","isFootnote":false,"num":null},{"text":"94. Перекресток, где очередность движения определяется сигналами светофора или регулировщика, считается регулируемым.","isFootnote":false,"num":"94"},{"text":"При желтом мигающем сигнале, неработающих светофорах или отсутствии регулировщика перекресток считается нерегулируемым и водители руководствуются правилами проезда нерегулируемых перекрестков и установленными на перекрестке знаками приоритета.","isFootnote":false,"num":null},{"text":"95. При повороте налево или развороте по разрешающему сигналу светофора водитель безрельсового транспортного средства уступает дорогу транспортным средствам, движущимся со встречного направления прямо или направо, в том числе и въезжающим на перекресток в соответствии с пунктами 37 и 38 настоящих Правил. Таким же правилом руководствуются между собой водители трамваев.","isFootnote":false,"num":"95"},{"text":"Сноска. Пункт 95 – в редакции приказа Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"95-1. При повороте налево на перекрестках разъезд транспортных средств встречного направления осуществляется правыми сторонами (бортами) транспортных средств, за исключением случаев проезда перекрестков с особыми геометрическими параметрами, не позволяющими осуществить такой маневр.","isFootnote":false,"num":"95-1"},{"text":"Сноска. Правила дополнены пунктом 95-1 в соответствии с приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); в редакции приказа Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"96. При движении в направлении стрелки, включенной в дополнительной секции одновременно с желтым или красным сигналом светофора, водитель уступает дорогу транспортным средствам, движущимся с других направлений.","isFootnote":false,"num":"96"},{"text":"97. Если сигналы светофора или регулировщика разрешают движение одновременно трамваю и безрельсовым транспортным средствам, то трамвай имеет преимущество независимо от направления его движения. Однако при движении в направлении стрелки, включенной в дополнительной секции одновременно с красным или желтым сигналом светофора трамвай уступает дорогу транспортным средствам, движущимся с других направлений.","isFootnote":false,"num":"97"},{"text":"98. Водитель, проехавший стоп-линию (знак 5.33) при разрешающем сигнале светофора, выезжает в намеченном направлении независимо от сигналов светофора на выезде с перекрестка. В случае, если на перекрестке перед светофорами, расположенными на пути следования водителя, имеются стоп-линии и (или) знак 5.33 согласно приложению 1 к настоящим Правилам, водитель руководствуется сигналами каждого светофора.","isFootnote":false,"num":"98"},{"text":"Сноска. Пункт 98 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"99. При включении разрешающего сигнала светофора водитель уступает дорогу транспортным средствам, завершающим движение через перекресток, и пешеходам, не закончившим переход проезжей части дороги данного направления.","isFootnote":false,"num":"99"},{"text":"100. На перекрестке, где движение регулируется светофором с дополнительной секцией, водитель, находящийся на полосе, с которой производится поворот, продолжает движение в направлении, указанном включенной стрелкой, если его остановка создаст помеху транспортному средству (транспортным средствам), следующему (следующим) за ним по той же полосе.","isFootnote":false,"num":"100"},{"text":"101. На перекрестке неравнозначных дорог водитель транспортного средства, движущегося по второстепенной дороге, уступает дорогу транспортным средствам, приближающимся по главной, независимо от направления их дальнейшего движения, в том числе осуществляющим разворот. Водитель, движущийся по главной дороге, имеющей разделительную полосу, перед завершением на перекрестке разворота убеждается, что транспортные средства, приближающиеся к перекрестку по второстепенной дороге, уступают ему дорогу.","isFootnote":false,"num":"101"},{"text":"102. В случае, когда главная дорога на перекрестке меняет направление, водители, движущиеся по главной дороге, руководствуются между собой правилами проезда перекрестков равнозначных дорог. Этими же правилами руководствуются водители, движущиеся по второстепенным дорогам.","isFootnote":false,"num":"102"},{"text":"103. На перекрестке равнозначных дорог водитель безрельсового транспортного средства уступает дорогу транспортным средствам, приближающимся справа. Этим же правилом руководствуются между собой водители трамваев.","isFootnote":false,"num":"103"},{"text":"На таких перекрестках трамвай имеет преимущество перед безрельсовыми транспортными средствами независимо от направления его движения.","isFootnote":false,"num":null},{"text":"104. При повороте налево или развороте водитель безрельсового транспортного средства уступает дорогу транспортным средствам, движущимся по равнозначной дороге со встречного направления прямо или направо. Этим же правилом руководствуются между собой водители трамваев.","isFootnote":false,"num":"104"},{"text":"105. В случае невозможности определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное) и отсутствии знаков приоритета, водитель руководствуется принципом, что находится на второстепенной дороге.","isFootnote":false,"num":"105"}]},{"id":"ch14","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 14. Пешеходные переходы и остановки маршрутных транспортных средств","paragraphs":[{"text":"106. Водитель транспортного средства уступает дорогу пешеходам, переходящим проезжую часть дороги его направления движения по нерегулируемому пешеходному переходу.","isFootnote":false,"num":"106"},{"text":"107. Если перед нерегулируемым пешеходным переходом остановилось или замедлило движение транспортное средство, то водители других транспортных средств, движущихся по соседним полосам, могут продолжать движение лишь убедившись, что перед остановившимся или замедлившим движение транспортным средством нет пешеходов.","isFootnote":false,"num":"107"},{"text":"108. На регулируемых пешеходных переходах при включении разрешающего сигнала светофора водитель уступает дорогу пешеходам, заканчивающим переход проезжей части дороги его направления движения.","isFootnote":false,"num":"108"},{"text":"109. Запрещается въезжать на пешеходный переход, если за ним образовался затор, который вынудит водителя остановиться на пешеходном переходе.","isFootnote":false,"num":"109"},{"text":"110. Во всех случаях, в том числе и вне пешеходных переходов, водитель пропускает пешеходов с полной потерей зрения, подающих сигнал белой тростью.","isFootnote":false,"num":"110"},{"text":"111. Водитель уступает дорогу пешеходам, идущим к стоящему на остановке маршрутному транспортному средству или от него (со стороны дверей), если посадка и высадка производятся с проезжей части дороги или с посадочной площадки, расположенной на ней.","isFootnote":false,"num":"111"},{"text":"112. Приближаясь к остановившемуся транспортному средству, имеющему опознавательный знак \"Перевозка детей\", водитель снижает скорость, при необходимости останавливается и пропускает группу детей.","isFootnote":false,"num":"112"}]},{"id":"ch15","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 15. Движение через железнодорожные пути","paragraphs":[{"text":"113. Водители транспортных средств пересекают железнодорожные пути по железнодорожным переездам, уступая дорогу поезду (локомотиву, дрезине).","isFootnote":false,"num":"113"},{"text":"114. При подъезде к железнодорожному переезду водитель руководствуется требованиями дорожных знаков, светофоров, разметки, положением шлагбаума и указаниями дежурного по переезду, и, кроме того, убеждается в отсутствии приближающегося поезда (локомотива, дрезины).","isFootnote":false,"num":"114"},{"text":"115. Запрещается выезжать на железнодорожный переезд:","isFootnote":false,"num":"115"},{"text":"1) при закрытом или начинающем закрываться шлагбауме (независимо от сигнала светофора);","isFootnote":false,"num":"1)"},{"text":"2) при запрещающем сигнале светофора (независимо от положения и наличия шлагбаума);","isFootnote":false,"num":"2)"},{"text":"3) при запрещающем сигнале дежурного по переезду (дежурный обращен к водителю грудью или спиной, в поднятой вверх руке - жезл, красный фонарь или флажок, либо с вытянутыми в стороны руками);","isFootnote":false,"num":"3)"},{"text":"4) если за переездом образовался затор, который вынудит водителя остановиться на переезде;","isFootnote":false,"num":"4)"},{"text":"5) если к переезду в пределах видимости приближается поезд (локомотив, дрезина).","isFootnote":false,"num":"5)"},{"text":"Кроме того, запрещается:","isFootnote":false,"num":null},{"text":"1) переезжать железнодорожные пути вне железнодорожных переездов;","isFootnote":false,"num":"1)"},{"text":"2) объезжать с выездом на полосу встречного движения стоящие перед переездом транспортные средства;","isFootnote":false,"num":"2)"},{"text":"3) самовольно открывать шлагбаум на железнодорожном переезде;","isFootnote":false,"num":"3)"},{"text":"4) перемещать через железнодорожный переезд в нетранспортном положении сельскохозяйственные, дорожные, строительные и другие машины и механизмы без разрешения начальника дистанции пути железной дороги, движение тихоходных машин, скорость которых менее 8 км/ч, а также тракторных саней-волокуш.","isFootnote":false,"num":"4)"},{"text":"116. В случаях, когда движение через переезд запрещено, водитель останавливается у стоп-линии, знака 2.5 согласно приложению 1 к настоящим Правилам или светофора, а если их нет - у границы железнодорожного переезда.","isFootnote":false,"num":"116"},{"text":"117. При вынужденной остановке на переезде водитель немедленно высаживает пассажиров и принимает меры для освобождения переезда. Одновременно водитель осуществляет следующие действия:","isFootnote":false,"num":"117"},{"text":"1) при имеющейся возможности послать двух человек вдоль путей в обе стороны от переезда на одну тысячу метров (если одного, то в сторону худшей видимости пути), объяснив им правила подачи сигнала остановки машинисту приближающегося поезда (локомотива, дрезины);","isFootnote":false,"num":"1)"},{"text":"2) оставаться возле транспортного средства и подавать сигналы общей тревоги;","isFootnote":false,"num":"2)"},{"text":"3) при появлении поезда бежать ему навстречу, подавая сигнал остановки.","isFootnote":false,"num":"3)"},{"text":"Сигналом остановки служит круговое движение руки (днем с лоскутом яркой материи или каким-либо хорошо видимым предметом, ночью - с факелом или фонарем). Сигналом общей тревоги служат серии из одного длинного и трех коротких звуковых сигналов.","isFootnote":false,"num":null}]},{"id":"ch16","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 16. Движение по автомагистралям","paragraphs":[{"text":"118. На автомагистралях запрещается:","isFootnote":false,"num":"118"},{"text":"1) нахождение пешеходов, а также домашних животных вне транспортного средства, управлять велосипедами, мопедами, тракторами и самоходными машинами, а также иными транспортными средствами, скорость которых по технической характеристике или их состоянию меньше 40 км/ч;","isFootnote":false,"num":"1)"},{"text":"2) управлять грузовыми автомобилями с разрешенной максимальной массой более трех тысяч пятьсот килограмм далее второй полосы;","isFootnote":false,"num":"2)"},{"text":"3) останавливаться вне специальных площадок для стоянки, обозначенных знаками 5.15 или 6.11 согласно приложению 1 к настоящим Правилам;","isFootnote":false,"num":"3)"},{"text":"4) разворот и въезд в технологические разрывы разделительной полосы;","isFootnote":false,"num":"4)"},{"text":"5) движение задним ходом;","isFootnote":false,"num":"5)"},{"text":"6) учебная езда.","isFootnote":false,"num":"6)"},{"text":"119. При вынужденной остановке на проезжей части дороги водитель обозначает транспортное средство в соответствии с требованиями главы 7 настоящих Правил и принимает меры для того, чтобы вывести его на предназначенную для этого полосу (правее линии, обозначающей край проезжей части дороги).","isFootnote":false,"num":"119"},{"text":"120. Требования настоящей главы распространяются также на дороги, обозначенные знаком 5.3 согласно приложению 1 к настоящим Правилам.","isFootnote":false,"num":"120"}]},{"id":"ch17","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 17. Движение в жилых зонах","paragraphs":[{"text":"121. В жилой зоне пешеходы двигаются как по тротуарам, так и по проезжей части дороги. В жилой зоне пешеходы имеют преимущество, однако их движение не должно создавать необоснованные помехи для движения транспортных средств.","isFootnote":false,"num":"121"},{"text":"122. В жилой зоне запрещается:","isFootnote":false,"num":"122"},{"text":"1) сквозное движение транспортных средств;","isFootnote":false,"num":"1)"},{"text":"2) движение транспортных средств вне проезжей части дороги;","isFootnote":false,"num":"2)"},{"text":"3) учебная езда;","isFootnote":false,"num":"3)"},{"text":"4) стоянка с работающим двигателем, за исключением стоянки электромобиля с работающим двигателем c учетом положений подпункта 5) пункта 88 настоящих Правил;","isFootnote":false,"num":"4)"},{"text":"5) стоянка грузовых автомобилей с разрешенной максимальной массой более трех тысяч пятьсот килограммов, автобусов вне специально выделенных и обозначенных знаками и (или) разметкой мест;","isFootnote":false,"num":"5)"},{"text":"6) подавать звуковой сигнал, включать громкую музыку;","isFootnote":false,"num":"6)"},{"text":"7) стоянка на тротуарах, газонах, детских и спортивных площадках.","isFootnote":false,"num":"7)"},{"text":"Сноска. Пункт 122 с изменением, внесенным приказом Министра внутренних дел РК от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"123. При выезде из жилой зоны водители уступают дорогу другим участникам движения.","isFootnote":false,"num":"123"},{"text":"124. Требования данной главы распространяются также и на дворовые территории.","isFootnote":false,"num":"124"}]},{"id":"ch18","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 18. Приоритет маршрутных транспортных средств","paragraphs":[{"text":"125. Вне перекрестков, где трамвайные пути пересекают проезжую часть дороги, трамвай имеет преимущество перед безрельсовыми транспортными средствами, кроме случаев выезда из депо.","isFootnote":false,"num":"125"},{"text":"126. На дорогах с полосой для маршрутных транспортных средств, обозначенных знаками 5.9, 5.9.2, 5.9.3, 5.9.4, 5.10.1, 5.10.2, 5.10.3 согласно приложению 1 к настоящим Правилам, не осуществляется движение и не производится остановка других транспортных средств на этой полосе, кроме общественного транспорта (за исключением случаев, предусмотренных в пунктах 166 и 168-1 настоящих Правил) и иных транспортных средств категории М3.","isFootnote":false,"num":"126"},{"text":"Сноска. Пункт 126 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"127. В населенных пунктах водители уступают дорогу движущимся по установленному маршруту водителям троллейбусов и автобусов, начинающим движение от обозначенной остановки. Водители троллейбусов и автобусов начинают движение от обозначенной остановки только убедившись, что им уступают дорогу.","isFootnote":false,"num":"127"}]},{"id":"ch19","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 19. Пользование внешними световыми приборами и звуковыми сигналами","paragraphs":[{"text":"128. В темное время суток и условиях недостаточной видимости, независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве включаются следующие световые приборы:","isFootnote":false,"num":"128"},{"text":"1) на всех механических транспортных средствах и мопедах - габаритные огни и фары дальнего или ближнего света, на велосипедах - фары или фонари, на гужевых повозках - фонари (при их наличии);","isFootnote":false,"num":"1)"},{"text":"2) на прицепах и буксируемых механических транспортных средствах - габаритные огни.","isFootnote":false,"num":"2)"},{"text":"129. Дальний свет переключается на ближний:","isFootnote":false,"num":"129"},{"text":"1) в населенных пунктах, если дорога освещена;","isFootnote":false,"num":"1)"},{"text":"2) при встречном разъезде на расстоянии не менее чем за сто пятьдесят метров до транспортного средства, а также и при большем, если водитель встречного транспортного средства периодическим переключением света фар покажет необходимость этого;","isFootnote":false,"num":"2)"},{"text":"3) в любых других случаях для исключения возможности ослепления водителей как встречных, так и попутных транспортных средств.","isFootnote":false,"num":"3)"},{"text":"При ослеплении водитель включает аварийную световую сигнализацию и, не меняя полосу движения, останавливается.","isFootnote":false,"num":null},{"text":"130. При остановке и стоянке в темное время суток на неосвещенных участках дорог, а также в условиях недостаточной видимости на транспортном средстве включаются габаритные огни. В условиях недостаточной видимости дополнительно к габаритным огням могут быть включены фары ближнего света, противотуманные фары и задние противотуманные фонари.","isFootnote":false,"num":"130"},{"text":"В случае неисправности габаритных огней транспортное средство отводится за пределы дороги, а если это невозможно, транспортное средство обозначается в соответствии с требованиями пунктов 44 и 45 главы 7 настоящих Правил.","isFootnote":false,"num":null},{"text":"131. Контуры боковых и задних сторон транспортных средств категорий М2, МЗ, N2
