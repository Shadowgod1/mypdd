t":"6.7 \"Пункт питания\".","isFootnote":false,"num":"6.7"},{"text":"6.8 \"Питьевая вода\".","isFootnote":false,"num":"6.8"},{"text":"6.9 \"Гостиница или мотель\".","isFootnote":false,"num":"6.9"},{"text":"6.10 \"Кемпинг\".","isFootnote":false,"num":"6.10"},{"text":"6.11 \"Место отдыха\".","isFootnote":false,"num":"6.11"},{"text":"6.12 \"Пост дорожной полиции\".","isFootnote":false,"num":"6.12"},{"text":"6.13 \"Пост транспортного контроля\".","isFootnote":false,"num":"6.13"},{"text":"6.14 \"Полиция\".","isFootnote":false,"num":"6.14"},{"text":"6.15 \"Зона приема радиостанции, передающей информацию о дорожном движении\".","isFootnote":false,"num":"6.15"},{"text":"6.16 \"Зона радиосвязи с аварийными службами\".","isFootnote":false,"num":"6.16"},{"text":"6.17 \"Бассейн или пляж\".","isFootnote":false,"num":"6.17"},{"text":"6.18 \"Туалет\".","isFootnote":false,"num":"6.18"},{"text":"6.19 \"Автозаправочная станция с возможностью зарядки электромобилей\".","isFootnote":false,"num":"6.19"},{"text":"6.20 \"Экологический контроль\".","isFootnote":false,"num":"6.20"}]},{"id":"ch34","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 7. Знаки дополнительной информации (таблички)","paragraphs":[{"text":"Сноска. Глава 7 с изменениями, внесенными приказами Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Знаки дополнительной информации (таблички) уточняют или ограничивают действие знаков, с которыми они применены.","isFootnote":false,"num":null},{"text":"7.1.1 \"Расстояние до объекта\". Указывает расстояние от знака до начала опасного участка, места введения соответствующего ограничения или определенного объекта (места), находящегося впереди по ходу движения.","isFootnote":false,"num":"7.1.1"},{"text":"7.1.2 \"Расстояние до объекта\". Указывает расстояние от знака 2.4 до перекрестка в случае, если непосредственно перед перекрестком установлен знак 2.5.","isFootnote":false,"num":"7.1.2"},{"text":"7.1.3, 7.1.4 \"Расстояние до объекта\". Указывает расстояние до объекта, находящегося в стороне от дороги.","isFootnote":false,"num":null},{"text":"7.2.1 \"Зона действия\". Указывает протяженность опасного участка дороги, обозначенного знаками, или зону действия запрещающих и информационно-указательных знаков.","isFootnote":false,"num":"7.2.1"},{"text":"7.2.2 - 7.2.6 \"Зона действия\". 7.2.2 указывает зону действия запрещающих знаков 3.27 - 3.30; 7.2.3 указывает конец зоны действия знаков 3.27-3.30; 7.2.4 информирует водителей о нахождении их в зоне действия знаков 3.27 - 3.30; 7.2.5, 7.2.6 указывают направление и зону действия знаков 3.27 - 3.30 при запрещении остановки или стоянки вдоль одной стороны площади, фасада здания и тому подобного.","isFootnote":false,"num":"7.2.2"},{"text":"7.3.1 - 7.3.3 \"Направления действия\". Указывают направления действия знаков, установленных перед перекрестком, или направления движения к обозначенным объектам, находящимся непосредственно у дороги.","isFootnote":false,"num":"7.3.1"},{"text":"7.4.1 - 7.4.8 \"Вид транспортного средства\". Указывают вид транспортного средства, на который распространяется действие знака.","isFootnote":false,"num":"7.4.1"},{"text":"7.4.8а \"Вид маршрутного транспортного средства\".","isFootnote":false,"num":"7.4.8а"},{"text":"7.4.8 б \"Туристический автобус\". Применяют со знаком 5.15 \"Место стоянки\" для указания площадки для стоянки туристического автобуса и посадки в него (высадки из него) туристов.","isFootnote":false,"num":"7.4.8 б"},{"text":"7.4.9-7.4.14 \"Кроме вида транспортного средства\". Указывают вид транспортного средства, на который не распространяется действие знака.","isFootnote":false,"num":null},{"text":"Табличка 7.4.1 распространяет действие знака на грузовые автомобили, а табличка 7.4.2 в том числе и с прицепом, с разрешенной максимальной массой более 3,5 тонн, табличка 7.4.3 - на легковые автомобили, а также грузовые автомобили с разрешенной максимальной массой до 3,5 тонн, табличка 7.4.8 - на транспортные средства, оборудованные опознавательными знаками \"Опасный груз\".","isFootnote":false,"num":null},{"text":"7.5.1 \"Субботние, воскресные и праздничные дни\", 7.5.2 \"Рабочие дни\", 7.5.3 \"Дни недели\". Указывают дни недели, в течение которых действует знак.","isFootnote":false,"num":"7.5.1"},{"text":"7.5.4 \"Время действия\". Указывает время суток, в течение которого действует знак.","isFootnote":false,"num":"7.5.4"},{"text":"7.5.5 - 7.5.7 \"Время действия\". Указывают дни недели и время суток, в течение которых действует знак.","isFootnote":false,"num":"7.5.5"},{"text":"7.6.1 - 7.6.18 \"Способ постановки транспортного средства на стоянку\". 7.6.1 указывает, что все транспортные средства должны быть поставлены на проезжей части вдоль тротуара; 7.6.2 - 7.6.10 указывают способ постановки легковых автомобилей и мотоциклов на околотротуарной стоянке. Применяются со знаком 5.15.","isFootnote":false,"num":"7.6.1"},{"text":"7.6.2-7.6.18 указывают способ постановки легковых автомобилей и мотоциклов.","isFootnote":false,"num":null},{"text":"7.7 \"Стоянка с неработающим двигателем\". Указывает, что на стоянке, обозначенной знаком 5.15, разрешается стоянка транспортных средств только с неработающим двигателем.","isFootnote":false,"num":"7.7"},{"text":"7.8 \"Платные услуги\". Указывает, что услуги предоставляются только за оплату.","isFootnote":false,"num":"7.8"},{"text":"7.9 \"Ограничение продолжительности стоянки\". Указывает максимальную продолжительность пребывания транспортного средства на стоянке, обозначенной знаком 5.15.","isFootnote":false,"num":"7.9"},{"text":"7.10 \"Место для осмотра автомобилей\". Указывает, что на площадке, обозначенной знаком 5.15 или 6.11, имеется эстакада или смотровая канава.","isFootnote":false,"num":"7.10"},{"text":"Табличка 7.11 \"Ограничение разрешенной максимальной (полной) массы\". Указывает, что действие знака распространяется только на транспортные средства с разрешенной максимальной (полной) массой, более указанной на табличке.","isFootnote":false,"num":null},{"text":"7.13 \"Направление главной дороги\". Указывает направление главной дороги на перекрестке.","isFootnote":false,"num":"7.13"},{"text":"7.14 \"Полоса движения\". Указывает полосу движения, на которую распространяется действие знака или светофора.","isFootnote":false,"num":"7.14"},{"text":"7.15 \"Пешеходы с полной потерей зрения\". Указывает, что пешеходным переходом пользуются лица с полной потерей зрения. Применяется со знаками 1.20, 5.16.1, 5.16.2 и светофорами.","isFootnote":false,"num":"7.15"},{"text":"7.16 \"Влажное покрытие\". Указывает, что действие знака распространяется на период времени, когда покрытие проезжей части влажное.","isFootnote":false,"num":"7.16"},{"text":"7.17 \"Лица с инвалидностью\". Указывает, что действие знака 5.15 распространяется только на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\".","isFootnote":false,"num":"7.17"},{"text":"7.18 \"Кроме лиц с инвалидностью\". Указывает, что действие знаков не распространяется на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\".","isFootnote":false,"num":"7.18"},{"text":"7.19 \"Класс опасного груза\". Указывает номер класса (классов) опасных грузов. Применяется со знаками 3.32, 4.9.1 -4.9.3.","isFootnote":false,"num":"7.19"},{"text":"7.21 \"Работает эвакуатор\".","isFootnote":false,"num":"7.21"},{"text":"7.21.1 \"Вид маршрутного транспортного средства.","isFootnote":false,"num":"7.21.1"},{"text":"7.22 \"Вид транспортного средства\". Распространяется на электромобили и гибридные автомобили, имеющие возможность зарядки от внешнего источника.","isFootnote":false,"num":"7.22"},{"text":"7.23 \"Кроме вида транспортного средства\". Не распространяется на электромобили и гибридные автомобили, имеющие возможность зарядки от внешнего источника.","isFootnote":false,"num":"7.23"},{"text":"7.24 \"Экологический класс транспортного средства\".","isFootnote":false,"num":"7.24"},{"text":"7.25 \"Зарядка электромобилей\".","isFootnote":false,"num":"7.25"},{"text":"7.26 \"Вид транспортного средства\". Распространяется на электрические самокаты.","isFootnote":false,"num":"7.26"},{"text":"7.27 \"Кроме вида транспортного средства\". Не распространяется на электрические самокаты.","isFootnote":false,"num":"7.27"},{"text":"Таблички размещаются непосредственно под знаком, с которым они применены. Таблички 7.2.2 - 7.2.4, 7.13 при расположении знаков над проезжей частью, обочиной или тротуаром размещаются сбоку от знака.","isFootnote":false,"num":null},{"text":"В случаях, когда значения временных дорожных знаков (на переносной стойке) и стационарных знаков противоречат друг другу, водители должны руководствоваться временными знаками.","isFootnote":false,"num":null},{"text":"Табличка 7.21 применяется совместно с запрещающими знаками 3.27-3.30, информирует о задержании транспортного средства и помещении его на специализированную стоянку.","isFootnote":false,"num":null},{"text":"Табличка 7.24 применяют со знаками 3.2-3.6, 4.1.1-4.1.6, 3.18.1, 3.18.2 для распространения действия знака на транспортные средства с экологическим классом ниже указанного на табличке или экологический класс которых не указан в регистрационных документах на эти транспортные средства. Применяют со знаками 5.15 для распространения действия знака на транспортные средства с экологическим классом, соответствующим или выше указанного на табличке, или, экологический класс которых не указан в регистрационных документах на эти транспортные средства.","isFootnote":false,"num":null},{"text":"Рис. 2. ДОРОЖНЫЕ ЗНАКИ","isFootnote":false,"num":null},{"text":"Сноска. Рисунок 2 - в редакции приказа Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); с изменениями, внесенными приказом Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"\"1. Предупреждающие знаки","isFootnote":false,"num":null}]},{"id":"ch35","partId":"markings","partTitle":"Приложение 2. Дорожная разметка","partTitleKk":"2-қосымша. Жол таңбалары","title":"Приложение 2. Дорожная разметка","paragraphs":[{"text":"дорожного движения","isFootnote":false,"num":null},{"text":"Разметка дорожная и ее характеристики","isFootnote":false,"num":null}]},{"id":"ch36","partId":"markings","partTitle":"Приложение 2. Дорожная разметка","partTitleKk":"2-қосымша. Жол таңбалары","title":"Глава 1. Горизонтальная разметка","paragraphs":[{"text":"Сноска. Глава 1 с изменениями, внесенными приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Правила применения и требования к дорожной разметке регламентируются Национальным стандартом Республики Казахстан 1124 \"Технические средства организации дорожного движения. Разметка дорожная. Классификация. Технические условия\" (далее – СТ РК 1124), утвержденным приказом Председателя Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан от 27 сентября 2019 года № 362-од и Национальным стандартом Республики Казахстан 1412 \"Технические средства регулирования дорожного движения. Правила применения\" (далее – СТ РК 1412), утвержденным приказом председателя Комитета технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан от 10 октября 2017 года № 274-од.","isFootnote":false,"num":null},{"text":"Горизонтальная разметка (линии, стрелы, надписи и другие обозначения на проезжей части) устанавливает определенные режимы и порядок движения.","isFootnote":false,"num":null},{"text":"Горизонтальная разметка имеет белый, желтый цвет. Линии 1.4, 1.10 и 1.17 только желтого цвета.","isFootnote":false,"num":null},{"text":"Горизонтальная разметка:","isFootnote":false,"num":null},{"text":"1.1 - разделяет транспортные потоки противоположных направлений и обозначает границы полос движения в опасных местах на дорогах; обозначает границы проезжей части, на которые въезд запрещен; обозначает границы стояночных мест транспортных средств и край проезжей части дорог, не отнесенных к автомагистралям (нумерация разметки соответствует СТ РК 1124. Наименование и изображение дорожной разметки приведены на рис. 3.);","isFootnote":false,"num":"1.1"},{"text":"1.2 (широкая сплошная линия) - обозначает край проезжей части на автомагистралях;","isFootnote":false,"num":"1.2"},{"text":"1.3 - разделяет транспортные потоки противоположных направлений на дорогах, имеющих четыре полосы движения и более;","isFootnote":false,"num":"1.3"},{"text":"1.4 - обозначает места, где запрещена остановка. Применяется самостоятельно или в сочетании со знаком 3.27 и наносится у края проезжей части или по верху бордюра;","isFootnote":false,"num":"1.4"},{"text":"1.5 - разделяет транспортные потоки противоположных направлений на дорогах, имеющих две или три полосы; обозначает границы полос движения при наличии двух и более полос, предназначенных для движения в одном направлении;","isFootnote":false,"num":"1.5"},{"text":"1.6 (линия приближения - прерывистая линия, у которой длина штрихов в 3 раза превышает промежутки между ними) - предупреждает о приближении к разметке 1.1 или 1.11, которая разделяет транспортные потоки противоположных или попутных направлений;","isFootnote":false,"num":"1.6"},{"text":"1.7 (прерывистая линия с короткими штрихами и равными им промежутками) - обозначает границы полос движения в пределах перекрестка;","isFootnote":false,"num":"1.7"},{"text":"1.8 (широкая прерывистая линия) - обозначает границу между полосой разгона или торможения и основной полосой проезжей части (на перекрестках, пересечениях дорог на разных уровнях, в зоне автобусных остановок и тому подобное);","isFootnote":false,"num":"1.8"},{"text":"1.9 - обозначает границы полос движения, на которых осуществляется реверсивное регулирование; разделяет транспортные потоки противоположных направлений (при выключенных реверсивных светофорах) на дорогах, где осуществляется реверсивное регулирование;","isFootnote":false,"num":"1.9"},{"text":"1.10 - обозначает места, где запрещена стоянка. Применяется самостоятельно или в сочетании со знаками 3.28 - 3.30 и наносится у края проезжей части или по верху бордюра;","isFootnote":false,"num":"1.10"},{"text":"1.11 - разделяет транспортные потоки противоположных или попутных направлений на участках дорог, где перестроение разрешено только из одной полосы; обозначает места, предназначенные для разворота, въезда и выезда со стояночных площадок и тому подобного, где движение разрешено только в одну сторону;","isFootnote":false,"num":"1.11"},{"text":"1.12 (стоп-линия) - указывает место, где водитель останавливается при наличии знака 2.5 или при запрещающем сигнале светофора (регулировщика);","isFootnote":false,"num":"1.12"},{"text":"1.13 - указывает место, где водитель должен при необходимости остановиться, уступая дорогу транспортным средствам, движущимся по пересекаемой дороге;","isFootnote":false,"num":"1.13"},{"text":"1.14.1, 1.14.2 (\"зебра\") - обозначает нерегулируемый пешеходный переход; стрелы разметки 1.14.2 указывают направление движения пешеходов; 1.14.3 - обозначает пешеходный переход, где движение регулируется светофором;","isFootnote":false,"num":null},{"text":"1.15 - обозначает место, где велосипедная дорожка пересекает проезжую часть;","isFootnote":false,"num":"1.15"},{"text":"1.16.1 - 1.16.3 - обозначение направляющих островков в местах: 1.16.1 - разделение транспортных потоков противоположных направлений, 1.16.2 - разделение транспортных потоков одного направления, 1.16.3 - слияние транспортных потоков;","isFootnote":false,"num":"1.16.1"},{"text":"1.17- обозначает остановки маршрутных транспортных средств и стоянки такси;","isFootnote":false,"num":null},{"text":"1.18 - указывает разрешенные на перекрестке направления движения по полосам. Применяется самостоятельно или в сочетании со знаками 5.8.1, 5.8.2; разметка с изображением тупика наносится для указания того, что поворот на ближайшую проезжую часть запрещен; разметка, разрешающая поворот налево из крайней левой полосы, разрешает и разворот;","isFootnote":false,"num":"1.18"},{"text":"1.19 - предупреждает о приближении к сужению проезжей части (участку, где уменьшается количество полос движения в данном направлении) или линиям разметки 1.1 или 1.11, разделяющим транспортные потоки противоположных направлений. В первом случае разметка 1.19 может применяться в сочетании со знаками 1.18.1 - 1.18.3;","isFootnote":false,"num":"1.19"},{"text":"1.20 - предупреждает о приближении к разметке 1.13;","isFootnote":false,"num":"1.20"},{"text":"1.21 (надпись \"СТОП\") - предупреждает о приближении к разметке 1.12, когда она применяется в сочетании со знаком 2.5;","isFootnote":false,"num":"1.21"},{"text":"1.22 - указывает номер дороги (маршрута);","isFootnote":false,"num":"1.22"},{"text":"1.23 - обозначает специальную полосу для маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3.","isFootnote":false,"num":"1.23"},{"text":"1.28 (разметка желтого цвета) - обозначает участок регулирования перекрестка.","isFootnote":false,"num":"1.28"},{"text":"Линии 1.1 - 1.3 пересекать запрещается.","isFootnote":false,"num":null},{"text":"Допускается пересечение линий 1.1 и 1.2 для остановки транспортного средства на обочине, а линии 1.1 как исключение при объезде препятствия, если выполнить его невозможно, не прибегая к этому исключению.","isFootnote":false,"num":null},{"text":"Действие линии 1.4. не распространяется на маршрутные транспортные средства.","isFootnote":false,"num":null},{"text":"Линии 1.5-1.8 пересекать разрешается с любой стороны.","isFootnote":false,"num":null},{"text":"Линию 1.9 при отсутствии реверсивных светофоров или когда они отключены разрешается пересекать, если она расположена справа от водителя; при включенных реверсивных светофорах - с любой стороны, если она разделяет полосы, по которым движение разрешено в одном направлении. При отключении реверсивных светофоров водитель немедленно перестраивается вправо за линию разметки 1.9.","isFootnote":false,"num":null},{"text":"Линию 1.9, разделяющую транспортные потоки противоположных направлений, при выключенных реверсивных светофорах пересекать запрещается.","isFootnote":false,"num":null},{"text":"Действие линии 1.10 не распространяется на транспортные средства, управляемые лицами с инвалидностью первой и второй групп, а также третьей группы с нарушениями опорно-двигательного аппарата или перевозящие лиц с такими группами инвалидности, и на такси с включенным таксометром.","isFootnote":false,"num":null},{"text":"Линию 1.11 разрешается пересекать со стороны прерывистой, а также и со стороны сплошной, но только при завершении обгона или объезда.","isFootnote":false,"num":null},{"text":"В случаях, когда значения дорожных знаков, в том числе временных, и линий горизонтальной разметки противоречат друг другу либо разметка недостаточно различима, водители должны руководствоваться дорожными знаками.","isFootnote":false,"num":null}]},{"id":"ch37","partId":"markings","partTitle":"Приложение 2. Дорожная разметка","partTitleKk":"2-қосымша. Жол таңбалары","title":"Глава 2. Вертикальная разметка","paragraphs":[{"text":"Вертикальная разметка в виде сочетания черных и белых полос на дорожных сооружениях и элементах оборудования дорог показывает их габариты и служит средством зрительного ориентирования.","isFootnote":false,"num":null},{"text":"Вертикальная разметка:","isFootnote":false,"num":null},{"text":"2.1 - обозначает элементы дорожных сооружений (опор мостов, путепроводов, торцовых частей парапетов и тому подобного), когда эти элементы представляют опасность для движущихся транспортных средств;","isFootnote":false,"num":"2.1"},{"text":"2.2 - обозначает нижний край пролетного строения тоннелей, мостов и путепроводов;","isFootnote":false,"num":"2.2"},{"text":"2.3 - обозначает круглые тумбы, установленные на разделительных полосах или островках безопасности;","isFootnote":false,"num":"2.3"},{"text":"2.4 - обозначает направляющие столбики, надолбы, опоры ограждений и тому подобное;","isFootnote":false,"num":"2.4"},{"text":"2.5 - обозначает боковые поверхности ограждений дорог на закруглениях малого радиуса, крутых спусках, других опасных участках;","isFootnote":false,"num":"2.5"},{"text":"2.6 - обозначает боковые поверхности ограждений дорог на других участках;","isFootnote":false,"num":"2.6"},{"text":"2.7 - обозначает бордюры на опасных участках и возвышающиеся островки безопасности;","isFootnote":false,"num":"2.7"},{"text":"Рисунок 3. Дорожная разметка","isFootnote":false,"num":null},{"text":"Сноска. Рисунок 3 – в редакции приказа Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"ГОРИЗОНТАЛЬНАЯ РАЗМЕТКА","isFootnote":false,"num":null},{"text":"ВЕРТИКАЛЬНАЯ РАЗМЕТКА","isFootnote":false,"num":null},{"text":"\".","isFootnote":false,"num":null},{"text":"в приложении 3 к Правилам дорожного движения:","isFootnote":false,"num":null},{"text":"рисунок 1 изложить в следующей редакции:","isFootnote":false,"num":null},{"text":"\"Рисунок 1. Сигналы светофора и регулировщика. Транспортные светофоры.","isFootnote":false,"num":null},{"text":"С вертикальным расположением сигналов","isFootnote":false,"num":null},{"text":"С горизонтальным расположением сигналов","isFootnote":false,"num":null},{"text":"Реверсивные","isFootnote":false,"num":null},{"text":"С дополнительной секцией","isFootnote":false,"num":null},{"text":"Для регулирования движения в определенных направлениях","isFootnote":false,"num":null},{"text":"Для регулирования движения через железнодорожные переезды","isFootnote":false,"num":null},{"text":"Для обозночения нерегулируемых перекрестков и пешеходных переходов","isFootnote":false,"num":null},{"text":"Для информирования о том, что для транспортных средств встречнего направления включен запрещающий красный сигнал","isFootnote":false,"num":null},{"text":"Для регулирования движения трамваев и других маршрутных транспортных средств","isFootnote":false,"num":null},{"text":"Для регулирования движения на территориях предприятий и организаций и в местах сужения проезжей части","isFootnote":false,"num":null},{"text":"Пешеходные светофоры","isFootnote":false,"num":null},{"text":"Светофоры для регулирования движения велосипедистов","isFootnote":false,"num":null},{"text":"Жезл для регулирования движения","isFootnote":false,"num":null},{"text":"Диск с красным световозвращателем","isFootnote":false,"num":null},{"text":"Основные сигналы регулировщика","isFootnote":false,"num":null},{"text":"Руки вытянуты в стороны или опущены (33.1)","isFootnote":false,"num":null},{"text":"Правая рука вытянута вперед (33.2)","isFootnote":false,"num":null},{"text":"Рука поднята вверх (33.3).\"","isFootnote":false,"num":null},{"text":"в Основных положениях по допуску транспортных средств к эксплуатации, утвержденных указанным приказом:","isFootnote":false,"num":null},{"text":"рисунок 4 изложить в следующей редакции:","isFootnote":false,"num":null},{"text":"\"Рисунок 4. Опознавательные и иные знаки","isFootnote":false,"num":null},{"text":"Опознавательные знаки автопоезда","isFootnote":false,"num":null},{"text":"Шипы","isFootnote":false,"num":null},{"text":"Учебное транспортное средство","isFootnote":false,"num":null},{"text":"Глухой водитель","isFootnote":false,"num":null},{"text":"Перевозка детей","isFootnote":false,"num":null},{"text":"Лицо с инвалидностью","isFootnote":false,"num":null},{"text":"Врач","isFootnote":false,"num":null},{"text":"Электромобиль","isFootnote":false,"num":null},{"text":"Автомобиль с газобаллонным оборудованием","isFootnote":false,"num":null},{"text":"Опасный груз","isFootnote":false,"num":null},{"text":"Ограничение скорости","isFootnote":false,"num":null},{"text":"Крупногабаритный груз","isFootnote":false,"num":null},{"text":"Отличительный знак транспортного средства Республики Казахстан","isFootnote":false,"num":null},{"text":"Длинномерное транспортное средство","isFootnote":false,"num":null},{"text":"\".","isFootnote":false,"num":null},{"text":"дорожного движения","isFootnote":false,"num":null},{"text":"Рис.1 Сигналы светофора и регулировщика транспортные светофоры","isFootnote":false,"num":null},{"text":"Сноска. Рисунок 1 с изменениями, внесенными приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Основные сигналы регулировщика","isFootnote":false,"num":null},{"text":"Утвержден приказом","isFootnote":false,"num":null},{"text":"министр внутренних дел","isFootnote":false,"num":null},{"text":"Республики Казахстан","isFootnote":false,"num":null},{"text":"от 30 июня 2023 года № 534","isFootnote":false,"num":null}]},{"id":"ch38","partId":"admission","partTitle":"Основные положения по допуску ТС к эксплуатации","partTitleKk":"Көлік құралдарын пайдалануға жіберу жөніндегі негізгі ережелер","title":"Основные положения по допуску транспортных средств к эксплуатации","paragraphs":[{"text":"1. Техническое состояние и оборудование участвующих в дорожном движении транспортных средств в части, относящейся к безопасности дорожного движения и охране окружающей среды, должны отвечать требованиям соответствующих технических регламентов, стандартов, правил и руководств по их технической эксплуатации.","isFootnote":false,"num":"1"},{"text":"2. Механические транспортные средства и прицепы должны быть зарегистрированы в органах внутренних дел в течение срока действия регистрационного знака \"Транзит\" либо не позднее десяти суток с момента приобретения или таможенного декларирования.","isFootnote":false,"num":"2"},{"text":"3. На механических транспортных средствах (кроме трамваев и троллейбусов) и прицепах должны быть установлены на предусмотренных местах государственные регистрационные номерные знаки.","isFootnote":false,"num":"3"},{"text":"Цифры и буквы регистрационных знаков должны быть повторены на задней стенке кузовов грузовых автомобилей, прицепов (кроме прицепов к легковым автомобилям и мотоциклам) и автобусов. Высота цифр - не менее трехсот миллиметров, ширина - не менее ста двадцати миллиметров, толщина штриха - тридцать миллиметров, размер букв - 2/3 от размера цифр.","isFootnote":false,"num":null},{"text":"На трамваях и троллейбусах наносятся регистрационные номера, присваиваемые соответствующими ведомствами.","isFootnote":false,"num":null},{"text":"4. Транспортное средство в случае совершения дорожно-транспортного происшествия с возникновением неисправностей, при которых запрещена эксплуатация транспортных средств, проходит повторный обязательный технический осмотр.","isFootnote":false,"num":"4"},{"text":"В случае совершения дорожно-транспортного происшествия с возникновением неисправностей, при которых запрещена эксплуатация транспортных средств, уполномоченное на то должностное лицо органов внутренних дел направляет транспортное средство для повторного прохождения обязательного технического осмотра.","isFootnote":false,"num":null},{"text":"Примечание ИЗПИ!","isFootnote":false,"num":null},{"text":"Абзац третий пункта 4 вводятся в действие с 12.07.2026 в соответствии с приказом Министра внутренних дел РК от 27.04.2026 № 305 (текст исключен).","isFootnote":false,"num":null},{"text":"Сноска. Пункт 4 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"5. Грузовой автомобиль с бортовой платформой, используемый для перевозки пассажиров, оборудуется сиденьями, закрепленными на высоте тридцать-пятьдесят сантиметров от пола и не менее тридцати сантиметров от верхнего края борта, а при перевозке детей, кроме того, борта должны иметь высоту не менее восьмидесяти сантиметров от уровня пола.","isFootnote":false,"num":"5"},{"text":"Сиденья, расположенные вдоль заднего или бокового бортов, должны иметь прочные спинки.","isFootnote":false,"num":null},{"text":"6. Механическое транспортное средство, используемое для обучения вождению и принадлежащее учебной организации, должно быть оборудовано дополнительными педалями привода сцепления и тормоза, опознавательным знаком \"Учебное транспортное средство\", на боковых и задней поверхностях такого транспортного средства наносится надпись \"Учебное транспортное средство\" на государственном языке.","isFootnote":false,"num":"6"},{"text":"7. Велосипед должен иметь исправные тормоз, руль и звуковой сигнал, оборудован спереди световозвращателем и фонарем или фарой (для движения в темное время суток и условиях недостаточной видимости) белого цвета, сзади - световозвращателем или фонарем красного цвета, а с каждой боковой стороны - световозвращателем оранжевого или красного цвета.","isFootnote":false,"num":"7"},{"text":"8. Гужевая повозка должна иметь предусмотренные конструкцией исправное стояночное тормозное устройство и противооткатные упоры, быть оборудована спереди двумя световозвращателями или фонарем белого цвета (для движения в темное время суток и условиях недостаточной видимости), сзади - двумя световозвращателями или фонарем красного цвета.","isFootnote":false,"num":"8"},{"text":"9. На транспортных средствах устанавливаются опознавательные знаки: Наименования и изображения опознавательных знаков приведены на рис.4.","isFootnote":false,"num":"9"},{"text":"\"Автопоезд\" - в виде трех фонарей оранжевого цвета, расположенных горизонтально на крыше кабины с промежутками между ними от ста пятидесяти до трехсот миллиметров - на грузовых автомобилях и колесных тракторах (класса 1,4 и выше) с прицепами, а также на сочлененных автобусах и троллейбусах. Допускается применение опознавательных знаков автопоезда в виде равностороннего треугольника желтого цвета (сторона - двести пятьдесят миллиметров) с устройством для внутреннего освещения;","isFootnote":false,"num":null},{"text":"по желанию водителя \"Шипы\" - в виде равностороннего треугольника белого цвета вершиной вверх с каймой красного цвета, в который вписана буква \"Ш\" черного цвета (сторона треугольника - не менее двухсот миллиметров, ширина каймы - 1/10 стороны) - сзади механических транспортных средств, имеющих ошипованные шины;","isFootnote":false,"num":null},{"text":"\"Перевозка детей\" - в виде квадрата желтого цвета с каймой красного цвета (сторона не менее двухсот пятидесяти миллиметров, ширина каймы -1/10 стороны), с черным изображением символа дорожного знака 1.21 спереди и сзади автобусов или грузовых автомобилей при перевозке групп детей;","isFootnote":false,"num":null},{"text":"\"Водитель с полной потерей слуха\" – в виде желтого круга диаметром сто шестьдесят миллиметров с нанесенными внутри тремя черными кружками диаметром сорок миллиметров, расположенными по углам воображаемого равностороннего треугольника, вершина которого обращена вниз – спереди и сзади механических транспортных средств, управляемых водителями с полной потерей речи и слуха, или с полной потерей слуха;","isFootnote":false,"num":null},{"text":"\"Учебное транспортное средство\" - в виде равностороннего треугольника белого цвета с вершиной вверх с каймой красного цвета, в который вписана буква \"У\" черного цвета (сторона - не менее двухсот миллиметров, ширина каймы - 1/10 стороны) - спереди и сзади механических транспортных средств, используемых для обучения вождению (допускается установка двустороннего знака на крыше легкового автомобиля);","isFootnote":false,"num":null},{"text":"\"Ограничение скорости\" - в виде уменьшенного цветного изображения дорожного знака 3.24 с указанием разрешенной скорости (диаметр знака - не менее ста шестидесяти миллиметров, ширина каймы - 1/10 диаметра) - на задней стороне кузова слева у механических транспортных средств, перевозящих тяжеловесные и крупногабаритные грузы, а также в случаях, когда максимальная скорость транспортного средства по технической характеристике ниже определенной пунктом 10.3 Правил дорожного движения Республики Казахстан.","isFootnote":false,"num":null},{"text":"Рис. 4 ОПОЗНАВАТЕЛЬНЫЕ И ИНЫЕ ЗНАКИ","isFootnote":false,"num":null},{"text":"Электромобиль","isFootnote":false,"num":null},{"text":"Автомобиль с газобаллонным","isFootnote":false,"num":null},{"text":"оборудованием","isFootnote":false,"num":null},{"text":"\"Опасный груз\" - в виде прямоугольника, имеющего световозвращающую поверхность, размером 300x400 мм, окрашена в оранжевый цвет с каймой черного цвета (ширина - пятнадцать миллиметров) и обозначениями, характеризующими опасные свойства груза - спереди и сзади транспортных средств, перевозящих такие грузы;","isFootnote":false,"num":null},{"text":"\"Крупногабаритный груз\" - в виде щитка размером 400x400 мм с нанесенными по диагонали красными и белыми чередующимися полосами шириной пятьдесят миллиметров со световозвращающей поверхностью - спереди, сзади и сбоку на крупногабаритном грузе;","isFootnote":false,"num":null},{"text":"\"Длинномерное транспортное средство\" - в виде прямоугольника размером не менее 1200x200 мм желтого цвета с каймой красного цвета (ширина - сорок миллиметров), имеющего световозвращающую поверхность - сзади транспортных средств, длина которых (включая один прицеп) с грузом или без груза - более двадцати метров, и автопоездов с двумя и более прицепами. При невозможности размещения знака указанного размера допускается установка двух одинаковых знаков размером не менее 600x200 мм симметрично оси транспортного средства;","isFootnote":false,"num":null},{"text":"\"Лицо с инвалидностью\" – в виде квадрата желтого цвета со стороной сто пятьдесят миллиметров и изображением символа дорожного знака 7.17 черного цвета – спереди и сзади механических транспортных средств, управляемых лицами с инвалидностью первой и второй групп, а также третьей группы с нарушениями опорно-двигательного аппарата или перевозящих лиц с такими группами инвалидности.","isFootnote":false,"num":null},{"text":"\"Электромобиль\" – в виде квадрата зеленого цвета со стороной сто пятьдесят миллиметров и изображением символа дорожного знака 7.22 черного цвета – сзади электромобилей;","isFootnote":false,"num":null},{"text":"\"Автомобиль с газобаллонным оборудованием\" - в виде равностороннего треугольника желтого цвета вершиной вверх с каймой черного цвета, в который вписана восклицательный знак и слово \"GAZ\" черного цвета (сторона треугольника - не менее двухсот миллиметров, ширина каймы - 1/10 стороны) - сзади механических транспортных средств, имеющих газобаллонное оборудование.","isFootnote":false,"num":null},{"text":"По желанию водителя может быть установлен опознавательный знак \"Врач\" - в виде квадрата синего цвета (сторона - сто сорок миллиметров) со вписанным белым кругом (диаметр - сто двадцать пять миллиметров), на который нанесен красный крест (высота - девяносто миллиметров, ширина штриха - двадцать пять миллиметров) - спереди и сзади автомобиля, управляемого водителем - врачом.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 9 с изменениями, внесенными приказами Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"10. Знак аварийной остановки. Мигающий красный цвет, излучаемый фонарем, применяемым в соответствии с требованиями главы 7 Правил дорожного движения Республики Казахстан, должен хорошо различаться днем в солнечную погоду и условиях недостаточной видимости.","isFootnote":false,"num":"10"},{"text":"11. В случаях, когда отличительный знак транспортного средства Республики Казахстан \"КZ\" помещается отдельно от государственного регистрационного номерного знака, он должен соответствовать следующим требованиям: буквы должны быть высотой не менее восьмидесяти миллиметров и обозначены штрихами шириной не менее десяти миллиметров. Буквы должны быть черными на белом фоне, имеющем форму эллипса, главная ось которого горизонтальна. Белый фон может быть из светоотражающего материала. Знак приклеивается или устанавливается на заднее стекло в верхнем правом углу легковых автомобилей, микроавтобусов и автобусов, а для остального транспорта - на задней панели в правой части - посередине.","isFootnote":false,"num":"11"},{"text":"12. Предупредительные устройства для обозначения гибких связующих звеньев при буксировке механических транспортных средств должны выполняться в виде флажков или щитков размером 200x200 мм с нанесенными с обоих сторон по диагонали красными и белыми чередующимися полосами шириной пятьдесят миллиметров со световозвращающей поверхностью.","isFootnote":false,"num":"12"},{"text":"На гибкое связующее звено должны устанавливаться не менее двух предупредительных устройств.","isFootnote":false,"num":null},{"text":"13. Конструкция жесткого буксирующего устройства.","isFootnote":false,"num":"13"},{"text":"14. Эксплуатация транспортных средств запрещается в случаях:","isFootnote":false,"num":"14"},{"text":"1) наличия технических неисправностей и условий, создающих угрозу безопасности дорожного движения и окружающей среде, их несоответствия техническим регламентам, стандартам, правилам и руководствам по их технической эксплуатации, а также их переоборудования без соответствующего согласования;","isFootnote":false,"num":"1)"},{"text":"2) несоответствия номеров узлов и агрегатов, установленных на транспортном средстве, данным, внесенным в регистрационные документы на транспортное средство, а также если узлы и агрегаты, установленные на транспортном средстве, имеют скрытые, поддельные и измененные номера;","isFootnote":false,"num":"2)"},{"text":"3) отсутствия регистрационных документов;","isFootnote":false,"num":"3)"},{"text":"4) непрохождения обязательного технического осмотра, за исключением транспортных средств категории M1, возраст которых не превышает семи лет, включая год выпуска, не используемых в предпринимательской деятельности в сфере автомобильного транспорта;","isFootnote":false,"num":"4)"},{"text":"5) отсутствия государственных регистрационных номерных знаков или их несоответствия установленным требованиям и регистрационным документам;","isFootnote":false,"num":"5)"},{"text":"6) незаключения договора обязательного страхования гражданско-правовой ответственности владельцев транспортных средств и (или) договора обязательного страхования гражданско-правовой ответственности перевозчика перед пассажирами.","isFootnote":false,"num":"6)"},{"text":"Факт заключения договора обязательного страхования гражданско-правовой ответственности владельцев транспортных средств и (или) договора обязательного страхования гражданско-правовой ответственности перевозчика перед пассажирами подтверждается путем запроса должностных лиц в единую базу данных по страхованию;","isFootnote":false,"num":null},{"text":"7) если их техническое состояние и оборудование не отвечают требованиям перечня неисправностей и условий, при которых запрещается эксплуатация транспортных средств (согласно приложению);","isFootnote":false,"num":"7)"},{"text":"8) управления автомобилем с прицепом, не предназначенным для движения в составе с ним;","isFootnote":false,"num":"8)"},{"text":"9) наличия технических неисправностей рельсовых транспортных средств, создающих угрозу безопасности дорожного движения, а также если их техническое состояние и оборудование не отвечают требованиям Правил технической эксплуатации рельсовых транспортных средств, утвержденных уполномоченным органом в области транспорта и коммуникаций;","isFootnote":false,"num":"9)"},{"text":"10) оборудования транспортных средств специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам, не входящих в перечень оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам;","isFootnote":false,"num":"10)"},{"text":"11) установки государственных регистрационных номерных знаков транспортного средства в местах, не предусмотренных требованиями законодательства Республики Казахстан в сфере дорожного движения;","isFootnote":false,"num":"11)"},{"text":"12) отсутствия на транспортных средствах, перевозящих опасные грузы, спереди и сзади знака \"Опасный груз\".","isFootnote":false,"num":"12)"},{"text":"15. Должностным и иным лицам, ответственным за техническое состояние и эксплуатацию транспортных средств, запрещается:","isFootnote":false,"num":"15"},{"text":"1) выпускать на линию транспортные средства, имеющие неисправности, с которыми запрещается их эксплуатация, или переоборудованные без соответствующего разрешения, или не зарегистрированные в установленном порядке, или не прошедшие обязательный технический осмотр, а равно владельцы, которых в установленных законодательством случаях не заключили договор обязательного страхования ответственности владельцев транспортных средств и/или договор обязательного страхования ответственности перевозчика перед пассажирами;","isFootnote":false,"num":"1)"},{"text":"2) допускать к управлению транспортными средствами водителей, находящихся в состоянии опьянения (алкогольного, наркотического или иного), под воздействием лекарственных препаратов, ухудшающих реакцию и внимание, в болезненном или утомленном состоянии, ставящем под угрозу безопасность движения, или лиц, не имеющих права управления транспортным средством данной категории;","isFootnote":false,"num":"2)"},{"text":"3) направлять для движения по дорогам с асфальто- и цементобетонным покрытием тракторы и самоходные машины на гусеничном ходу.","isFootnote":false,"num":"3)"},{"text":"Приложение к Основным","isFootnote":false,"num":null},{"text":"положениям по допуску","isFootnote":false,"num":null},{"text":"транспортных средств","isFootnote":false,"num":null},{"text":"к эксплуатации","isFootnote":false,"num":null}]},{"id":"ch39","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"ПЕРЕЧЕНЬ неисправностей и условий, создающих угрозу безопасности дорожного движения и окружающей среде, при которых запрещается эксплуатация транспортных средств","paragraphs":[{"text":"Настоящий перечень устанавливает неисправности автомобилей, автобусов, автопоездов, прицепов, мотоциклов, мопедов, тракторов, самоходных машин и условия, при которых запрещается их эксплуатация. Методы проверки приведенных параметров регламентированы соответствующими техническими регламентами, стандартами, правилами и руководством по их технической эксплуатации.","isFootnote":false,"num":null}]},{"id":"ch40","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 1. Тормозные системы","paragraphs":[{"text":"При дорожных испытаниях не соблюдаются нормы эффективности торможения рабочей тормозной системой, приведенные в таблице:","isFootnote":false,"num":null},{"text":"Таблица","isFootnote":false,"num":null},{"text":"Транспортные средства","isFootnote":false,"num":null},{"text":"Категория транспортного средства (тягача в составе автопоезда)","isFootnote":false,"num":null},{"text":"Тормозной путь, м, не более","isFootnote":false,"num":null},{"text":"Установившееся замедление, м/с2, не менее","isFootnote":false,"num":null},{"text":"Пассажирские и грузопассажирские автомобили","isFootnote":false,"num":null},{"text":"М1*","isFootnote":false,"num":null},{"text":"14,7","isFootnote":false,"num":null},{"text":"5,8","isFootnote":false,"num":null},{"text":"М2, М3","isFootnote":false,"num":null},{"text":"18,3","isFootnote":false,"num":null},{"text":"5,0","isFootnote":false,"num":null},{"text":"Легковые автомобили с прицепом","isFootnote":false,"num":null},{"text":"М1","isFootnote":false,"num":null},{"text":"14,7","isFootnote":false,"num":null},{"text":"5,8","isFootnote":false,"num":null},{"text":"Грузовые автомобили","isFootnote":false,"num":null},{"text":"N1 N2, N3","isFootnote":false,"num":null},{"text":"18,3","isFootnote":false,"num":null},{"text":"5,0","isFootnote":false,"num":null},{"text":"Грузовые автомобили с прицепом (полуприцепом)","isFootnote":false,"num":null},{"text":"N1 N 2, N3","isFootnote":false,"num":null},{"text":"19,5","isFootnote":false,"num":null},{"text":"5,0","isFootnote":false,"num":null},{"text":"1. Испытания проводятся на горизонтальном участке дороги с ровным, сухим, чистым цементно- или асфальтобетонным покрытием при скорости в начале торможения 40 км/ч - для автомобилей, автобусов и автопоездов, и 30 км/ч - для мотоциклов и мопедов. Транспортные средства испытывают путем однократного воздействия на орган управления рабочей тормозной системой. Масса транспортного средства при испытаниях не должна превышать разрешенной максимальной массы.","isFootnote":false,"num":"1"},{"text":"2. Эффективность рабочей тормозной системы транспортных средств может быть оценена и по другим показателям в соответствии с Национальным стандартом Республики Казахстан 51709 \"Автотранспортные средства. Требования к техническому состоянию по условиям безопасности движения. Методы проверки\" (далее - СТ РК ГОСТ Р 51709), утвержденным приказом председателя Комитета технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан от 13 декабря 2004 года № 429.","isFootnote":false,"num":"2"},{"text":"3. \"*\" Здесь и далее категории транспортных средств указаны в приложении А к СТ РК ГОСТ Р 51709.","isFootnote":false,"num":"3"},{"text":"4. Нарушена герметичность гидравлического тормозного привода.","isFootnote":false,"num":"4"},{"text":"5. Нарушение герметичности пневматического и пневмогидравлического тормозных приводов вызывает падение давления воздуха при неработающем двигателе более чем на 0,05 МПа (0,5 кгс/см2) за 15 минут после полного приведения их в действие.","isFootnote":false,"num":"5"},{"text":"6. Не действует манометр пневматического и пневмогидравлического тормозных приводов.","isFootnote":false,"num":"6"},{"text":"7. Стояночная тормозная система не обеспечивает неподвижное состояние:","isFootnote":false,"num":"7"},{"text":"1) транспортных средств с полной нагрузкой - на уклоне до 16 % включительно;","isFootnote":false,"num":"1)"},{"text":"2) легковых автомобилей и автобусов в снаряженном состоянии - на уклоне до 23 % включительно;","isFootnote":false,"num":"2)"},{"text":"3) грузовых автомобилей и автопоездов в снаряженном состоянии - на уклоне до 31 % включительно.","isFootnote":false,"num":"3)"}]},{"id":"ch41","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 2. Рулевое управление","paragraphs":[{"text":"8. Суммарный люфт в рулевом управлении превышает следующие значения:","isFootnote":false,"num":"8"},{"text":"Тип транспортного средства","isFootnote":false,"num":null},{"text":"Легковые автомобили и созданные на их базе грузовые автомобили и автобусы 10","isFootnote":false,"num":null},{"text":"Автобусы 20","isFootnote":false,"num":null},{"text":"Грузовые автомобили 25","isFootnote":false,"num":null},{"text":"Суммарный люфт (градусов), не более","isFootnote":false,"num":null},{"text":"9. Имеются не предусмотренные конструкцией перемещения деталей и узлов; резьбовые соединения не затянуты или не зафиксированы установленным способом.","isFootnote":false,"num":"9"},{"text":"10. Неисправен или отсутствует предусмотренный конструкцией усилитель рулевого управления или рулевой демпфер (для мотоциклов).","isFootnote":false,"num":"10"}]},{"id":"ch42","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 3. Внешние световые приборы","paragraphs":[{"text":"11. Количество, тип, цвет, расположение и режим работы внешних световых приборов не соответствуют требованиям конструкции транспортного средства.","isFootnote":false,"num":"11"},{"text":"На транспортных средствах, снятых с производства, допускается установка внешних световых приборов от транспортных средств других марок и моделей.","isFootnote":false,"num":null},{"text":"12. Регулировка фар не соответствует требованиям.","isFootnote":false,"num":"12"},{"text":"13. Не работают в установленном режиме или загрязнены внешние световые приборы и световозвращатели.","isFootnote":false,"num":"13"},{"text":"14. На световых приборах отсутствуют рассеиватели либо используются рассеиватели и лампы, не соответствующие типу данного светового прибора.","isFootnote":false,"num":"14"},{"text":"15. Установка проблесковых маячков не соответствует требованиям стандарта.","isFootnote":false,"num":"15"},{"text":"16. Спереди транспортного средства установлены световые приборы с огнями красного цвета или световозвращатели красного цвета, а сзади - белого цвета, кроме фонарей заднего хода и освещения регистрационного знака, световозвращающих регистрационного, отличительного и опознавательного знаков.","isFootnote":false,"num":"16"}]},{"id":"ch43","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 4. Стеклоочистители и стеклоомыватели ветрового стекла","paragraphs":[{"text":"17. Не работают в установленном режиме стеклоочистители.","isFootnote":false,"num":"17"},{"text":"18. Не работают предусмотренные конструкцией транспортного средства стеклоомыватели.","isFootnote":false,"num":"18"}]},{"id":"ch44","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 5. Колеса и шины","paragraphs":[{"text":"19. Шины легковых автомобилей имеют остаточную высоту рисунка протектора менее 1,6 мм, грузовых автомобилей - 1 мм, автобусов - 2 мм, мотоциклов и мопедов - 0,8 мм.","isFootnote":false,"num":"19"},{"text":"Для прицепов устанавливаются нормы остаточной высоты рисунка протектора шин, аналогичные нормам для шин транспортных средств-тягачей.","isFootnote":false,"num":null},{"text":"20. Шины имеют местные повреждения (пробои, порезы, разрывы), обнажающие корд, а также расслоение каркаса, отслоение протектора и боковины.","isFootnote":false,"num":"20"},{"text":"21. Отсутствует болт (гайка) крепления или имеются трещины диска и ободьев колес.","isFootnote":false,"num":"21"},{"text":"22. Шины по размеру или допустимой нагрузке не соответствуют модели транспортного средства.","isFootnote":false,"num":"22"},{"text":"23. На одну ось транспортных средств установлены шины различных размеров, конструкций (радиальной, диагональной, камерной, бескамерной), моделей, с различными рисунками протектора, ошипованные и неошипованные, морозостойкие и неморозостойкие, новые и восстановленные.","isFootnote":false,"num":"23"},{"text":"24. На передней оси междугородного автобуса (класс II**) и автобуса дальнего следования (класс III) установлены шины с восстановленным протектором, а на других осях - шины, восстановленные по второму классу ремонта.","isFootnote":false,"num":"24"},{"text":"25. На передней оси легкового автомобиля и городского автобуса (класс I) установлены шины, восстановленные по второму классу ремонта.","isFootnote":false,"num":"25"}]},{"id":"ch45","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 6. Двигатель","paragraphs":[{"text":"26. Содержание вредных веществ в отработавших газах и их дымность превышают нормы, установленные техническими регламентами и стандартами.","isFootnote":false,"num":"26"},{"text":"27. Нарушена герметичность системы питания.","isFootnote":false,"num":"27"},{"text":"28. Неисправна система выпуска отработавших газов.","isFootnote":false,"num":"28"},{"text":"29. Нарушена герметичность системы вентиляции картера.","isFootnote":false,"num":"29"}]},{"id":"ch46","partId":"faults","partTitle":"Перечень неисправностей и условий, запрещающих эксплуатацию","partTitleKk":"Көлік құралдарын пайдалануға тыйым салынатын ақаулар тізбесі","title":"Глава 7. Прочие элементы конструкции","paragraphs":[{"text":"30. Отсутствуют предусмотренные конструкцией транспортного средства зеркала заднего вида или их комплектация не соответствует требованиям, установленным СТ РК ГОСТ Р 51709.","isFootnote":false,"num":"30"},{"text":"31. Отсутствуют предусмотренные конструкцией транспортного средства стекла и противосолнечные козырьки.","isFootnote":false,"num":"31"},{"text":"32. Не работает или установлен звуковой сигнал с изменяющейся основной частотой.","isFootnote":false,"num":"32"},{"text":"33. Установлены дополнительные предметы, ограничивающие обзорность с места водителя (за исключением зеркал заднего вида, деталей стеклоочистителей, наружных и нанесенных или встроенных в стекла радиоантенн, нагревательных элементов устройств размораживания и осушения ветрового стекла, дефлекторов окон), влекущие опасность травмирования участников дорожного движения.","isFootnote":false,"num":"33"},{"text":"Сноска. Пункт 33 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"34. Наличие трещин на ветровом стекле автотранспортного средства в зоне очистки стеклоочистителем половины стекла, расположенного со стороны водителя.","isFootnote":false,"num":"34"},{"text":"35. Не работают в установленном порядке предусмотренные конструкцией замки дверей кузова или кабины, запоры бортов грузовой платформы, запоры горловин цистерн и пробки топливных баков, механизм регулировки и фиксирующие устройства сидений водителя и пассажиров, аварийный выключатель дверей и сигнал требования остановки на автобусе, аварийные выходы автобуса и устройства приведения их в действие, приборы внутреннего освещения салона автобуса, привод управления дверями и сигнализация их работы, спидометр, тахограф, противоугонные устройства, устройства обогрева и обдува стекол.","isFootnote":false,"num":"35"},{"text":"36. Отсутствуют предусмотренные конструкцией заднее защитное устройство, грязезащитные фартуки и брызговики.","isFootnote":false,"num":"36"},{"text":"37. Неисправны тягово-сцепное и опорно-сцепное устройства тягача и прицепного звена, а также отсутствуют или неисправны предусмотренные их конструкцией страховочные тросы (цепи). Имеются люфты в соединениях рамы мотоцикла с рамой бокового прицепа.","isFootnote":false,"num":"37"},{"text":"38. Отсутствуют:","isFootnote":false,"num":"38"},{"text":"1) на автобусе, легковом и грузовом автомобилях, колесных тракторах медицинская аптечка, огнетушитель (-и), знак аварийной остановки (мигающий красный фонарь).","isFootnote":false,"num":"1)"},{"text":"2) на грузовых автомобилях с разрешенной максимальной массой свыше 3,5 т и автобусах противооткатные упоры (не менее двух);","isFootnote":false,"num":"2)"},{"text":"3) на мотоцикле с боковым прицепом медицинская аптечка, знак аварийной остановки (мигающий красный фонарь);","isFootnote":false,"num":"3)"},{"text":"4) маркировка световозвращающим материалом, отвечающим требованиям Национальных стандартов Республики Казахстан 51253 \"Автотранспортные средства. Цветографические схемы размещения светоотражающей маркировки\" (далее - СТ РК ГОСТ Р 51253) и 41.104 \"Единообразные предписания, касающиеся официального утверждения светоотражающей маркировки для транспортных средств большой длины и грузоподъемности\" (далее - СТ РК ГОСТ Р 41.104 ), утвержденных приказом председателя Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан от 10 октября 2001 года № 381.","isFootnote":false,"num":"4)"},{"text":"Минимальное содержание лекарственных средств и изделий медицинского назначения медицинской аптечки устанавливается Министерством здравоохранения Республики Казахстан.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 38 с изменением, внесенным приказом Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"39. На транспортных средствах, не входящих в перечень оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам, используются проблесковые световые сигналы красного и синего цветов, независимо от места их установки, или звуковые сигналы с чередованием тонов, или специальные цветографические схемы, применяемые на транспортных средствах оперативных и специальных служб*.","isFootnote":false,"num":"39"},{"text":"40. Отсутствуют ремни безопасности, если их установка предусмотрена конструкцией транспортного средства.","isFootnote":false,"num":"40"},{"text":"41. Ремни безопасности неработоспособны или имеют видимые надрывы на лямке.","isFootnote":false,"num":"41"},{"text":"42. Регистрационный знак транспортного средства не отвечает требованиям стандарта.","isFootnote":false,"num":"42"},{"text":"43. На мотоцикле нет предусмотренных конструкцией дуг безопасности.","isFootnote":false,"num":"43"},{"text":"44. На мотоциклах и мопедах нет предусмотренных конструкцией подножек, поперечных рукояток для пассажиров на седле.","isFootnote":false,"num":"44"},{"text":"45. Отсутствуют предусмотренные конструкцией или установлены без согласования с предприятием-изготовителем транспортного средства или иной уполномоченной на то организацией дополнительные элементы тормозных систем, рулевого управления и иных узлов и агрегатов, требования к которым регламентируются настоящим перечнем.","isFootnote":false,"num":"45"},{"text":"46. Произведено переоборудование транспортных средств с нарушением требований, предусмотренных в области технического регулирования.","isFootnote":false,"num":"46"},{"text":"Произведено переоборудование транспортных средств категории М1, М2, М3, связанных с установкой (демонтажем) сидений, организации спальных мест и грузовых отсеков.","isFootnote":false,"num":null},{"text":"Произведено переоборудование транспортных средств категории N1, N2, N3, связанных с переводом в категорию М2 и М3.","isFootnote":false,"num":null},{"text":"Для категории М1 допускается переоборудование, связанное с уменьшением количества посадочных мест.","isFootnote":false,"num":null},{"text":"Для категории М1, М2 допускается переоборудование, связанное с их переводом в категорию N1, N2.","isFootnote":false,"num":null},{"text":"Переоборудование (изменение конструкции) транспортных средств - исключение предусмотренных или установка не предусмотренных конструкцией транспортного средства составных частей и предметов оборудования, влияющих на безопасность дорожного движения (за исключением установки багажников и прицепных устройств заводского изготовления).","isFootnote":false,"num":null},{"text":"Не относится к переоборудованию установка проблесковых маячков оранжевого или желтого цвета с быстросъемным (магнитным) креплением на транспортных средствах при выполнении работ по строительству, ремонту или содержанию дорог; транспортных средствах, сопровождающих перевозку тяжеловесных, крупногабаритных и опасных грузов; автобусах, предназначенных для перевозки организованных групп детей; транспортных средствах, сопровождающих организованные группы велосипедистов.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 46 - в редакции приказа Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); с изменением, внесенным приказом Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"47. На государственных регистрационных номерных знаках установлены элементы (устройства), позволяющие скрывать буквенные и цифровые обозначения регистрационного номерного знака.","isFootnote":false,"num":"47"},{"text":"Утвержден приказом","isFootnote":false,"num":null},{"text":"министр внутренних дел","isFootnote":false,"num":null},{"text":"Республики Казахстан","isFootnote":false,"num":null},{"text":"от 30 июня 2023 года № 534","isFootnote":false,"num":null},{"text":"Перечень оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам","isFootnote":false,"num":null},{"text":"Сноска. Перечень с изменениями, внесенными приказом Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"1. Служба государственной охраны Республики Казахстан.","isFootnote":false,"num":"1"},{"text":"2. Оперативные службы органов национальной безопасности Республики Казахстан.","isFootnote":false,"num":"2"},{"text":"3. Оперативные службы органов внутренних дел Республики Казахстан.","isFootnote":false,"num":"3"},{"text":"4. Оперативные службы органов в сфере гражданской защиты Республики Казахстан.","isFootnote":false,"num":"4"},{"text":"5. Органы военной полиции.","isFootnote":false,"num":"5"},{"text":"6. Аварийные службы.","isFootnote":false,"num":"6"},{"text":"7. Служба скорой медицинской помощи.","isFootnote":false,"num":"7"},{"text":"8. Мобильные группы оперативного реагирования частных охранных организаций.","isFootnote":false,"num":"8"},{"text":"9. Передвижные контрольно-пропускные пункты органов транспортного контроля.","isFootnote":false,"num":"9"},{"text":"10. Служба досудебного расследования Генеральной прокуратуры Республики Казахстан.","isFootnote":false,"num":"10"},{"text":"11. Оперативные подразделения службы экономических расследований.","isFootnote":false,"num":"11"},{"text":"12. Исключен приказом Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":false,"num":"12"},{"text":"13. Службы инкассации.","isFootnote":false,"num":"13"},{"text":"14. Транспортные средства, сопровождающие организованные группы велосипедистов.","isFootnote":false,"num":"14"},{"text":"15. Государственная фельдъегерская служба Республики Казахстан.","isFootnote":false,"num":"15"},{"text":"16. Транспортные средства подразделений Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан.","isFootnote":false,"num":"16"},{"text":"17. Транспортные средства территориальных подразделений Комитета рыбного хозяйства Министерства сельского хозяйства Республики Казахстан.","isFootnote":false,"num":"17"},{"text":"18. Транспортные средства мобильных групп органов государственных доходов.","isFootnote":false,"num":"18"},{"text":"19. Транспортные средства местных исполнительных органов, осуществляющих деятельность по контролю за использованием коммунальных платных парковочных мест, выявлению и фиксации нарушений остановки и стоянки транспортных средств.","isFootnote":false,"num":"19"},{"text":"Примечание:","isFootnote":false,"num":null},{"text":"Цветографическая окраска, опознавательные знаки, надписи, установка специальных световых и звуковых сигналов регламентируются Национальным стандартом Республики Казахстан 1863 \"Автомобили, автобусы и мотоциклы оперативных и специальных служб. Цветографические схемы, опознавательные знаки, надписи, специальные световые и звуковые сигналы. Общие требования.\", утвержденным приказом председателя Комитета технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан от 15 декабря 2020 года № 445-од.","isFootnote":false,"num":null},{"text":"Транспортные средства Службы государственной охраны, оперативных служб органов национальной безопасности, органов внутренних дел, службы экономических расследований, службы досудебного расследования Генеральной прокуратуры Республики Казахстан, органов военной полиции Вооруженных сил Республики Казахстан, Государственной фельдъегерской службы Республики Казахстан, подразделений Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан, территориальных подразделений Комитета рыбного хозяйства Министерства сельского хозяйства Республики Казахстан, мобильных групп органов государственных доходов могут не иметь специальной цветографической окраски, опознавательных знаков и надписей.","isFootnote":false,"num":null},{"text":"Отнесение транспортных средств к мобильным группам оперативного реагирования частных охранных организаций с возможностью оборудования специальной цветографической окраской, опознавательными знаками, надписями, световыми и звуковыми сигналами осуществляется после получения подтверждающих документов уполномоченного органа, осуществляющего государственный контроль за субъектами, занимающимися охранной деятельностью.","isFootnote":false,"num":null},{"text":"Допуск к установке специальных световых и звуковых сигналов и окраски по специальным цветографическим схемам транспортных средств, осуществляющих сопровождение организованных групп велосипедистов, проводится органами внутренних дел путем внесения соответствующей записи в графу \"Особые отметки\" свидетельства о регистрации транспортного средства.","isFootnote":false,"num":null}]}];

const PMP_DATA = {"title":"Первая медицинская помощь при ДТП и состав автомобильной аптечки","titleKk":"ЖКО кезіндегі алғашқы медициналық көмек және дәрі қобдишасы","sections":[{"id":"safety","title":"1. Алгоритм действий на месте ДТП","titleKk":"1. ЖКО орнындағы іс-қимыл алгоритмі","content":["**Обеспечение собственной безопасности**: заглушить двигатель, включить аварийную световую сигнализацию, выставить знак аварийной остановки (не менее 15 м в населенном пункте, не менее 30 м вне населенного пункта), надеть световозвращающий жилет.","**Вызов экстренных служб**: телефон 112 (единая служба спасения), 103 (скорая помощь), 102 (полиция). Четко сообщить адрес/километр трассы, количество пострадавших, наличие зажатых в салоне людей и детей.","**Оценка состояния пострадавших**: определить наличие сознания, проходимость дыхательных путей, дыхание и пульс на сонной артерии, наличие сильных кровотечений.","**Извлечение пострадавшего**: извлекать пострадавшего из поврежденного авто следует только при угрозе возгорания, взрыва или невозможности оказания помощи внутри. При подозрении на травму позвоночника обязательно фиксировать шею и спину (не сгибать и не скручивать тело)."]},{"id":"cpr","title":"2. Сердечно-легочная реанимация (СЛР)","titleKk":"2. Жүрек-өкпе реанимациясы","content":["**Положение**: пострадавший укладывается на твердую ровную поверхность на спину.","**Проходимость дыхательных путей**: запрокинуть голову назад, приподняв подбородок (при травме шеи — выдвинуть вперед нижнюю челюсть без запрокидывания).","**Соотношение компрессий и вдохов**: **30 компрессий грудной клетки : 2 искусственных вдоха** (стандарт AHA/ERC).","**Техника нажатий**: руки прямые в локтях, основание ладони по центру грудины (на 2 поперечных пальца выше мечевидного отростка). Глубина нажатия 5–6 см, частота **100–120 нажатий в минуту**.","**Искусственное дыхание**: зажать нос пострадавшего, плотно обхватить губами его рот (через устройство «рот-в-рот» из аптечки) и сделать плавный выдох объемом около 500–600 мл в течение 1 секунды, наблюдая за подъемом грудной клетки."]},{"id":"bleeding","title":"3. Остановка кровотечений","titleKk":"3. Қан кетуді тоқтату","content":["**Артериальное кровотечение (алая кровь бьет пульсирующей струей)**: немедленно прижать артерию пальцем выше места ранения, наложить кровоостанавливающий жгут (на 3–5 см выше раны) на одежду или тканевую подкладку. Обязательно вложить записку с точным временем наложения! Максимальное время наложения жгута: летом — не более 1 часа, зимой — не более 30 минут.","**Венозное кровотечение (темно-вишневая кровь вытекает непрерывной струей)**: наложить давящую повязку (стерильная салфетка + валик из бинта + тугое бинтование). Жгут при венозном кровотечении не накладывается.","**Капиллярное кровотечение**: обработать края раны антисептиком (не заливая внутрь раны) и наложить стерильную марлевую повязку."]},{"id":"fractures","title":"4. Травмы и переломы","titleKk":"4. Жарақаттар мен сынықтар","content":["**Иммобилизация**: при переломах конечностей необходимо обездвижить минимум два смежных сустава (выше и ниже места перелома). При переломе бедра или плеча — три сустава.","**Открытый перелом**: не вправлять костные обломки в рану! Сначала остановить кровотечение, наложить стерильную повязку на рану, а затем шину.","**Травма позвоночника**: категорически запрещается сажать, поднимать или переносить пострадавшего силами одного человека. Транспортировка только на твердом щите в положении лежа на спине."]},{"id":"kit","title":"5. Состав автомобильной аптечки РК","titleKk":"5. ҚР автокөлік дәрі қобдишасының құрамы","content":["Согласно действующему приказу Министерства здравоохранения Республики Казахстан, автомобильная аптечка укомплектована медицинскими изделиями для оказания первой помощи:","1. **Жгут кровоостанавливающий** — 1 шт.","2. **Бинт марлевый стерильный** (5 м × 10 см) — 1 шт.","3. **Бинт марлевый нестерильный** (5 м × 10 см и 7 м × 14 см) — 2 шт.","4. **Салфетки марлевые медицинские стерильные** — 1 уп.","5. **Пакет перевязочный стерильный** — 1 шт.","6. **Лейкопластырь бактерицидный** и **рулонный** — по 1 шт.","7. **Устройство для проведения искусственного дыхания «Рот-в-Рот»** — 1 шт.","8. **Ножницы тупоконечные** для разрезания одежды и повязок — 1 шт.","9. **Перчатки медицинские нестерильные** — 2 пары.","10. **Инструкция по оказанию первой помощи** и футляр аптечки."]}]};

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function plural(n,f){const c=n%100,d=n%10;return f[(c>4&&c<20)?2:(d===1?0:(d>1&&d<5?1:2))];}

/* localStorage может быть недоступен (приватный режим, песочница) — работаем без него */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function load(){
  try{ return Object.assign({done:{},mistakes:[],exams:[]}, JSON.parse(lsGet(KEY)||'{}')); }
  catch(e){ return {done:{},mistakes:[],exams:[]}; }
}
function save(){ lsSet(KEY, JSON.stringify(DB)); }
let DB = load();

/* ---- тема ---- */
const themeBtn = document.getElementById('theme-btn');
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(lsGet('zholtest.theme'));
themeBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  applyTheme(next); lsSet('zholtest.theme', next);
};

/* ---- состояние сессии ---- */
let S = null, tick = null;

function stopTimer(){ if(tick){clearInterval(tick); tick=null;} }

function makeQueue(list){
  return shuffle(list).map(q=>{
    const idx = shuffle(q.o.map((_,i)=>i));
    return {q, order:idx, correct:idx.indexOf(q.a), picked:null};
  });
}

function start(mode, topicId){
  let list, limit=null, instant=true, timed=false;
  if(mode==='exam'){ list=Q; limit=Math.min(EXAM_N,Q.length); instant=false; timed=true; }
  else if(mode==='topic'){ list=Q.filter(q=>q.t===topicId); }
  else if(mode==='mistakes'){ list=Q.filter(q=>DB.mistakes.includes(q.id)); }
  else { list=Q; }
  if(!list.length) return;
  let queue = makeQueue(list);
  if(limit) queue = queue.slice(0,limit);
  S = {mode, topicId, queue, i:0, errors:0, instant, timed,
       left: EXAM_MIN*60, started:Date.now(), answered:false, finished:false};
  stopTimer();
  if(timed){
    tick = setInterval(()=>{
      S.left--;
      if(S.left<=0){ stopTimer(); finish('time'); }
      else { const el=document.getElementById('timer'); if(el){el.textContent=fmt(S.left); el.classList.toggle('low',S.left<=120);} }
    },1000);
  }
  render();
}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}

function pick(n){
  const it = S.queue[S.i];
  if(S.instant && it.picked!==null) return;
  it.picked = n;
  if(S.instant){
    S.answered = true;
    record(it);
  }
  render();
}

function record(it){
  const id = it.q.id, ok = it.picked===it.correct;
  const d = DB.done[id] || (DB.done[id]={ok:0,bad:0});
  ok ? d.ok++ : d.bad++;
  const mi = DB.mistakes.indexOf(id);
  if(ok){ if(mi>-1) DB.mistakes.splice(mi,1); }
  else if(mi===-1) DB.mistakes.push(id);
  save();
}

function next(){
  const it = S.queue[S.i];
  if(!S.instant){
    if(it.picked===null) return;
    record(it);
    if(it.picked!==it.correct) S.errors++;
  }
  S.answered = false;
  if(S.i >= S.queue.length-1) return finish('done');
  S.i++; render();
}

function finish(reason){
  stopTimer();
  S.finished = true; S.reason = reason;
  S.spent = Math.round((Date.now()-S.started)/1000);
  if(!S.instant){
    S.queue.slice(S.i+1).forEach(it=>{ if(it.picked!==null) record(it); });
  }
  const answered = S.queue.filter(it=>it.picked!==null);
  S.right = answered.filter(it=>it.picked===it.correct).length;
  S.wrongList = answered.filter(it=>it.picked!==it.correct);
  if(S.mode==='exam'){
    S.pass = S.right >= EXAM_PASS;
    DB.exams.unshift({d:Date.now(), r:S.right, n:S.queue.length, p:S.pass});
    DB.exams = DB.exams.slice(0,50); save();
  }
  render();
}

  aP5:'Отдельная оговорка о первой помощи. Вопросы составлены по учебному разделу, который входит в экзаменационную подготовку. Клинические рекомендации по сердечно-лёгочной реанимации с тех пор обновились: современный стандарт — 30 нажатий на 2 вдоха с частотой 100–120 нажатий в минуту. На экзамене отвечайте по учебному материалу, в реальной ситуации действуйте по современному стандарту.',

function t(k){
  let s = (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : T.ru[k];
  if(s === undefined) return k;
  for(let i = 1; i < arguments.length; i++) s = s.split('{'+(i-1)+'}').join(arguments[i]);
  return s;
}

function ringMini(pct){
  const r = 34, c = 2*Math.PI*r, off = c*(1-pct/100);
  return '<svg class="ring-mini" viewBox="0 0 80 80" aria-hidden="true">'+
    '<circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--line-2)" stroke-width="7"/>'+
    '<circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 40 40)"/>'+
    '<text x="40" y="41" class="ring-pct" font-size="19" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">'+pct+'%</text></svg>';
}

let RULES_STATE = { chId: 'ch1', q: '', targetPIdx: null };

function stemRu(w){
  return w.toLowerCase()
    .replace(/(?:ся|сь)$/, '')
    .replace(/(?:иями|ями|ами|ого|его|ому|ему|ыми|ими|ях|ах|ов|ев|ей|ия|ья|ие|ье|ые|ое|ее|ам|ям|ом|ем|а|е|и|й|о|у|ы|ь|ю|я)$/, '');
}

function searchRules(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const words = q.split(/\s+/).filter(Boolean);
  const stems = words.map(stemRu).filter(s=>s.length>=2);
  const results = [];

  RULES_DATA.forEach(ch=>{
    ch.paragraphs.forEach((p, pIdx)=>{
      const fullText = (ch.title + ' ' + p.text).toLowerCase();
      const match = stems.every(st => fullText.includes(st) || (st.includes('самокат') && fullText.includes('самокат')));
      if(match){
        results.push({
          chapterId: ch.id,
          chapterTitle: ch.title,
          partTitle: LANG==='kk' ? ch.partTitleKk : ch.partTitle,
          pIdx,
          paragraph: p
        });
      }
    });
  });
  return results;
}

function highlightMatches(text, query){
  if(!query || !text) return esc(text);
  const words = query.trim().split(/\s+/).filter(w=>w.length>=2);
  if(!words.length) return esc(text);
  const stems = words.map(stemRu).filter(s=>s.length>=2);
  let escaped = esc(text);
  stems.forEach(st=>{
    try{
      const re = new RegExp('(' + st.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '[а-яa-z0-9]*)', 'gi');
      escaped = escaped.replace(re, '<mark class="hl">$1</mark>');
    }catch(e){}
  });
  return escaped;
}
