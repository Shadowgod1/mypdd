, N3, О2, О3, О4 в соответствии с техническим регламентом, за исключением технологического транспорта, эксплуатируемого на закрытых территориях и не подлежащего эксплуатации на дорогах общего пользования, а также автотранспорта крестьянских и фермерских хозяйств, используемых внутри этих хозяйств, маркируются световозвращающим материалом.","isFootnote":false,"num":"131"},{"text":"132. Противотуманные фары могут использоваться:","isFootnote":false,"num":"132"},{"text":"1) в условиях недостаточной видимости как отдельно, так и с ближним или дальним светом фар;","isFootnote":false,"num":"1)"},{"text":"2) в темное время суток на неосвещенных участках дорог совместно с ближним или дальним светом фар;","isFootnote":false,"num":"2)"},{"text":"3) вместо ближнего света фар в условиях, предусмотренных пунктом 134 настоящей главы.","isFootnote":false,"num":"3)"},{"text":"133. Противотуманные фары включаются при включенных габаритных огнях независимо от включенных фар дальнего и (или) ближнего света.","isFootnote":false,"num":"133"},{"text":"134. В светлое время суток на всех движущихся транспортных средствах с целью их обозначения включаются фары ближнего света или дневные ходовые огни.","isFootnote":false,"num":"134"},{"text":"135. Фарой-прожектором и фарой-искателем разрешается пользоваться только вне населенных пунктов при отсутствии встречных транспортных средств. В населенных пунктах пользоваться такими фарами могут только водители транспортных средств оперативных и специальных служб при выполнении служебного задания.","isFootnote":false,"num":"135"},{"text":"136. Задние противотуманные фонари применяются только в условиях недостаточной видимости. Задние противотуманные фонари не подключаются к стоп-сигналам.","isFootnote":false,"num":"136"},{"text":"137. Опознавательный знак \"Автопоезд\" включается при движении автопоезда, а в темное время суток и условиях недостаточной видимости, кроме того, и на время его остановки или стоянки.","isFootnote":false,"num":"137"},{"text":"138. Проблесковый маячок оранжевого или желтого цвета включается на:","isFootnote":false,"num":"138"},{"text":"транспортных средствах при выполнении работ по строительству, ремонту или уборки дорог, погрузке для транспортировки поврежденных, неисправных и иных транспортных средств;","isFootnote":false,"num":null},{"text":"транспортных средствах при осуществлении перевозок тяжеловесных, крупногабаритных и опасных грузов;","isFootnote":false,"num":null},{"text":"транспортных средствах, сопровождающих перевозку тяжеловесных, крупногабаритных и опасных грузов;","isFootnote":false,"num":null},{"text":"автобусах, предназначенных для перевозки организованных групп детей;","isFootnote":false,"num":null},{"text":"транспортных средствах мобильных групп оперативного реагирования частных охранных организаций при выезде на несанкционированные проникновения на охраняемые объекты;","isFootnote":false,"num":null},{"text":"транспортных средствах передвижных контрольно-пропускных пунктов органов транспортного контроля при несении службы на дорогах;","isFootnote":false,"num":null},{"text":"специализированных транспортных средствах служб инкассации при выезде на маршрут для инкассации ценностей;","isFootnote":false,"num":null},{"text":"транспортных средствах, сопровождающих организованные группы велосипедистов;","isFootnote":false,"num":null},{"text":"транспортных средствах, осуществляющих деятельность по пресечению правонарушений в области охраны растительного и животного мира;","isFootnote":false,"num":null},{"text":"транспортных средствах мобильных групп органов государственных доходов при остановке, доставке, перевозке (транспортировке) транспортных средств;","isFootnote":false,"num":null},{"text":"транспортных средствах местных исполнительных органов при осуществлении ими деятельности по контролю за использованием коммунальных платных парковочных мест, выявлению и фиксации нарушений остановки и стоянки транспортных средств.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 138 – в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"139. Звуковые сигналы применяются только:","isFootnote":false,"num":"139"},{"text":"1) для предупреждения других водителей о намерении произвести обгон вне населенных пунктов;","isFootnote":false,"num":"1)"},{"text":"2) в случаях, когда это необходимо для предотвращения дорожно-транспортного происшествия.","isFootnote":false,"num":"2)"},{"text":"140. Для предупреждения об обгоне, а также в случаях, предусмотренных пунктом 63 главы 9 настоящих Правил, подается световой сигнал, который представляет в светлое время суток периодическое кратковременное включение и выключение света фар, а в темное время суток - неоднократное переключение фар с ближнего на дальний свет.","isFootnote":false,"num":"140"}]},{"id":"ch20","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 20. Буксировка механических транспортных средств","paragraphs":[{"text":"141. Буксировка осуществляется с применением сцепки или путем вывешивания передней части транспортного средства на специальном опорном устройстве буксирующего транспортного средства, или путем его частичной погрузки на платформу буксирующего транспортного средства.","isFootnote":false,"num":"141"},{"text":"142. Буксировка на жесткой или гибкой сцепке должна осуществляться только при наличии водителя за рулем буксируемого транспортного средства, кроме случаев, когда конструкция жесткой сцепки обеспечивает при прямолинейном движении следование буксируемого транспортного средства по траектории буксирующего.","isFootnote":false,"num":"142"},{"text":"143. При буксировке на гибкой сцепке обеспечивается расстояние между буксирующим и буксируемым транспортными средствами в пределах четырех-шести метров, а при буксировке на жесткой сцепке - не более четырех метров. Связующие звенья должны удовлетворять требованиям соответственно пунктов 12 и 13 Основных положений.","isFootnote":false,"num":"143"},{"text":"144. При буксировке на гибкой или жесткой сцепке запрещается нахождение пассажиров в буксируемом автобусе (троллейбусе) и кузове буксируемого грузового автомобиля, а при буксировке путем вывешивания или частичной погрузки - нахождение пассажиров в кабине или кузове буксируемого транспортного средства, а также кузове буксирующего.","isFootnote":false,"num":"144"},{"text":"145. Запрещается буксировка:","isFootnote":false,"num":"145"},{"text":"1) транспортного средства, у которого не действует рулевое управление (допускается буксировка методом вывешивания или частичной погрузки);","isFootnote":false,"num":"1)"},{"text":"2) двух и более транспортных средств;","isFootnote":false,"num":"2)"},{"text":"3) транспортного средства с недействующей тормозной системой, если его фактическая масса более половины фактической массы буксирующего транспортного средства. При меньшей фактической массе буксировка такого транспортного средства допускается только на жесткой сцепке или методом частичной погрузки;","isFootnote":false,"num":"3)"},{"text":"4) мотоциклом без бокового прицепа, а также такого мотоцикла;","isFootnote":false,"num":"4)"},{"text":"5) в гололедицу на гибкой сцепке.","isFootnote":false,"num":"5)"},{"text":"6) мопедов, а также мопедами, кроме буксировки прицепа, предназначенного для эксплуатации с мопедом.","isFootnote":false,"num":"6)"},{"text":"Сноска. Пункт 145 с изменением, внесенным приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null}]},{"id":"ch21","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 21. Учебная езда","paragraphs":[{"text":"146. Первоначальное обучение вождению транспортных средств проводится на закрытых площадках или автодромах.","isFootnote":false,"num":"146"},{"text":"147. Учебная езда на дорогах осуществляется только с обучающим и при наличии первоначальных навыков управления у обучаемого, при отсутствии пассажиров в механическом транспортном средстве.","isFootnote":false,"num":"147"},{"text":"148. Обучающий имеет при себе соответствующее квалификационное свидетельство, водительское удостоверение на право управления транспортным средством той категории, по которой он проводит обучение, а обучаемый – документ, удостоверяющий личность, и медицинское заключение об отсутствии противопоказаний к управлению транспортным средством.","isFootnote":false,"num":"148"},{"text":"149. Механическое транспортное средство для обучения вождению дополнительно оборудуется в соответствии с требованиями пункта 6 Основных положений.","isFootnote":false,"num":"149"},{"text":"150. Обучение вождению транспортного средства на дорогах общего пользования осуществляется только по маршрутам, согласованным с уполномоченным органом, и в присутствии мастера обучения вождению во время образовательного процесса.","isFootnote":false,"num":"150"},{"text":"Сноска. Пункт 150 - в редакции приказа Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null}]},{"id":"ch22","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 22. Перевозка пассажиров","paragraphs":[{"text":"151. К перевозке пассажиров в кузове грузового автомобиля допускаются водители двадцатипятилетнего возраста, имеющие удостоверение на право управления транспортными средствами категории \"С\" (при перевозке более 8 человек, включая пассажиров в кабине, - категории \"С\" и \"D\") и стаж управления транспортными средствами данной категории более пяти лет.","isFootnote":false,"num":"151"},{"text":"Допуск военных водителей к перевозке пассажиров осуществляется в порядке, установленном законодательством Республики Казахстан.","isFootnote":false,"num":null},{"text":"К перевозкам пассажиров автомобилями, предназначенными для перевозки пассажиров и имеющими более восьми, но не более шестнадцати сидячих мест, помимо сиденья водителя (подкатегория \"D1\"), допускаются лица, достигшие двадцатиоднолетнего возраста и имеющие стаж работы водителем не менее трех лет, в том числе стаж управления транспортными средствами, относящимися к категории \"С1\", не менее одного года.","isFootnote":false,"num":null},{"text":"К перевозкам пассажиров автомобилями, предназначенными для перевозки пассажиров и имеющими более восьми сидячих мест, помимо сиденья водителя (категория \"D\"), допускаются лица, достигшие двадцатитрехлетнего возраста, имеющие стаж работы водителем не менее трех лет, в том числе стаж управления транспортными средствами, относящимися к подкатегории \"D1\", не менее одного года.","isFootnote":false,"num":null},{"text":"Транспортные средства, используемые для перевозок пассажиров и багажа, должны соответствовать требованиям технических регламентов.","isFootnote":false,"num":null},{"text":"Запрещается использование для перевозок в качестве такси автотранспортных средств со специальным управлением, в том числе полностью ручным, а также правосторонним рулевым управлением.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 151 с изменением, внесенным приказом Министра внутренних дел РК от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"152. Перевозка пассажиров в кузове грузового автомобиля с бортовой платформой допускается, если он оборудован в соответствии с требованиями пункта 5 Основных положений.","isFootnote":false,"num":"152"},{"text":"153. Перед поездкой водитель грузового автомобиля инструктирует пассажиров о порядке посадки, высадки и размещения в кузове; предупреждает, что стоять в кузове и сидеть на бортах во время движения не допускается.","isFootnote":false,"num":"153"},{"text":"Начинать движение можно только убедившись, что обеспечены условия безопасной перевозки пассажиров.","isFootnote":false,"num":null},{"text":"154. Проезд в кузове грузового автомобиля с бортовой платформой, не оборудованном для перевозки пассажиров, допускается только лицам, сопровождающим груз или направляющимся за ним при условии, что они обеспечены местом для сидения, расположенным ниже уровня бортов.","isFootnote":false,"num":"154"},{"text":"155. Водитель обязан осуществлять посадку и высадку пассажиров в местах, где не запрещена остановка транспортных средств, установленных главой 12 настоящих Правил, только после полной остановки транспортного средства, а начинать движение только с закрытыми дверями и не открывать их до полной остановки.","isFootnote":false,"num":"155"},{"text":"Водитель маршрутного транспортного средства осуществляет посадку и высадку пассажиров только на обозначенном остановочном пункте.","isFootnote":false,"num":null},{"text":"156. Запрещается перевозить пассажиров:","isFootnote":false,"num":"156"},{"text":"1) вне кабины автомобиля (кроме случаев перевозки пассажиров в кузове грузового автомобиля с бортовой платформой или кузове-фургоне), трактора, самоходной машины, на грузовом прицепе, прицепе-даче, кузове грузового мотоцикла и вне предусмотренных конструкцией мотоцикла мест для сидения;","isFootnote":false,"num":"1)"},{"text":"2) сверх количества, предусмотренного технической характеристикой транспортного средства, при этом фактическая масса транспортного средства не должна превышать величины разрешенной максимальной массы, установленной предприятием-изготовителем;","isFootnote":false,"num":"2)"},{"text":"3) в состоянии опьянения на заднем сиденье мотоцикла или мопеда;","isFootnote":false,"num":"3)"},{"text":"4) сверх количества оборудованных для сидения мест в кузове грузового автомобиля.","isFootnote":false,"num":"4)"},{"text":"5) не достигших шестнадцатилетнего возраста, на заднем сидении мотоцикла или мопеда.","isFootnote":false,"num":"5)"},{"text":"Сноска. Пункт 156 с изменениями, внесенными приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"157. Запрещается перевозить детей до 12 лет:","isFootnote":false,"num":"157"},{"text":"1) исключен приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025);","isFootnote":false,"num":"1)"},{"text":"2) при отсутствии специального детского удерживающего устройства или иных средств, позволяющих пристегнуть ребенка с помощью ремней безопасности, предусмотренных конструкцией транспортного средства, а на переднем сидении механического транспортного средства при отсутствии специального детского удерживающего устройства.","isFootnote":false,"num":"2)"},{"text":"Сноска. Пункт 157 с изменением, внесенным приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"158. Перевозка организованных групп детей осуществляется автобусами, имеющими не менее двух дверей, техническое состояние которых отвечает требованиям, установленным Правилами перевозок пассажиров и багажа автомобильным транспортом, утвержденными уполномоченным органом в области автомобильных перевозок.","isFootnote":false,"num":"158"},{"text":"Автобусы, предназначенные для перевозки организованных групп детей, оборудуются проблесковым маячком желтого цвета. На этих автобусах спереди и сзади устанавливаются опознавательные знаки \"Перевозка детей\".","isFootnote":false,"num":null},{"text":"К перевозкам организованных групп детей допускаются водители в возрасте не менее двадцати пяти лет, имеющие водительское удостоверение соответствующей категории и стаж работы водителем не менее пяти лет.","isFootnote":false,"num":null},{"text":"Количество перевозимых детей в автобусе не должно превышать количества посадочных мест.","isFootnote":false,"num":null},{"text":"Колонны из двух и более автобусов, перевозящих детей на загородных дорогах, в обязательном порядке сопровождаются специальными автомобилями органов внутренних дел.","isFootnote":false,"num":null}]},{"id":"ch23","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 23. Перевозка грузов","paragraphs":[{"text":"159. Перевозка грузов должна осуществляться транспортными средствами и составами транспортных средств, предназначенными для этой цели.","isFootnote":false,"num":"159"},{"text":"В автобусах не допускается перевозка груза, в том числе багажа, вне багажного отделения.","isFootnote":false,"num":null},{"text":"160. Масса перевозимого груза и пассажиров, распределение нагрузки по осям не должны превышать величин, установленных предприятием-изготовителем для данного транспортного средства.","isFootnote":false,"num":"160"},{"text":"161. Перед началом и во время движения водитель контролирует размещение, крепление, укрытие и состояние груза во избежание его падения, создания помех для движения.","isFootnote":false,"num":"161"},{"text":"162. Перевозка груза допускается при условии, что он:","isFootnote":false,"num":"162"},{"text":"1) размещен и, в случае необходимости, закреплен на транспортном средстве таким образом, чтобы он не подвергал опасности людей и не наносил ущерба государственному, общественному или личному имуществу;","isFootnote":false,"num":"1)"},{"text":"2) не ограничивает водителю обзор и видимость;","isFootnote":false,"num":"2)"},{"text":"3) не затрудняет управление и не нарушает устойчивость транспортного средства;","isFootnote":false,"num":"3)"},{"text":"4) не закрывает внешние световые приборы, включая стоп-сигнал и указатели поворота, светоотражающих приспособлений, государственных регистрационных номерных знаков и отличительного знака государства регистрации, которые должны быть на транспортном средстве, или не закрывал сигналов, подаваемых рукой;","isFootnote":false,"num":"4)"},{"text":"5) не производил неудобств, которых можно избежать.","isFootnote":false,"num":"5)"},{"text":"Если состояние и размещение груза не удовлетворяют указанным требованиям, водитель обязан устранить нарушения перечисленных правил перевозки, а если устранение невозможно - прекратить дальнейшее движение.","isFootnote":false,"num":null},{"text":"163. Груз или выступающие за габариты части транспортного средства спереди и сзади более чем на один метр или сбоку более чем на сорок сантиметров от внешнего края габаритного огня обозначаются опознавательными знаками \"Крупногабаритный груз\", а в темное время суток и условиях недостаточной видимости, кроме того, спереди фонарем или световозвращателем белого цвета, сзади - фонарем или световозвращателем красного цвета.","isFootnote":false,"num":"163"},{"text":"164. Перевозка тяжеловесных, крупногабаритных и опасных грузов осуществляется в порядке, определяемом уполномоченным органом в области транспорта и коммуникаций.","isFootnote":false,"num":"164"},{"text":"Транспортное средство должно быть обозначено опознавательными знаками: \"Опасный груз\" - при перевозке опасных грузов; \"Длинномерное транспортное средство\" - в случаях, предусмотренных пунктом 9 Основных положений.","isFootnote":false,"num":null}]},{"id":"ch24","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 24. Дополнительные требования к движению электрических самокатов, велосипедов, малых электрических транспортных средств, гужевых повозок, а также прогону животных","paragraphs":[{"text":"Сноска. Заголовок главы 24 - в редакции приказа Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"165. Право управления мопедом предоставляется лицам, достигшим шестнадцатилетнего возраста.","isFootnote":false,"num":"165"},{"text":"166. Водители велосипедов двигаются по велосипедной дорожке, велосипедной полосе движения, а при их отсутствии - по правому краю проезжей части дороги, в том числе по полосе для маршрутных транспортных средств, в один ряд либо по обочине, тротуару или пешеходной дорожке, не создавая опасности для движения пешеходов.","isFootnote":false,"num":"166"},{"text":"Движение по тротуару и (или) пешеходной дорожке на велосипедах с двигателем осуществляется согласно пункту 6 статьи 57 Закона \"О дорожном движении\".","isFootnote":false,"num":null},{"text":"Не допускается движение по правовому краю проезжей части, полосе маршрутных транспортных средств, обочине велосипедистов, не достигших четырнадцатилетнего возраста.","isFootnote":false,"num":null},{"text":"На дорогах с велосипедной полосой движения, обозначенной знаком 4.5 согласно приложению 1 к настоящим Правилам с табличкой 7.14, не осуществляется движение и не производится остановка других транспортных средств на этой полосе.","isFootnote":false,"num":null},{"text":"Если полоса, обозначенная знаком 4.5 согласно приложению 1 к настоящим Правилам с табличкой 7.14, отделена от остальной проезжей части дороги прерывистой линией разметки, то при поворотах транспортные средства перестраиваются на нее. Разрешается также в таких местах заезжать на эту полосу при въезде на дорогу и для посадки и высадки пассажиров у правого края проезжей части дороги.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 166 с изменениями, внесенными приказами Министра внутренних дел РК от 31.08.2023 № 671 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 26.09.2024 № 725 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"167. Исключен приказом Министра внутренних дел РК от 31.08.2023 № 671 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":false,"num":"167"},{"text":"168. Исключен приказом Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":false,"num":"168"},{"text":"168-1. Водители электрических самокатов двигаются по велосипедной дорожке, велосипедной полосе движения. При отсутствии велосипедной дорожки, велосипедной полосы движения водители электрических самокатов двигаются по:","isFootnote":false,"num":"168-1"},{"text":"правому краю проезжей части дороги, в том числе по полосе для маршрутных транспортных средств, в соответствии с требованиями, установленными частью второй настоящего пункта, в один ряд;","isFootnote":false,"num":null},{"text":"обочине;","isFootnote":false,"num":null},{"text":"тротуару или пешеходной дорожке, со скоростью не более шести километров в час, не создавая опасности для движения пешеходов.","isFootnote":false,"num":null},{"text":"Не допускается движение по правому краю проезжей части дороги, в том числе по полосе для маршрутных транспортных средств, водителей электрических самокатов, не достигших восемнадцатилетнего возраста, без водительского удостоверения на право управления транспортным средством любой категории либо временного удостоверения, выданного взамен водительского удостоверения на право управления транспортным средством, за исключением выданных в Республике Казахстан в случае наличия при себе документа, удостоверяющего личность водителя.","isFootnote":false,"num":null},{"text":"Сноска. Правила дополнены пунктом 168-1 в соответствии с приказом Министра внутренних дел РК от 31.08.2023 № 671 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"169. Гужевые повозки (сани), вьючные, упряжные или верховые животные двигаются по крайней правой полосе в один ряд или по обочине, если это не создает помех пешеходам.","isFootnote":false,"num":"169"},{"text":"170. Колонны велосипедистов, гужевых повозок (саней), вьючных, упряженных или верховых животных при движении по проезжей части дороги должны быть разделены на группы по десять велосипедистов, верховых и вьючных животных и пять повозок (саней). Для облегчения обгона расстояние между группами должно составлять восемьдесят – сто метров.","isFootnote":false,"num":"170"},{"text":"171. Водителям электрических самокатов и велосипедов не допускается:","isFootnote":false,"num":"171"},{"text":"1) ездить, не держась за руль хотя бы одной рукой;","isFootnote":false,"num":"1)"},{"text":"2) перевозить пассажиров, кроме перевозки пассажиров на велосипедах со специальными приспособлениями для их перевозки;","isFootnote":false,"num":"2)"},{"text":"3) перевозить груз, кроме перевозки груза на велосипедах со специальными приспособлениями для их перевозки, а также груза, который не выступает более чем на пятьдесят сантиметров по длине или ширине за габариты, или груз, мешающий управлению;","isFootnote":false,"num":"3)"},{"text":"4) поворачивать налево или разворачиваться на дорогах с трамвайным движением и на дорогах, имеющих более одной полосы, для движения в данном направлении;","isFootnote":false,"num":"4)"},{"text":"5) буксировка электрических самокатов и велосипедов, а также электрическими самокатами и велосипедами, кроме буксировки прицепа, предназначенного для эксплуатации с велосипедом;","isFootnote":false,"num":"5)"},{"text":"6) пересекать проезжую часть дороги по пешеходным переходам, находясь на транспортном средстве;","isFootnote":false,"num":"6)"},{"text":"7) передвигаться в темное время суток по проезжей части дороги без светоотражающего предмета, соответствующего требованиям, определенным правилами дорожного движения, обеспечивающего видимость водителям других транспортных средств;","isFootnote":false,"num":"7)"},{"text":"8) при управлении по проезжей части дороги быть без застегнутого шлема.","isFootnote":false,"num":"8)"},{"text":"Сноска. Пункт 171 - в редакции приказа Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"172. На нерегулируемом пересечении велосипедной дорожки с дорогой, расположенном вне перекрестка, водители велосипедов должны уступить дорогу транспортным средствам, движущимся по этой дороге.","isFootnote":false,"num":"172"},{"text":"Водитель гужевой повозки (саней) при выезде на дорогу со второстепенной дороги в местах с ограниченной обзорностью ведет животное под уздцы.","isFootnote":false,"num":null},{"text":"Сноска. Пункт 172 - в редакции приказа Министра внутренних дел РК от 25.12.2024 № 1013 (вводится в действие с 05.04.2025).","isFootnote":true,"num":null},{"text":"172-1. Водителям малых электрических транспортных средств запрещается:","isFootnote":false,"num":"172-1"},{"text":"1) ездить, не держась за руль хотя бы одной рукой, за исключением малых электрических транспортных средств без руля;","isFootnote":false,"num":"1)"},{"text":"2) перевозить пассажиров;","isFootnote":false,"num":"2)"},{"text":"3) перевозить груз;","isFootnote":false,"num":"3)"},{"text":"4) двигаться по проезжей части дороги;","isFootnote":false,"num":"4)"},{"text":"5) двигаться по тротуару или пешеходной дорожке при наличии рядом велосипедной дорожки, велосипедной полосы движения;","isFootnote":false,"num":"5)"},{"text":"6) буксировка малых электрических транспортных средств, малыми электрическими транспортными средствами;","isFootnote":false,"num":"6)"},{"text":"7) пересекать проезжую часть дороги по пешеходным переходам, находясь на малом электрическом транспортном средстве.","isFootnote":false,"num":"7)"},{"text":"Сноска. Правила дополнены пунктом 172-1 в соответствии с приказом Министра внутренних дел РК от 31.08.2023 № 671 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"173. Животных по дороге следует перегонять, как правило, в светлое время суток. Погонщики направляют животных ближе к правому краю дороги.","isFootnote":false,"num":"173"},{"text":"174. При прогоне группы животных по дороге или через нее в темное время суток и условиях недостаточной видимости погонщики подают сигналы для предупреждения водителей о нахождении животных на дороге.","isFootnote":false,"num":"174"},{"text":"Сигналом служит круговое движение руки с факелом или фонарем, при этом подающий сигнал находится на расстоянии десяти-пятнадцати метров от группы животных в сторону приближающегося транспортного средства.","isFootnote":false,"num":null},{"text":"175. При прогоне животных через железнодорожные пути стадо должно делится на группы такой численности, чтобы с учетом количества погонщиков был обеспечен безопасный прогон каждой группы.","isFootnote":false,"num":"175"},{"text":"176. Водителям гужевых повозок (саней), погонщикам и владельцам вьючных, упряжных, верховых животных и скота не допускается:","isFootnote":false,"num":"176"},{"text":"1) оставлять животных без надзора в случаях, не исключающих их появление на дорогах с твердым покрытием;","isFootnote":false,"num":"1)"},{"text":"2) прогонять животных через железнодорожные пути и дороги вне специально отведенных мест, а также в темное время суток и условиях недостаточной видимости (кроме скотопрогонов на разных уровнях);","isFootnote":false,"num":"2)"},{"text":"3) вести животных по дороге с асфальто- и цементобетонным покрытием при наличии иных путей.","isFootnote":false,"num":"3)"}]},{"id":"ch25","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 25. Обеспечение движения людей с нарушениями опорно-двигательного аппарата","paragraphs":[{"text":"177. Организация движения людей с нарушениями опорно-двигательного аппарата и стоянки обслуживающих их транспортных средств:","isFootnote":false,"num":"177"},{"text":"1) на транспортные средства, управляемые водителями с нарушениями опорно-двигательного аппарата или водителями транспортных средств, обслуживающих людей с нарушениями опорно-двигательного аппарата или полной потерей зрения, не распространяются действия знаков 3.28, 3.29, 3.30 согласно приложению 1 к настоящим Правилам;","isFootnote":false,"num":"1)"},{"text":"2) транспортные средства, управляемые водителями с нарушением опорно-двигательного аппарата или водителями транспортных средств, обслуживающих людей с нарушениями опорно-двигательного аппарата, должны быть оборудованы соответствующими механизмами для управления и (или) приспособлениями;","isFootnote":false,"num":"2)"},{"text":"3) в случае, если со знаком 5.15 установлен знак 7.17 согласно приложению 1 к настоящим Правилам, действие дорожного знака 5.15 согласно приложению 1 к настоящим Правилам распространяется только на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\";","isFootnote":false,"num":"3)"},{"text":"4) в случае, если с запрещающими либо предписывающими знаками установлен знак 7.18 согласно приложению 1 к настоящим Правилам, то действие данных дорожных знаков не распространяется на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\".","isFootnote":false,"num":"4)"},{"text":"178. Водители с нарушением опорно-двигательного аппарата, управляющие транспортными средствами с опознавательными знаками \"Лицо с инвалидностью\", имеют право:","isFootnote":false,"num":"178"},{"text":"1) останавливать и ставить транспортное средство в населенных пунктах в зоне действия дорожных знаков, запрещающих остановку или стоянку, при условии, что стоящее транспортное средство полностью располагается на тротуаре таким образом, чтобы для движения пешеходов оставалась свободная полоса шириной не менее полутора метров. Данное правило не действует на участках дороги, обозначенных запрещающей остановку дорожной разметкой;","isFootnote":false,"num":"1)"},{"text":"2) ставить транспортное средство в зоне действия знаков, запрещающих стоянку, на местах стоянки с ограниченным временем свыше предусмотренного срока и на дорогах на дворовой территории за пределами мест стоянки при условии, что это не создает помех для пешеходов и не лишает другие транспортные средства возможности движения.","isFootnote":false,"num":"2)"},{"text":"179. Водители транспортных средств с опознавательными знаками \"Лицо с инвалидностью\", обслуживающих людей с нарушениями опорно-двигательного аппарата или полной потерей зрения, останавливают транспортное средство в населенных пунктах в зоне действия дорожных знаков, запрещающих остановку, для посадки или высадки людей с нарушениями опорно-двигательного аппарата или полной потерей зрения.","isFootnote":false,"num":"179"},{"text":"180. Водитель транспортного средства с опознавательными знаками \"Лицо с инвалидностью\", обслуживающего человека с нарушениями опорно-двигательного аппарата или полной потерей зрения, который ведет за руку человека с нарушениями опорно-двигательного аппарата или полной потерей зрения к месту назначения и обратно, останавливает транспортное средство в населенных пунктах на условиях, указанных в подпункте 1) пункта 178 настоящей главы.","isFootnote":false,"num":"180"}]},{"id":"ch26","partId":"pdd","partTitle":"Правила дорожного движения","partTitleKk":"Жол жүрісі қағидалары","title":"Глава 26. Движение в транспортной колонне в условиях недостаточной видимости","paragraphs":[{"text":"Сноска. Правила дополнены главой 26 в соответствии с приказом Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"181. Транспортные средства должны двигаться в колонне только в один ряд как можно ближе к правому краю проезжей части, за исключением случаев, когда они сопровождаются оперативными транспортными средствами.","isFootnote":false,"num":"181"},{"text":"При движении в колонне свыше десяти транспортных средств обеспечивается их сопровождение не менее двумя транспортными средствами с включенным проблесковым маячком синего цвета или маячками синего и красного цветов (ведущий и замыкающий).","isFootnote":false,"num":null},{"text":"182. Скорость движения колонны и дистанция между транспортными средствами устанавливаются старшим колонны или по режиму движения головной машины в соответствии с требованиями настоящих Правил. Колонна, движущаяся без сопровождения оперативными транспортными средствами, разделяется на группы (не более пяти транспортных средств в каждой), дистанция между которыми должна обеспечивать возможность обгона группы другими транспортными средствами.","isFootnote":false,"num":"182"},{"text":"183. При остановке колонны на дороге на всех транспортных средствах включается аварийная сигнализация.","isFootnote":false,"num":"183"},{"text":"184. Участник колонны выполняет требования ведущего и замыкающего.","isFootnote":false,"num":"184"},{"text":"185. Участник колонны соблюдает безопасную дистанцию.","isFootnote":false,"num":"185"},{"text":"186. Не допускается нарушать схему движения колонны, в том числе обгонять других участников колонны, а также покидать колонну или производить самопроизвольную остановку, за исключением вынужденной остановки.","isFootnote":false,"num":"186"},{"text":"187. Перед началом движения участники колонны должны запустить двигатели и включить фары ближнего света или дневные ходовые огни. При неготовности, участник колонны сообщает об этом замыкающему колонны. Замыкающий колонны перекрывает полосу, на которую должна выехать колонна и убедиться, что началу движения колонны ничто не мешает, после чего дать разрешение ведущему начать движение.","isFootnote":false,"num":"187"},{"text":"После получения разрешения замыкающего, ведущий колонны подает звуковой сигнал и начинает движение. Остальные участники колонны начинают движение за ведущим колонны. Замыкающий присоединяется к колонне только после того, как выедет последний участник колонны.","isFootnote":false,"num":null},{"text":"188. В целях осуществления остановки ведущий подает сигнал о торможении и включает сигнал правого поворота. Ведущий снижает скорость, съезжает на обочину и останавливается параллельно дороге.","isFootnote":false,"num":"188"},{"text":"Участники колонны за ведущим съезжают на обочину и останавливаются, соблюдая дистанцию и схему построения.","isFootnote":false,"num":null},{"text":"189. При заезде на стоянку участник колонны останавливается на въезде и возобновляет движение после окончания маневра парковки транспортным средством, движущимся впереди.","isFootnote":false,"num":"189"},{"text":"190. В случае необходимости аварийной остановки, участник колонны оповещает об этом ведущего голосовой командой, жестом, по средствам связи и (или) подает дополнительные сигналы дальним светом фар и звуковым сигналом, после чего осуществляет постепенное снижение скорости до полной остановки транспортного средства.","isFootnote":false,"num":"190"},{"text":"191. Перекрестки, железнодорожные переезды и светофоры необходимо проезжать, соблюдая требования главы 15 настоящих Правил с использованием необходимых сигналов. При разрыве колонны замыкающий предупреждает ведущего голосовой командой, жестом или по средствам связи. Ведущий после получения информации принимает решения о остановке или продолжении движения с изменением или без изменения скорости движения, о чем информирует замыкающего. Замыкающий при восстановлении колонны информирует ведущего об этом.","isFootnote":false,"num":"191"},{"text":"192. Участники колонны должны своевременно оповещать ведущего и (или) замыкающего об обстоятельствах, препятствующих нормальному движению колонны.","isFootnote":false,"num":"192"}]},{"id":"ch27","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Приложение 1. Дорожные знаки","paragraphs":[{"text":"дорожного движения","isFootnote":false,"num":null},{"text":"Дорожные знаки","isFootnote":false,"num":null},{"text":"Правила применения и требования к дорожным знакам регламентируются Национальным стандартом Республики Казахстан 1125 \"Технические средства организации дорожного движения. Знаки дорожные. Общие технические требования\" (далее - СТ РК 1125), утвержденным приказом председателя Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан от 29 декабря 2021 года № 482-од и Национальным стандартом Республики Казахстан 1412 \"Технические средства регулирования дорожного движения. Правила применения\" (далее - СТ РК 1412), утвержденным приказом председателя Комитета технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан от 9 октября 2017 года № 274-од.","isFootnote":false,"num":null},{"text":"Маркировка дорожных знаков осуществляется в соответствии с законодательством в области технического регулирования Республики Казахстан.","isFootnote":false,"num":null}]},{"id":"ch28","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 1. Предупреждающие знаки","paragraphs":[{"text":"Сноска. Глава 1 с изменениями, внесенными приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Предупреждающие знаки информируют водителей о приближении к опасному участку дороги, движение по которому требует принятия мер, соответствующих обстановке.","isFootnote":false,"num":null},{"text":"1.1\"Железнодорожный переезд со шлагбаумом\".","isFootnote":false,"num":null},{"text":"1.2 \"Железнодорожный переезд без шлагбаума\".","isFootnote":false,"num":"1.2"},{"text":"1.3.1 \"Однопутная железная дорога\".","isFootnote":false,"num":"1.3.1"},{"text":"1.3.2 \"Многопутная железная дорога\". Обозначение необорудованного шлагбаумом переезда через железную дорогу: 1.3.1 - с одним путем, 1.3.2 – с двумя путями и более.","isFootnote":false,"num":"1.3.2"},{"text":"1.4.1 - 1.4.6 \"Приближение к железнодорожному переезду\". Дополнительное предупреждение о приближении к железнодорожному переезду вне населенных пунктов.","isFootnote":false,"num":"1.4.1"},{"text":"1.5 \"Пересечение с трамвайной линией\".","isFootnote":false,"num":"1.5"},{"text":"1.6 \"Пересечение равнозначных дорог\".","isFootnote":false,"num":"1.6"},{"text":"1.7 \"Пересечение с круговым движением\".","isFootnote":false,"num":"1.7"},{"text":"1.8 \"Светофорное регулирование\". Перекресток, пешеходный переход или участок дороги, движение на котором регулируется светофором.","isFootnote":false,"num":"1.8"},{"text":"1.9 \"Разводной мост\". Разводной мост или паромная переправа.","isFootnote":false,"num":"1.9"},{"text":"1.10 \"Выезд на набережную\". Выезд на набережную или берег.","isFootnote":false,"num":"1.10"},{"text":"1.11.1, 1.11.2 \"Опасный поворот\". Закругление дороги малого радиуса или с ограниченной видимостью: 1.11.1- направо, 1.11.2 - налево.","isFootnote":false,"num":null},{"text":"1.12.1, 1.12.2 \"Опасные повороты\". Участок дороги с опасными поворотами: 1.12.1 - с первым поворотом направо, 1.12.2 - с первым поворотом налево.","isFootnote":false,"num":null},{"text":"1.13 \"Крутой спуск\".","isFootnote":false,"num":"1.13"},{"text":"1.14 \"Крутой подъем\".","isFootnote":false,"num":"1.14"},{"text":"1.15 \"Скользкая дорога\". Участок дороги с повышенной скользкостью проезжей части.","isFootnote":false,"num":"1.15"},{"text":"1.16 \"Неровная дорога\". Участок дороги, имеющий неровности на проезжей части (волнистость, выбоины, неплавные сопряжения с мостами и тому подобное).","isFootnote":false,"num":"1.16"},{"text":"1.16.1 \"Искусственная неровность\".","isFootnote":false,"num":"1.16.1"},{"text":"1.17 \"Выброс гравия\". Участок дороги, на котором возможен выброс гравия, щебня и тому подобного из-под колес транспортных средств.","isFootnote":false,"num":"1.17"},{"text":"1.18.1 - 1.18.3 \"Сужение дороги\". Сужение с обеих сторон - 1.18.1, справа - 1.18.2, слева - 1.18.3.","isFootnote":false,"num":"1.18.1"},{"text":"1.19 \"Двустороннее движение\". Начало участка дороги (проезжей части) с встречным движением.","isFootnote":false,"num":"1.19"},{"text":"1.20 \"Пешеходный переход\". Пешеходный переход, обозначенный знаками 5.16.1, 5.16.2 и (или) разметками 1.14.1 - 1.14.3.","isFootnote":false,"num":"1.20"},{"text":"1.21 \"Дети\". Участок дороги вблизи детского учреждения (школы, оздоровительного лагеря и тому подобного), на проезжей части которого возможно появление детей.","isFootnote":false,"num":"1.21"},{"text":"1.22 \"Пересечение с велосипедной дорожкой\".","isFootnote":false,"num":"1.22"},{"text":"1.23 \"Дорожные работы\".","isFootnote":false,"num":"1.23"},{"text":"1.24 \"Перегон скота\".","isFootnote":false,"num":"1.24"},{"text":"1.25 \"Дикие животные\".","isFootnote":false,"num":"1.25"},{"text":"1.26 \"Падение камней\". Участок дороги, на котором возможны обвалы, оползни, падение камней.","isFootnote":false,"num":"1.26"},{"text":"1.27 \"Боковой ветер\".","isFootnote":false,"num":"1.27"},{"text":"1.28 \"Низколетящие самолеты\".","isFootnote":false,"num":"1.28"},{"text":"1.29 \"Тоннель\". Тоннель, в котором отсутствует искусственное освещение, или тоннель, видимость въездного портала которого ограничена.","isFootnote":false,"num":"1.29"},{"text":"1.30 \"Прочие опасности\". Участок дороги, на котором имеются опасности, не предусмотренные другими предупреждающими знаками.","isFootnote":false,"num":"1.30"},{"text":"1.31.1, 1.31.2 \"Направление поворота\". Направление движения на закруглении дороги малого радиуса с ограниченной видимостью. Направление объезда ремонтируемого участка дороги.","isFootnote":false,"num":null},{"text":"1.31.3 \"Направление поворота\". Направления движения на Т-образном перекрестке или разветвлении дорог. Направления объезда ремонтируемого участка дороги.","isFootnote":false,"num":"1.31.3"},{"text":"1.31.4, 1.31.5 \"Направление поворота\".","isFootnote":false,"num":null},{"text":"1.32.1, 1.32.2 и 1.32.3 \"Объезд препятствия\".","isFootnote":false,"num":null},{"text":"1.33 \"Опасная обочина\".","isFootnote":false,"num":"1.33"},{"text":"1.34 \"Затор\".","isFootnote":false,"num":"1.34"},{"text":"Предупреждающие знаки 1.1, 1.2, 1.5-1.30 вне населенных пунктов устанавливаются на расстоянии 150 - 300 м, а в населенных пунктах и жилых зонах - на расстоянии 50 - 100 м до начала опасного участка. При необходимости знаки могут устанавливаться и на ином расстоянии, которое в этом случае указывается на табличке 7.1.1.","isFootnote":false,"num":null},{"text":"Знаки 1.13 и 1.14 могут устанавливаться без таблички 7.1.1 непосредственно перед началом спуска или подъема, если спуски и подъемы следуют друг за другом.","isFootnote":false,"num":null},{"text":"Знак 1.23 при проведении краткосрочных работ на проезжей части может быть установлен (без таблички 7.1.1) на расстоянии 10 - 15 м до места проведения работ.","isFootnote":false,"num":null},{"text":"Вне населенных пунктов знаки 1.1, 1.2, 1.9, 1.10, 1.21 и 1.23 повторяются. Второй знак устанавливается на расстоянии не менее 50 м до начала опасного участка.","isFootnote":false,"num":null},{"text":"Знаки 1.4.1 - 1.4.3 устанавливаются с правой стороны дороги, а знаки 1.4.4 - 1.4.6 - с левой. Знаки 1.4.1 и 1.4.4 - под первым по ходу движения знаком 1.1 или 1.2, знаки 1.4.3 и 1.4.6 - под вторым знаком 1.1 или 1.2, а знаки 1.4.2 и 1.4.5 - самостоятельно, на равном расстоянии между первым и вторым знаком 1.1 или 1.2.","isFootnote":false,"num":null},{"text":"Знаки 1.3.1 и 1.3.2 устанавливаются непосредственно перед железнодорожным переездом.","isFootnote":false,"num":null}]},{"id":"ch29","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 2. Знаки приоритета","paragraphs":[{"text":"Сноска. Глава 2 с изменением, внесенным приказом Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Знаки приоритета устанавливают очередность проезда перекрестков, пересечений проезжих частей или узких участков дороги.","isFootnote":false,"num":null},{"text":"2.1 \"Главная дорога\". Дорога, на которой предоставлено право преимуществ венного проезда нерегулируемых перекрестков.","isFootnote":false,"num":"2.1"},{"text":"2.2 \"Конец главной дороги\".","isFootnote":false,"num":"2.2"},{"text":"2.3.1 \"Пересечение со второстепенной дорогой\".","isFootnote":false,"num":"2.3.1"},{"text":"2.3.2, 2.3.3, 2.3.4, 2.3.5, 2.3.6 и 2.3.7 \"Примыкание второстепенной дороги\". Примыкание справа - 2.3.2, 2.3.4 и 2.3.6 слева - 2.3.3, 2.3.5 и 2.3.7.","isFootnote":false,"num":null},{"text":"2.4 \"Уступите дорогу\". Водитель уступает дорогу транспортным средствам, движущимся по пересекаемой дороге, а при наличии таблички 7.13 - по главной.","isFootnote":false,"num":"2.4"},{"text":"2.5 \"Движение без остановки запрещено\". Запрещается движение без остановки перед стоп-линией, а если ее нет - перед краем пересекаемой проезжей части. Водитель уступает дорогу транспортным средствам, движущимся по пересекаемой дороге, а при наличии таблички 7.13 – по главной.","isFootnote":false,"num":"2.5"},{"text":"Знак 2.5 может быть установлен перед железнодорожным переездом или карантинным постом. В этих случаях водитель останавливается перед стоп-линией, а при ее отсутствии - перед знаком.","isFootnote":false,"num":null},{"text":"2.6 \"Преимущество встречного движения\". Запрещается въезд на узкий участок дороги, если это может затруднить встречное движение. Водитель уступает дорогу встречным транспортным средствам, находящимся на узком участке или противоположном подъезде к нему.","isFootnote":false,"num":"2.6"},{"text":"2.7 \"Преимущество перед встречным движением\". Узкий участок дороги, при движении по которому водитель пользуется преимуществом по отношению к встречным транспортным средствам.","isFootnote":false,"num":"2.7"}]},{"id":"ch30","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 3. Запрещающие знаки","paragraphs":[{"text":"Сноска. Глава 3 с изменениями, внесенными приказом Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Запрещающие знаки вводят или отменяют определенные ограничения движения.","isFootnote":false,"num":null},{"text":"3.1 \"Въезд запрещен\". Запрещается въезд всех транспортных средств в данном направлении.","isFootnote":false,"num":"3.1"},{"text":"3.2 \"Движение запрещено\". Запрещается движение всех транспортных средств.","isFootnote":false,"num":"3.2"},{"text":"3.3 \"Движение механических транспортных средств запрещено\".","isFootnote":false,"num":"3.3"},{"text":"3.4 \"Движение грузовых автомобилей запрещено\". Запрещается движение грузовых автомобилей и составов транспортных средств с разрешенной максимальной массой более 3,5 т (если на знаке не указана масса) или разрешенной максимальной массой, более указанной на знаке, а также тракторов и самоходных машин.","isFootnote":false,"num":"3.4"},{"text":"Знак 3.4 не запрещает движение грузовых автомобилей с наклонной белой полосой на бортах или предназначенных для перевозки людей.","isFootnote":false,"num":null},{"text":"3.5 \"Движение мотоциклов запрещено\". Запрещается движение мотоциклов и мопедов.","isFootnote":false,"num":"3.5"},{"text":"3.6 \"Движение тракторов запрещено\". Запрещается движение тракторов и самоходных машин.","isFootnote":false,"num":"3.6"},{"text":"3.7 \"Движение транспортных средств с прицепом запрещено\". Запрещается движение грузовых автомобилей и тракторов с прицепами любого типа, а также буксировка механических транспортных средств.","isFootnote":false,"num":"3.7"},{"text":"3.8 \"Движение гужевых повозок запрещено\". Запрещается движение гужевых повозок (саней), верховых и вьючных животных, а также прогон скота.","isFootnote":false,"num":"3.8"},{"text":"3.9 \"Движение на велосипедах запрещено\". Запрещается движение велосипедов, электрических самокатов и малых электрических транспортных средств.","isFootnote":false,"num":"3.9"},{"text":"3.9.1. \"Движение на электрических самокатах запрещено\". Запрещается движение только электрических самокатов.","isFootnote":false,"num":"3.9.1"},{"text":"3.10 \"Движение пешеходов запрещено\".","isFootnote":false,"num":"3.10"},{"text":"3.11 \"Ограничение массы\". Запрещается движение транспортных средств, в том числе составов транспортных средств, общая фактическая масса которых больше указанной на знаке.","isFootnote":false,"num":"3.11"},{"text":"3.12 \"Ограничение нагрузки на ось\". Запрещается движение транспортных средств, у которых фактическая нагрузка на какую-либо ось больше указанной на знаке.","isFootnote":false,"num":"3.12"},{"text":"3.13 \"Ограничение высоты\". Запрещается движение транспортных средств, габаритная высота которых (с грузом или без груза) больше указанной на знаке.","isFootnote":false,"num":"3.13"},{"text":"3.14 \"Ограничение ширины\". Запрещается движение транспортных средств, габаритная ширина которых (с грузом или без груза) больше указанной на знаке.","isFootnote":false,"num":"3.14"},{"text":"3.15 \"Ограничение длины\". Запрещается движение транспортных средств (составов транспортных средств), габаритная длина которых (с грузом или без груза) больше указанной на знаке.","isFootnote":false,"num":"3.15"},{"text":"3.16 \"Ограничение минимальной дистанции\". Запрещается движение транспортных средств с дистанцией между ними меньше указанной на знаке.","isFootnote":false,"num":"3.16"},{"text":"3.17.1 \"Таможня\". Запрещается проезд без остановки у таможни (контрольного пункта).","isFootnote":false,"num":"3.17.1"},{"text":"3.17.2 \"Опасность\". Запрещается дальнейшее движение всех без исключения транспортных средств в связи с дорожно-транспортным происшествием, аварией или другой опасностью.","isFootnote":false,"num":"3.17.2"},{"text":"3.17.3 \"Контроль\". Запрещается проезд без остановки через контрольные пункты.","isFootnote":false,"num":"3.17.3"},{"text":"3.18.1 \"Поворот направо запрещен\".","isFootnote":false,"num":"3.18.1"},{"text":"3.18.2 \"Поворот налево запрещен\".","isFootnote":false,"num":"3.18.2"},{"text":"3.19 \"Разворот запрещен\".","isFootnote":false,"num":"3.19"},{"text":"3.20 \"Обгон запрещен\". Запрещается обгон всех транспортных средств, кроме одиночных, движущихся со скоростью менее 30 км/ч.","isFootnote":false,"num":"3.20"},{"text":"3.21 \"Конец зоны запрещения обгона\".","isFootnote":false,"num":"3.21"},{"text":"3.22 \"Обгон грузовым автомобилям запрещен\". Запрещается грузовым автомобилям с разрешенной максимальной массой более 3,5 т обгон всех транспортных средств, кроме одиночных, движущихся со скоростью менее 30 км/ч. Тракторам запрещается обгон всех транспортных средств, кроме гужевых повозок и велосипедов.","isFootnote":false,"num":"3.22"},{"text":"3.23 \"Конец зоны запрещения обгона грузовым автомобилям\".","isFootnote":false,"num":"3.23"},{"text":"3.24 \"Ограничение максимальной скорости\". Запрещается движение со скоростью (км/ч), превышающей указанную на знаке.","isFootnote":false,"num":"3.24"},{"text":"Если вводимое на данном участке дороги ограничение максимальной скорости более чем на 20 км/ч отличается от допускаемой скорости движения на предшествующем участке, применяется ступенчатое ограничение скорости с шагом не более 20 км/ч путем последовательной установки знаков 3.24, удаленных друг от друга на расстоянии от 100 метров до 150 метров.","isFootnote":false,"num":null},{"text":"Ступенчатое ограничение скорости не применяется перед населенными пунктами, обозначенными знаками 5.22, если видимость знаков составляет не менее 150 метров.","isFootnote":false,"num":null},{"text":"3.25 \"Конец зоны ограничения максимальной скорости\".","isFootnote":false,"num":"3.25"},{"text":"3.26 \"Подача звукового сигнала запрещена\". Запрещается пользоваться звуковыми сигналами, кроме тех случаев, когда сигнал подается для предотвращения дорожно-транспортного происшествия.","isFootnote":false,"num":"3.26"},{"text":"3.27 \"Остановка запрещена\". Запрещаются остановка и стоянка транспортных средств.","isFootnote":false,"num":"3.27"},{"text":"3.28 \"Стоянка запрещена\". Запрещается стоянка транспортных средств.","isFootnote":false,"num":"3.28"},{"text":"3.29 \"Стоянка запрещена по нечетным числам месяца\".","isFootnote":false,"num":"3.29"},{"text":"3.30 \"Стоянка запрещена по четным числам месяца\". При одновременном применении знаков 3.29 и 3.30 время перестановки транспортных средств с одной стороны на другую - с 19 до 21 часа.","isFootnote":false,"num":"3.30"},{"text":"3.31 \"Конец зоны всех ограничений\". Обозначение конца зоны действия одновременно несколькими знаками из следующих: 3.16, 3.20, 3.22, 3.24, 3.26 - 3.30.","isFootnote":false,"num":"3.31"},{"text":"3.32 \"Движение транспортных средств с опасными грузами запрещено\". Запрещается движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\".","isFootnote":false,"num":"3.32"},{"text":"3.33 \"Движение транспортных средств со взрывчатыми и легковоспламеняющимися грузами запрещено\". Запрещается движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\" и предназначенных для перевозки опасных грузов классов 1,2.2 - 2.4, 3.1, 3.2, 5.2.","isFootnote":false,"num":"3.33"},{"text":"Знаки 3.2 - 3.9, 3.32 и 3.33 запрещают движение соответствующих видов транспортных средств в обоих направлениях.","isFootnote":false,"num":null},{"text":"Действие знаков не распространяется:","isFootnote":false,"num":null},{"text":"3.1 - 3.3, 3.18.1, 3.18.2, 3.19, 3.27 - на маршрутные транспортные средства;","isFootnote":false,"num":"3.1"},{"text":"3.2 - 3.8 - на транспортные средства, которые обслуживают предприятия, находящиеся в обозначенной зоне, а также обслуживают граждан или принадлежат гражданам, проживающим или работающим в обозначенной зоне. В этих случаях транспортные средства должны въезжать в обозначенную зону и выезжать из нее на ближайшем к месту назначения перекрестке;","isFootnote":false,"num":"3.2"},{"text":"3.28 - 3.30 - на такси с включенным таксометром;","isFootnote":false,"num":"3.28"},{"text":"3.2, 3.3, 3.28 - 3.30 – на транспортные средства, управляемые лицами с инвалидностью первой и второй групп, а также третьей группы с нарушениями опорно-двигательного аппарата или перевозящие лиц с такими группами инвалидности.","isFootnote":false,"num":null},{"text":"Действие знаков 3.18.1, 3.18.2 распространяется на пересечение проезжих частей, перед которым установлен знак.","isFootnote":false,"num":null},{"text":"Зона действия знаков 3.16, 3.20, 3.22, 3.24, 3.26 - 3.30 распространяется от места установки знака до ближайшего перекрестка за ним, а в населенных пунктах при отсутствии перекрестка - до конца населенного пункта.","isFootnote":false,"num":null},{"text":"Действие знака 3.24, установленного перед населенным пунктом, обозначенным знаком 5.22, распространяется до этого знака.","isFootnote":false,"num":null},{"text":"Зона действия знаков может быть уменьшена:","isFootnote":false,"num":null},{"text":"для знаков 3.16 и 3.26 применением таблички 7.2.1;","isFootnote":false,"num":null},{"text":"для знаков 3.20, 3.22, 3.24 установкой в конце зоны их действия соответственно знаков 3.21, 3.23, 3.25 или применением таблички 7.2.1. Зона действия знака 3.24 может быть уменьшена установкой знака 3.24 с другим значением максимальной скорости движения;","isFootnote":false,"num":null},{"text":"для знаков 3.27 - 3.30 установкой в конце зоны их действия повторных знаков 3.27 - 3.30 с табличкой 7.2.3 или применением таблички 7.2.2. Знак 3.27 может быть применен совместно с разметкой 1.4, а знак 3.28 - с разметкой 1.10, при этом зона действия знаков определяется протяженностью линии разметки.","isFootnote":false,"num":null},{"text":"Действие знаков 3.10, 3.27 - 3.30 распространяется только на ту сторону дороги, на которой они установлены.","isFootnote":false,"num":null}]},{"id":"ch31","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 4. Предписывающие знаки","paragraphs":[{"text":"Сноска. Глава 4 с изменениями, внесенными приказами Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"4.1.1 \"Движение прямо\", 4.1.2 \"Движение направо\", 4.1.3 \"Движение налево\", 4.1.4 \"Движение прямо или направо\", 4.1.5 \"Движение прямо или налево\", 4.1.6 \"Движение направо или налево2. Разрешается движение только в направлениях, указанных на знаках стрелками. Знаки, разрешающие поворот налево, разрешают и разворот (могут быть применены знаки 4.1.1 - 4.1.6 с конфигурацией стрелок, соответствующей требуемым направлениям движения на конкретном пересечении).","isFootnote":false,"num":"4.1.1"},{"text":"Действие знаков 4.1.1 - 4.1.6 не распространяется на маршрутные транспортные средства.","isFootnote":false,"num":null},{"text":"Действие знаков 4.1.1 - 4.1.6 распространяется на пересечение проезжих частей, перед которым установлен знак.","isFootnote":false,"num":null},{"text":"Действие знака 4.1.1, установленного в начале участка дороги, распространяется до ближайшего перекрестка. Знак не запрещает поворот направо на прилегающие территории.","isFootnote":false,"num":null},{"text":"Примечание. Нумерация дорожных знаков соответствует СТ РК 1125. Наименования и изображения дорожных знаков приведены на рис. 2. Изображения дорожных знаков 4.1.2 и 4.1.3 изменены в соответствии с СТ РК 1125, предыдущие изображения данных дорожных знаков действуют до их замены.","isFootnote":false,"num":null},{"text":"4.2.1 \"Объезд препятствия справа\", 4.2.2 \"Объезд препятствия слева\". Объезд разрешается только со стороны, указанной стрелкой.","isFootnote":false,"num":"4.2.1"},{"text":"4.2.3 \"Объезд препятствия справа или слева\". Объезд разрешается с любой стороны.","isFootnote":false,"num":"4.2.3"},{"text":"4.3 \"Круговое движение\". Разрешается движение в указанном стрелками направлении.","isFootnote":false,"num":"4.3"},{"text":"4.4 \"Движение легковых автомобилей\". Разрешается движение легковых автомобилей, автобусов, мотоциклов, маршрутных транспортных средств и грузовых автомобилей, разрешенная максимальная масса которых не превышает 3,5 тонн.","isFootnote":false,"num":"4.4"},{"text":"Знак разрешает движение и других транспортных средств, которые обслуживают предприятия, находящиеся в обозначенной зоне, а также обслуживают граждан или принадлежат гражданам, проживающим или работающим в обозначенной зоне. В этих случаях транспортные средства должны въезжать в обозначенную зону и выезжать из нее на ближайшем к месту назначения перекрестке.","isFootnote":false,"num":null},{"text":"4.5 \"Велосипедная дорожка или велосипедная полоса движения\". Разрешается движение только на велосипедах, электрических самокатах и малых электрических транспортных средствах.","isFootnote":false,"num":"4.5"},{"text":"4.5.1 \"Конец велосипедной дорожки или велосипедной полосы движения\".","isFootnote":false,"num":"4.5.1"},{"text":"4.5.4, 4.5.5 \"Пешеходная и велосипедная дорожка с разделением движения\". Дорожки, предназначенные для совместного движения пешеходов, велосипедов, электрических самокатов, малых электрических транспортных средств, когда потоки пешеходов, велосипедов, электрических самокатов, малых электрических транспортных средств разделяются на самостоятельные потоки.","isFootnote":false,"num":null},{"text":"4.5.6, 4.5.7 \"Конец пешеходной и велосипедной дорожки с разделением движения\".","isFootnote":false,"num":null},{"text":"4.6 \"Пешеходная дорожка\". Разрешается движение только пешеходам.","isFootnote":false,"num":"4.6"},{"text":"4.7 \"Ограничение минимальной скорости\". Разрешается движение только с указанной или большей скоростью (км/ч).","isFootnote":false,"num":"4.7"},{"text":"4.8 \"Конец зоны ограничения минимальной скорости\".","isFootnote":false,"num":"4.8"},{"text":"4.9.1, 4.9.2, 4.9.3 \"Направление движения транспортных средств с опасными грузами\". Движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\", разрешается только в направлении, указанном на знаке: 4.9.1 - направо, 4.9.2 - налево, 4.9.3 - прямо.","isFootnote":false,"num":null}]},{"id":"ch32","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 5. Информационно-указательные знаки","paragraphs":[{"text":"Сноска. Глава 5 с изменениями, внесенными приказами Министра внутренних дел РК от 17.04.2024 № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Информационно-указательные знаки вводят или отменяют определенные режимы движения, а также информируют о расположении населенных пунктов и других объектов.","isFootnote":false,"num":null},{"text":"5.1 \"Автомагистраль\". Дорога, на которой действуют требования настоящих Правил, устанавливающие порядок движения по автомагистралям.","isFootnote":false,"num":"5.1"},{"text":"5.2 \"Конец автомагистрали\".","isFootnote":false,"num":"5.2"},{"text":"5.3 \"Дорога для автомобилей\". Дорога, предназначенная для движения только автомобилей и мотоциклов.","isFootnote":false,"num":"5.3"},{"text":"5.4 \"Конец дороги для автомобилей\".","isFootnote":false,"num":"5.4"},{"text":"5.5 \"Дорога с односторонним движением\". Дорога или проезжая часть, по которой движение транспортных средств по всей ширине осуществляется в одном направлении.","isFootnote":false,"num":"5.5"},{"text":"5.6 \"Конец дороги с односторонним движением\".","isFootnote":false,"num":"5.6"},{"text":"5.7.1, 5.7.2 \"Выезд на дорогу с односторонним движением\". Выезд на дорогу или проезжую часть с односторонним движением.","isFootnote":false,"num":null},{"text":"5.8.1 \"Направления движения по полосам\". Число полос и разрешенные направления движения на каждой из них.","isFootnote":false,"num":"5.8.1"},{"text":"Если на знаке 5.8.1 изображен знак 5.9.1 – 5.9.4, то его действие этих знаков распространяется на указанную полосу.","isFootnote":false,"num":null},{"text":"5.8.2 \"Направления движения по полосе\". Разрешенные направления движения по полосе.","isFootnote":false,"num":"5.8.2"},{"text":"Знаки 5.8.1 и 5.8.2, разрешающие поворот налево из крайней левой полосы, разрешают и разворот с этой полосы.","isFootnote":false,"num":null},{"text":"Действие знаков 5.8.1 и 5.8.2, установленных перед перекрестком, распространяется на весь перекресток, если другие знаки 5.8.1 и 5.8.2, установленные на нем, не дают иных указаний.","isFootnote":false,"num":null},{"text":"5.8.2а \"Направление движения по полосе\".","isFootnote":false,"num":"5.8.2а"},{"text":"Если на знаке 5.8.1, 5.8.2, 5.8.2а изображен знак, запрещающий движение каким-либо транспортным средствам, то движение этих транспортных средств по соответствующей полосе запрещается.","isFootnote":false,"num":null},{"text":"5.8.3 \"Начало полосы\". Начало дополнительной полосы на подъеме или полосы торможения.","isFootnote":false,"num":"5.8.3"},{"text":"Если на знаке, установленном перед дополнительной полосой, изображен знак 4.7 \"Ограничение минимальной скорости\", то водитель транспортного средства, который не может продолжать движение по основной полосе с указанной или большей скоростью, перестраивается на дополнительную полосу.","isFootnote":false,"num":null},{"text":"5.8.3а \"Обязательная минимальная скорость на различных полосах движения\".","isFootnote":false,"num":"5.8.3а"},{"text":"5.8.4 \"Начало полосы\". Начало участка средней полосы трехполосной дороги, предназначенного для движения в данном направлении.","isFootnote":false,"num":"5.8.4"},{"text":"5.8.4а \"Начало полосы\".","isFootnote":false,"num":"5.8.4а"},{"text":"5.8.5 \"Конец полосы\". Конец дополнительной полосы на подъеме или полосы разгона.","isFootnote":false,"num":"5.8.5"},{"text":"5.8.6 \"Конец полосы\". Конец участка средней полосы на трехполосной дороге, предназначенного для движения в данном направлении.","isFootnote":false,"num":"5.8.6"},{"text":"5.8.6а - 5.8.6в \"Перестроение на параллельную проезжую часть\". Информируют водителей о приоритетах движения при перестроении на параллельную проезжую часть.","isFootnote":false,"num":"5.8.6а"},{"text":"5.8.6г, 5.8.6д \"Конец параллельной проезжей части\". Информируют водителей о и приоритетах движения при слиянии параллельных проезжих частей.","isFootnote":false,"num":null},{"text":"5.8.7, 5.8.8 \"Направление движения по полосам\".","isFootnote":false,"num":null},{"text":"5.8.8а \"Направления движения по полосам\".","isFootnote":false,"num":"5.8.8а"},{"text":"5.8.9 \"Ограничение скорости, действующее на различных полосах движения\".","isFootnote":false,"num":"5.8.9"},{"text":"Если на знаке 5.8.7 изображен знак, запрещающий движение каким-либо транспортным средствам, то движение этих транспортных средств по соответствующей полосе запрещается.","isFootnote":false,"num":null},{"text":"Знаки 5.8.7 и 5.8.8 с соответствующим числом стрелок могут применяться на дорогах с четырьмя полосами и более.","isFootnote":false,"num":null},{"text":"С помощью знаков 5.8.7 и 5.8.8 со сменным изображением может быть организовано реверсивное движение.","isFootnote":false,"num":null},{"text":"5.9 \"Полоса для маршрутных транспортных средств\". Полоса, предназначенная для движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, движущихся попутно общему потоку транспортных средств.","isFootnote":false,"num":"5.9"},{"text":"5.9.1 \"Конец полосы для маршрутных транспортных средств\". Конец полосы, предназначенной для движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, движущихся попутно общему потоку транспортных средств.","isFootnote":false,"num":"5.9.1"},{"text":"5.9.2 - 5.9.4 \"Знаки направления движения для общественного транспорта\". Указывает направление движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, по полосе для маршрутных транспортных средств перед перекрестком в случаях, когда в прямом направлении движение невозможно.","isFootnote":false,"num":"5.9.2"},{"text":"5.10.1 \"Дорога с полосой для маршрутных транспортных средств\". Дорога, по которой движение маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, осуществляется по специально выделенной полосе навстречу общему потоку транспортных средств.","isFootnote":false,"num":"5.10.1"},{"text":"5.10.2, 5.10.3 \"Выезд на дорогу с полосой для маршрутных транспортных средств\".","isFootnote":false,"num":null},{"text":"5.10.4 \"Конец дороги с полосой для маршрутных транспортных средств\".","isFootnote":false,"num":"5.10.4"},{"text":"5.10.5 \"Дорога с полосой для велосипедистов\". Движение велосипедов осуществляется по велосипедной полосе навстречу общему потоку транспортных средств.","isFootnote":false,"num":"5.10.5"},{"text":"5.10.7 \"Конец дороги с полосой для велосипедистов\".","isFootnote":false,"num":"5.10.7"},{"text":"5.10.8, 5.10.9 \"Выезд на дорогу с полосой для велосипедистов\".","isFootnote":false,"num":null},{"text":"5.11.1 \"Место для разворота\". Поворот налево запрещается.","isFootnote":false,"num":"5.11.1"},{"text":"5.11.2 \"Зона для разворота\". Протяженность зоны для разворота. Поворот налево запрещается.","isFootnote":false,"num":"5.11.2"},{"text":"Информационно-указательные знаки 5.8.1-5.8.8, 5.11.1 и 5.11.2 могут совмещаться с запрещающими знаками 3.3-3.8.","isFootnote":false,"num":null},{"text":"5.12 \"Место остановки автобуса и (или) троллейбуса\".","isFootnote":false,"num":"5.12"},{"text":"5.13 \"Место остановки трамвая\".","isFootnote":false,"num":"5.13"},{"text":"5.14 \"Место стоянки легковых такси\".","isFootnote":false,"num":"5.14"},{"text":"5.15 \"Место стоянки\".","isFootnote":false,"num":"5.15"},{"text":"5.16.1, 5.16.2 \"Пешеходный переход\".","isFootnote":false,"num":null},{"text":"При отсутствии на переходе разметок 1.14.1 - 1.14.3 знак 5.16.2 устанавливается справа от дороги на ближней границе перехода, а знак 5.16.1 - слева от дороги на дальней границе перехода.","isFootnote":false,"num":null},{"text":"5.16.3 \"Диагональный пешеходный переход\".","isFootnote":false,"num":"5.16.3"},{"text":"5.17.1, 5.17.2 \"Подземный пешеходный переход\".","isFootnote":false,"num":null},{"text":"5.17.3, 5.17.4 \"Надземный пешеходный переход\".","isFootnote":false,"num":null},{"text":"5.18.1. Рекомендуемая скорость. Скорость, с которой рекомендуется движение на данном участке дороги. Зона действия знака распространяется до ближайшего перекрестка, а при применении знака 5.18.1. совместно с предупреждающим знаком определяется протяженностью опасного участка.","isFootnote":false,"num":"5.18.1"},{"text":"5.18.2 \"Конец зоны действия знака \"Рекомендуемая скорость\".","isFootnote":false,"num":"5.18.2"},{"text":"5.19.1 - 5.19.3 \"Тупик\". Дорога, не имеющая сквозной проезд.","isFootnote":false,"num":"5.19.1"},{"text":"5.20.1 \"Предварительный указатель направлений\".","isFootnote":false,"num":"5.20.1"},{"text":"5.20.2 \"Предварительный указатель направления\". Направления движения к обозначенным на знаке населенным пунктам и другим объектам. На знаках могут быть нанесены изображения знака 5.29.1, символы автомагистрали, аэропорта, спортивные и иные пиктограммы. На знаке 5.20.1 могут быть нанесены изображения других знаков, информирующих об особенностях движения. В нижней части знака 5.20.1 указывается расстояние от места установки знака до перекрестка или начала полосы торможения.","isFootnote":false,"num":"5.20.2"},{"text":"Знак 5.20.1 применяется также для указания объезда участков дорог, на которых установлен один из запрещающих знаков 3.11 - 3.15.","isFootnote":false,"num":null},{"text":"5.20.3 \"Схема движения\". Маршрут движения при запрещении на перекрестке отдельных маневров или разрешенные направления движения на сложном перекрестке.","isFootnote":false,"num":"5.20.3"},{"text":"5.21.1 \"Указатель направления\", 5.21.2 \"Указатель направлений\". Направления движения к пунктам маршрута. На знаках может быть указано расстояние до обозначенных на нем объектов (км), нанесены символы автомагистрали, аэропорта, спортивные и иные пиктограммы.","isFootnote":false,"num":"5.21.1"},{"text":"5.22 \"Начало населенного пункта\". Наименование и начало населенного пункта, в котором действуют требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","isFootnote":false,"num":"5.22"},{"text":"5.22а \"Начало населенного пункта\".","isFootnote":false,"num":"5.22а"},{"text":"5.23 \"Конец населенного пункта\". Место, с которого на данной дороге утрачивают силу требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","isFootnote":false,"num":"5.23"},{"text":"5.23а \"Конец населенного пункта\".","isFootnote":false,"num":"5.23а"},{"text":"5.24 \"Начало населенного пункта\". Наименование и начало населенного пункта, в котором на данной дороге не действуют требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","isFootnote":false,"num":"5.24"},{"text":"5.25 \"Конец населенного пункта\". Конец населенного пункта, обозначенного знаком 5.24.","isFootnote":false,"num":"5.25"},{"text":"5.26 \"Наименование объекта\". Наименование объекта иного, чем населенный пункт (река, озеро, перевал, достопримечательность и тому подобное).","isFootnote":false,"num":"5.26"},{"text":"5.27 \"Указатель расстояний\". Расстояние до населенных пунктов (км), расположенных на маршруте.","isFootnote":false,"num":"5.27"},{"text":"5.28 \"Километровый знак\". Расстояние до начала или конца дороги (км). 5.29.1, 5.29.2 \"Номер маршрута\". 5.29.1 - номер, присвоенный дороге (маршруту); 5.29.2 - номер и направление дороги (маршрута).","isFootnote":false,"num":"5.28"},{"text":"5.30.1 - 5.30.5 \"Направление движения для грузовых автомобилей\". Рекомендуемое направление движения для грузовых автомобилей, тракторов и самоходных машин, если на перекрестке их движение в одном из направлений запрещено.","isFootnote":false,"num":"5.30.1"},{"text":"5.31 \"Схема объезда\". Маршрут объезда участка дороги, временно закрытого для движения.","isFootnote":false,"num":"5.31"},{"text":"5.32.1 - 5.32.3 \"Направление объезда\". Направление участка дороги, временно закрытого для движения.","isFootnote":false,"num":"5.32.1"},{"text":"5.33 \"Стоп-линия\". Место остановки транспортных средств при запрещающем сигнале светофора (регулировщика).","isFootnote":false,"num":"5.33"},{"text":"5.34.1, 5.34.2 \"Предварительный указатель перестроения на другую проезжую часть\". Направление объезда закрытого для движения участка проезжей части на дороге с разделительной полосой или направление движения для возвращения на правую проезжую часть.","isFootnote":false,"num":null},{"text":"5.35 \"Реверсивное движение\". Начало участка дороги, на котором на одной или нескольких полосах направление движения может изменяться на противоположное.","isFootnote":false,"num":"5.35"},{"text":"5.36 \"Конец реверсивного движения\".","isFootnote":false,"num":"5.36"},{"text":"5.37 \"Выезд на дорогу с реверсивным движением\".","isFootnote":false,"num":"5.37"},{"text":"5.38 \"Жилая зона\". Территория, на которой действуют требования настоящих Правил, устанавливающие порядок движения в жилой зоне.","isFootnote":false,"num":"5.38"},{"text":"5.39 \"Конец жилой зоны\".","isFootnote":false,"num":"5.39"},{"text":"5.40 \"Общие ограничения максимальной скорости\".","isFootnote":false,"num":"5.40"},{"text":"5.41 \"Площадка для аварийной остановки\".","isFootnote":false,"num":"5.41"},{"text":"Примечание ИЗПИ!","isFootnote":false,"num":null},{"text":"Абзац восемьдесят первый главы 5 предусматривается в редакции приказа Министра внутренних дел РК от 27.04.2026 № 305 (вводятся в действие с 12.07.2026).","isFootnote":false,"num":null},{"text":"5.42 \"Фотовидеофиксация\". Осуществляется фиксация нарушений настоящих Правил стационарным сертифицированным специальным техническим средством и прибором, при этом установка знака необязательна.","isFootnote":false,"num":"5.42"},{"text":"5.43 \"Искусственная неровность\". Обозначает границы искусственной неровности. Устанавливается на ближней границе искусственной неровности или разметки 1.25 относительно приближающихся транспортных средств.","isFootnote":false,"num":"5.43"},{"text":"5.44 \"Зона с ограничениями стоянки\". Место, с которого начинается территория (участок дороги), где стоянка запрещена.","isFootnote":false,"num":"5.44"},{"text":"5.45 \"Конец зоны с ограничениями стоянки\".","isFootnote":false,"num":"5.45"},{"text":"5.46 \"Зона с ограничением максимальной скорости\". Место, с которого начинается территория (участок дороги), где ограничена максимальная скорость движения.","isFootnote":false,"num":"5.46"},{"text":"5.47 \"Конец зоны с ограничением максимальной скорости\".","isFootnote":false,"num":"5.47"},{"text":"5.48 \"Пешеходная зона\". Место, с которого начинается территория (участок дороги), на которой разрешено движение только пешеходов.","isFootnote":false,"num":"5.48"},{"text":"5.49 \"Конец пешеходной зоны\".","isFootnote":false,"num":"5.49"},{"text":"5.50 \"Зона с ограничением экологического класса механических транспортных средств\". Запрещается движение механических транспортных средств или вида(ов) транспортного средства, экологический класс которых ниже экологического класса, указанного на знаке, или экологический класс которых не указан в регистрационных документах на эти транспортные средства.","isFootnote":false,"num":"5.50"},{"text":"5.51 \"Конец зоны с ограничением экологического класса механических транспортных средств\".","isFootnote":false,"num":"5.51"},{"text":"На знаках 5.20.1, 5.20.2, 5.21.1 и 5.21.2, установленных вне населенного пункта, зеленый или синий фон означает, что движение к указанному населенному пункту или объекту будет осуществляться соответственно по автомагистрали или другой дороге. На знаках 5.20.1, 5.20.2, 5.21.1 и 5.21.2, установленных в населенном пункте, зеленый или синий фон означает, что движение к указанному населенному пункту или объекту после выезда из данного населенного пункта будет осуществляться соответственно по автомагистрали или другой дороге; белый фон означает, что указанный объект находится в данном населенном пункте.","isFootnote":false,"num":null}]},{"id":"ch33","partId":"signs","partTitle":"Приложение 1. Дорожные знаки","partTitleKk":"1-қосымша. Жол белгілері","title":"Глава 6. Знаки сервиса","paragraphs":[{"text":"Сноска. Глава 6 с изменением, внесенным приказом Министра внутренних дел РК от 10.11.2025 № 859 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","isFootnote":true,"num":null},{"text":"Знаки сервиса информируют о расположении соответствующих объектов.","isFootnote":false,"num":null},{"text":"6.1 \"Пункт первой медицинской помощи\".","isFootnote":false,"num":"6.1"},{"text":"6.2 \"Больница\".","isFootnote":false,"num":"6.2"},{"text":"6.3 \"Автозаправочная станция\".","isFootnote":false,"num":"6.3"},{"text":"6.3а \"Автозаправочная станция на сниженном нефтяном газе\".","isFootnote":false,"num":"6.3а"},{"text":"6.3б \"Автозаправочная станция на сжатом природном газе\".","isFootnote":false,"num":"6.3б"},{"text":"6.4 \"Техническое обслуживание автомобилей\".","isFootnote":false,"num":"6.4"},{"text":"6.5 \"Мойка автомобилей\".","isFootnote":false,"num":"6.5"},{"text":"6.6 \"Телефон\".","isFootnote":false,"num":"6.6"},{"tex
